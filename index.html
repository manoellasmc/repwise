lift the dumbbells, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.","Lower the dumbbells back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."],"sh":8,"p":1,"fo":"pull","pt":"Remada alta com halteres"},{"id":"Stiff-Legged_Dumbbell_Deadlift","n":"Stiff-Legged Dumbbell Deadlift","eq":"dumbbell","lv":"beginner","pm":["hamstrings"],"sm":["glutes","lower back"],"mc":"compound","ins":["Grasp a couple of dumbbells holding them by your side at arm's length.","Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.","Keeping the knees stationary, lower the dumbbells to over the top of your feet by bending at the waist while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Exhale as you perform this movement","Start bringing your torso up straight again by extending your hips and waist until you are back at the starting position. Inhale as you perform this movement.","Repeat for the recommended amount of repetitions."],"sh":8,"p":2,"fo":"pull","pt":"Stiff com halteres"},{"id":"Anti-Gravity_Press","n":"Anti-Gravity Press","eq":"barbell","lv":"beginner","pm":["shoulders"],"sm":["middle back","traps","triceps"],"mc":"compound","ins":["Place a bar on the ground behind the head of an incline bench.","Lay on the bench face down. With a pronated grip, pick the barbell up from the floor. Flex the elbows, performing a reverse curl to bring the bar near your chest. This will be your starting position.","To begin, press the barbell out in front of your head by extending your elbows. Keep your arms parallel to the ground throughout the movement.","Return to the starting position and repeat to complete the set."],"sh":8,"p":3,"fo":"push","pt":"Anti-gravity press"},{"id":"Barbell_Ab_Rollout","n":"Barbell Ab Rollout","eq":"barbell","lv":"intermediate","pm":["abdominals"],"sm":["lower back","shoulders"],"mc":"compound","ins":["For this exercise you will need to get into a pushup position, but instead of having your hands of the floor, you will be grabbing on to an Olympic barbell (loaded with 5-10 lbs on each side) instead. This will be your starting position.","While keeping a slight arch on your back, lift your hips and roll the barbell towards your feet as you exhale. Tip: As you perform the movement, your glutes should be coming up, you should be keeping the abs tight and should maintain your back posture at all times. Also your arms should be staying perpendicular to the floor throughout the movement. If you don't, you will work out your shoulders and back more than the abs.","After a second contraction at the top, start to roll the barbell back forward to the starting position slowly as you inhale.","Repeat for the recommended amount of repetitions."],"sh":8,"p":4,"fo":"pull","pt":"Roda abdominal com barra"},{"id":"Barbell_Bench_Press_-_Medium_Grip","n":"Barbell Bench Press - Medium Grip","eq":"barbell","lv":"beginner","pm":["chest"],"sm":["shoulders","triceps"],"mc":"compound","ins":["Lie back on a flat bench. Using a medium width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","From the starting position, breathe in and begin coming down slowly until the bar touches your middle chest.","After a brief pause, push the bar back to the starting position as you breathe out. Focus on pushing the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position at the top of the motion, hold for a second and then start coming down slowly again. Tip: Ideally, lowering the weight should take about twice as long as raising it.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"sh":8,"p":5,"fo":"push","pt":"Supino reto com barra"},{"id":"Barbell_Curl","n":"Barbell Curl","eq":"barbell","lv":"beginner","pm":["biceps"],"sm":["forearms"],"mc":"isolation","ins":["Stand up with your torso upright while holding a barbell at a shoulder-width grip. The palm of your hands should be facing forward and the elbows should be close to the torso. This will be your starting position.","While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.","Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"sh":8,"p":6,"fo":"pull","pt":"Rosca direta com barra"},{"id":"Barbell_Curls_Lying_Against_An_Incline","n":"Barbell Curls Lying Against An Incline","eq":"barbell","lv":"beginner","pm":["biceps"],"sm":[],"mc":"isolation","ins":["Lie against an incline bench, with your arms holding a barbell and hanging down in a horizontal line. This will be your starting position.","While keeping the upper arms stationary, curl the weight up as high as you can while squeezing the biceps. Breathe out as you perform this portion of the movement. Tip: Only the forearms should move. Do not swing the arms.","After a second contraction, slowly go back to the starting position as you inhale. Tip: Make sure that you go all of the way down.","Repeat for the recommended amount of repetitions."],"sh":8,"p":7,"fo":"pull","pt":"Rosca com barra deitado no banco inclinado"},{"id":"Barbell_Deadlift","n":"Barbell Deadlift","eq":"barbell","lv":"intermediate","pm":["lower back"],"sm":["calves","forearms","glutes","hamstrings","lats","middle back","quadriceps","traps"],"mc":"compound","ins":["Stand in front of a loaded barbell.","While keeping the back as straight as possible, bend your knees, bend forward and grasp the bar using a medium (shoulder width) overhand grip. This will be the starting position of the exercise. Tip: If it is difficult to hold on to the bar with this grip, alternate your grip or use wrist straps.","While holding the bar, start the lift by pushing with your legs while simultaneously getting your torso to the upright position as you breathe out. In the upright position, stick your chest out and contract the back by bringing the shoulder blades back. Think of how the soldiers in the military look when they are in standing in attention.","Go back to the starting position by bending at the knees while simultaneously leaning the torso forward at the waist while keeping the back straight. When the weights on the bar touch the floor you are back at the starting position and ready to perform another repetition.","Perform the amount of repetitions prescribed in the program."],"sh":8,"p":8,"fo":"pull","pt":"Levantamento terra com barra"},{"id":"Barbell_Full_Squat","n":"Barbell Full Squat","eq":"barbell","lv":"intermediate","pm":["quadriceps"],"sm":["calves","glutes","hamstrings","lower back"],"mc":"compound","ins":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack just above shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder-width medium stance with the toes slightly pointed out. Keep your head up at all times and maintain a straight back. This will be your starting position.","Begin to slowly lower the bar by bending the knees and sitting back with your hips as you maintain a straight posture with the head up. Continue down until your hamstrings are on your calves. Inhale as you perform this portion of the movement.","Begin to raise the bar as you exhale by pushing the floor with the heel or middle of your foot as you straighten the legs and extend the hips to go back to the starting position.","Repeat for the recommended amount of repetitions."],"sh":8,"p":9,"fo":"push","pt":"Agachamento completo com barra"},{"id":"Barbell_Guillotine_Bench_Press","n":"Barbell Guillotine Bench Press","eq":"barbell","lv":"intermediate","pm":["chest"],"sm":["shoulders","triceps"],"mc":"compound","ins":["Using a medium width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over your neck with your arms locked. This will be your starting position.","As you breathe in, bring the bar down slowly until it is about 1 inch from your neck.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"sh":8,"p":10,"fo":"push","pt":"Supino guilhotina com barra"},{"id":"Barbell_Hack_Squat","n":"Barbell Hack Squat","eq":"barbell","lv":"intermediate","pm":["quadriceps"],"sm":["calves","forearms","hamstrings"],"mc":"compound","ins":["Stand up straight while holding a barbell behind you at arms length and your feet at shoulder width. Tip: A shoulder width grip is best with the palms of your hands facing back. You can use wrist wraps for this exercise for a better grip. This will be your starting position.","While keeping your head and eyes up and back straight, squat until your upper thighs are parallel to the floor. Breathe in as you slowly go down.","Pressing mainly with the heel of the foot and squeezing the thighs, go back up as you breathe out.","Repeat for the recommended amount of repetitions."],"sh":8,"p":11,"fo":"push","pt":"Agachamento hack com barra"},{"id":"Barbell_Incline_Bench_Press_-_Medium_Grip","n":"Barbell Incline Bench Press - Medium Grip","eq":"barbell","lv":"beginner","pm":["chest"],"sm":["shoulders","triceps"],"mc":"compound","ins":["Lie back on an incline bench. Using a medium-width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on you upper chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms in the contracted position, squeeze your chest, hold for a second and then start coming down slowly again. Tip: it should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"sh":8,"p":12,"fo":"push","pt":"Supino inclinado com barra"},{"id":"Barbell_Incline_Shoulder_Raise","n":"Barbell Incline Shoulder Raise","eq":"barbell","lv":"beginner","pm":["shoulders"],"sm":["chest"],"mc":"compound","ins":["Lie back on an Incline Bench. Using a medium width grip (a grip that is slightly wider than shoulder width), lift the bar from the rack and hold it straight over you with your arms straight. This will be your starting position.","While keeping the arms straight, lift the bar by protracting your shoulder blades, raising the shoulders from the bench as you breathe out.","Bring back the bar to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."],"sh":8,"p":13,"fo":"push","pt":"Elevação de ombros inclinada com barra"},{"id":"Barbell_Lunge","n":"Barbell Lunge","eq":"barbell","lv":"intermediate","pm":["quadriceps"],"sm":["calves","glutes","hamstrings"],"mc":"compound","ins":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack just below shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and step forward with your right leg and squat down through your hips, while keeping the torso upright and maintaining balance. Inhale as you go down. Note: Do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. li>","Using mainly the heel of your foot, push up and go back to the starting position as you exhale.","Repeat the movement for the recommended amount of repetitions and then perform with the left leg."],"sh":8,"p":14,"fo":"push","pt":"Avanço com barra"},{"id":"Barbell_Rear_Delt_Row","n":"Barbell Rear Delt Row","eq":"barbell","lv":"beginner","pm":["shoulders"],"sm":["biceps","lats","middle back"],"mc":"compound","ins":["Stand up straight while holding a barbell using a wide (higher than shoulder width) and overhand (palms facing your body) grip.","Bend knees slightly and bend over as you keep the natural arch of your back. Let the arms hang in front of you as they hold the bar. Once your torso is parallel to the floor, flare the elbows out and away from your body. Tip: Your torso and your arms should resemble the letter \"T\". Now you are ready to begin the exercise.","While keeping the upper arms perpendicular to the torso, pull the barbell up towards your upper chest as you squeeze the rear delts and you breathe out. Tip: When performed correctly, this exercise should resemble a bench press in reverse. Also, refrain from using your biceps to do the work. Focus on targeting the rear delts; the arms should only act as hooks.","Slowly go back to the initial position as you breathe in.","Repeat for the recommended amount of repetitions."],"sh":8,"p":15,"fo":"pull","pt":"Remada para deltoide posterior com barra"},{"id":"Barbell_Rollout_from_Bench","n":"Barbell Rollout from Bench","eq":"barbell","lv":"intermediate","pm":["abdominals"],"sm":["glutes","hamstrings","lats","shoulders"],"mc":"compound","ins":["Place a loaded barbell on the ground, near the end of a bench. Kneel with both legs on the bench, and take a medium to narrow grip on the barbell. This will be your starting position.","To begin, extend through the hips to slowly roll the bar forward. As you roll out, flex the shoulder to roll the bar above your head. Ensure that your arms remain extended throughout the movement.","When the bar has been moved as far forward as possible, return to the starting position."],"sh":8,"p":16,"fo":"pull","pt":"Rollout com barra a partir do banco"},{"id":"Barbell_Seated_Calf_Raise","n":"Barbell Seated Calf Raise","eq":"barbell","lv":"beginner","pm":["calves"],"sm":[],"mc":"isolation","ins":["Place a block about 12 inches in front of a flat bench.","Sit on the bench and place the ball of your feet on the block.","Have someone place a barbell over your upper thighs about 3 inches above your knees and hold it there. This will be your starting position.","Raise up on your toes as high as possible as you squeeze the calves and as you breathe out.","After a second contraction, slowly go back to the starting position. Tip: To get maximum benefit stretch your calves as far as you can.","Repeat for the recommended amount of repetitions."],"sh":8,"p":17,"fo":"push","pt":"Panturrilha sentado com barra"},{"id":"Barbell_Shoulder_Press","n":"Barbell Shoulder Press","eq":"barbell","lv":"intermediate","pm":["shoulders"],"sm":["chest","triceps"],"mc":"compound","ins":["Sit on a bench with back support in a squat rack. Position a barbell at a height that is just above your head. Grab the barbell with a pronated grip (palms facing forward).","Once you pick up the barbell with the correct grip width, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.","Lower the bar down to the shoulders slowly as you inhale.","Lift the bar back up to the starting position as you exhale.","Repeat for the recommended amount of repetitions."],"sh":8,"p":18,"fo":"push","pt":"Desenvolvimento com barra"},{"id":"Barbell_Shrug","n":"Barbell Shrug","eq":"barbell","lv":"beginner","pm":["traps"],"sm":[],"mc":"isolation","ins":["Stand up straight with your feet at shoulder width as you hold a barbell with both hands in front of you using a pronated grip (palms facing the thighs). Tip: Your hands should be a little wider than shoulder width apart. You can use wrist wraps for this exercise for a better grip. This will be your starting position.","Raise your shoulders up as far as you can go as you breathe out and hold the contraction for a second. Tip: Refrain from trying to lift the barbell by using your biceps.","Slowly return to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."],"sh":8,"p":19,"fo":"pull","pt":"Encolhimento com barra"},{"id":"Barbell_Shrug_Behind_The_Back","n":"Barbell Shrug Behind The Back","eq":"barbell","lv":"beginner","pm":["traps"],"sm":["forearms","middle back"],"mc":"isolation","ins":["Stand up straight with your feet at shoulder width as you hold a barbell with both hands behind your back using a pronated grip (palms facing back). Tip: Your hands should be a little wider than shoulder width apart. You can use wrist wraps for this exercise for better grip. This will be your starting position.","Raise your shoulders up as far as you can go as you breathe out and hold the contraction for a second. Tip: Refrain from trying to lift the barbell by using your biceps. The arms should remain stretched out at all times.","Slowly return to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."],"sh":8,"p":20,"fo":"pull","pt":"Encolhimento com barra atrás das costas"},{"id":"Barbell_Side_Bend","n":"Barbell Side Bend","eq":"barbell","lv":"beginner","pm":["abdominals"],"sm":["lower back"],"mc":"isolation","ins":["Stand up straight while holding a barbell placed on the back of your shoulders (slightly below the neck). Your feet should be shoulder width apart. This will be your starting position.","While keeping your back straight and your head up, bend only at the waist to the right as far as possible. Breathe in as you bend to the side. Then hold for a second and come back up to the starting position as you exhale. Tip: Keep the rest of the body stationary.","Now repeat the movement but bending to the left instead. Hold for a second and come back to the starting position.","Repeat for the recommended amount of repetitions."],"sh":8,"p":21,"fo":"pull","pt":"Inclinação lateral com barra"},{"id":"Barbell_Side_Split_Squat","n":"Barbell Side Split Squat","eq":"barbell","lv":"beginner","pm":["quadriceps"],"sm":["calves","hamstrings","lower back"],"mc":"compound","ins":["Stand up straight while holding a barbell placed on the back of your shoulders (slightly below the neck). Your feet should be placed wide apart with the foot of the lead leg angled out to the side. This will be your starting position.","Lower your body towards the side of your angled foot by bending the knee and hip of your lead leg and while keeping the opposite leg only slightly bent. Breathe in as you lower your body.","Return to the starting position by extending the hip and knee of the lead leg. Breathe out as you perform this movement.","After performing the recommended amount of reps, repeat the movement with the opposite leg."],"sh":8,"p":22,"fo":"push","pt":"Agachamento lateral com barra"},{"id":"Barbell_Squat","n":"Barbell Squat","eq":"barbell","lv":"beginner","pm":["quadriceps"],"sm":["calves","glutes","hamstrings","lower back"],"mc":"compound","ins":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack to just below shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section).","Begin to slowly lower the bar by bending the knees and hips as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees. Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."],"sh":8,"p":23,"fo":"push","pt":"Agachamento livre com barra"},{"id":"Bent-Arm_Barbell_Pullover","n":"Bent-Arm Barbell Pullover","eq":"barbell","lv":"intermediate","pm":["lats"],"sm":["chest","lats","shoulders","triceps"],"mc":"compound","ins":["Lie on a flat bench with a barbell using a shoulder grip width.","Hold the bar straight over your chest with a bend in your arms. This will be your starting position.","While keeping your arms in the bent arm position, lower the weight slowly in an arc behind your head while breathing in until you feel a stretch on the chest.","At that point, bring the barbell back to the starting position using the arc through which the weight was lowered and exhale as you perform this movement.","Hold the weight on the initial position for a second and repeat the motion for the prescribed number of repetitions."],"sh":9,"p":0,"fo":"pull","pt":"Pullover com barra e cotovelos flexionados"},{"id":"Bent_Over_Barbell_Row","n":"Bent Over Barbell Row","eq":"barbell","lv":"beginner","pm":["middle back"],"sm":["biceps","lats","shoulders"],"mc":"compound","ins":["Holding a barbell with a pronated grip (palms facing down), bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The barbell should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.","Now, while keeping the torso stationary, breathe out and lift the barbell to you. Keep the elbows close to the body and only use the forearms to hold the weight. At the top contracted position, squeeze the back muscles and hold for a brief pause.","Then inhale and slowly lower the barbell back to the starting position.","Repeat for the recommended amount of repetitions."],"sh":9,"p":1,"fo":"pull","pt":"Remada curvada com barra"},{"id":"Bent_Over_One-Arm_Long_Bar_Row","n":"Bent Over One-Arm Long Bar Row","eq":"barbell","lv":"beginner","pm":["middle back"],"sm":["biceps","lats","lower back","traps"],"mc":"compound","ins":["Put weight on one of the ends of an Olympic barbell. Make sure that you either place the other end of the barbell in the corner of two walls; or put a heavy object on the ground so the barbell cannot slide backward.","Bend forward until your torso is as close to parallel with the floor as you can and keep your knees slightly bent.","Now grab the bar with one arm just behind the plates on the side where the weight was placed and put your other hand on your knee. This will be your starting position.","Pull the bar straight up with your elbow in (to maximize back stimulation) until the plates touch your lower chest. Squeeze the back muscles as you lift the weight up and hold for a second at the top of the movement. Breathe out as you lift the weight. Tip: Do not allow for any swinging of the torso. Only the arm should move.","Slowly lower the bar to the starting position getting a nice stretch on the lats. Tip: Do not let the plates touch the floor. To ensure the best range of motion, I recommend using small plates (25-lb ones) as opposed to larger plates (like 35-45lb ones).","Repeat for the recommended amount of repetitions and switch arms."],"sh":9,"p":2,"fo":"pull","pt":"Remada unilateral com barra longa"},{"id":"Bent_Over_Two-Arm_Long_Bar_Row","n":"Bent Over Two-Arm Long Bar Row","eq":"barbell","lv":"intermediate","pm":["middle back"],"sm":["biceps","lats"],"mc":"compound","ins":["Put weight on one of the ends of an Olympic barbell. Make sure that you either place the other end of the barbell in the corner of two walls; or put a heavy object on the ground so the barbell cannot slide backward.","Bend forward until your torso is as close to parallel with the floor as you can and keep your knees slightly bent.","Now grab the bar with both arms just behind the plates on the side where the weight was placed and put your other hand on your knee. This will be your starting position.","Pull the bar straight up with your elbows in (to maximize back stimulation) until the plates touch your lower chest. Squeeze the back muscles as you lift the weight up and hold for a second at the top of the movement. Breathe out as you lift the weight. Tip: Use a stirrup or double handle cable attachment by hooking it under the end of the bar.","Slowly lower the bar to the starting position getting a nice stretch on the lats. Tip: Do not let the plates touch the floor. To ensure the best range of motion, I recommend using small plates (25-lb ones) as opposed to larger plates (like 35-45lb ones).","Repeat for the recommended amount of repetitions."],"sh":9,"p":3,"fo":"pull","pt":"Remada curvada com barra longa"},{"id":"Bradford_Rocky_Presses","n":"Bradford/Rocky Presses","eq":"barbell","lv":"beginner","pm":["shoulders"],"sm":["triceps"],"mc":"compound","ins":["Sit on a Military Press Bench with a bar at shoulder level with a pronated grip (palms facing forward). Tip: Your grip should be wider than shoulder width and it should create a 90-degree angle between the forearm and the upper arm as the barbell goes down. This is your starting position.","Once you pick up the barbell with the correct grip, lift the bar up over your head by locking your arms.","Now lower the bar down to the back of the head slowly as you inhale.","Lift the bar back up to the starting position as you exhale.","Lower the bar down to the starting position slowly as you inhale. This is one repetition.","Alternate in this manner until you complete the recommended amount of repetitions."],"sh":9,"p":4,"fo":"push","pt":"Desenvolvimento Bradford (Rocky)"},{"id":"Close-Grip_Barbell_Bench_Press","n":"Close-Grip Barbell Bench Press","eq":"barbell","lv":"beginner","pm":["triceps"],"sm":["chest","shoulders"],"mc":"compound","ins":["Lie back on a flat bench. Using a close grip (around shoulder width), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your middle chest. Tip: Make sure that - as opposed to a regular bench press - you keep the elbows close to the torso at all times in order to maximize triceps involvement.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your triceps muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"sh":9,"p":5,"fo":"push","pt":"Supino fechado com barra"},{"id":"Close-Grip_EZ_Bar_Curl","n":"Close-Grip EZ Bar Curl","eq":"barbell","lv":"beginner","pm":["biceps"],"sm":["forearms"],"mc":"isolation","ins":["Stand up with your torso upright while holding an E-Z Curl Bar at the closer inner handle. The palm of your hands should be facing forward and they should be slightly tilted inwards due to the shape of the bar. The elbows should be close to the torso. This will be your starting position.","While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.","Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"sh":9,"p":6,"fo":"pull","pt":"Rosca com barra W (pegada fechada)"},{"id":"Close-Grip_Standing_Barbell_Curl","n":"Close-Grip Standing Barbell Curl","eq":"barbell","lv":"beginner","pm":["biceps"],"sm":["forearms"],"mc":"isolation","ins":["Hold a barbell with both hands, palms up and a few inches apart.","Stand with your torso straight and your head up. Your feet should be about shoulder width and your elbows close to your torso. This will be your starting position. Tip: You will keep your upper arms and elbows stationary throughout the movement.","Curl the bar up in a semicircular motion until the forearms touch your biceps. Exhale as you perform this portion of the movement and contract your biceps hard for a second at the top. Tip: Avoid bending the back or using swinging motions as you lift the weight. Only the forearms should move.","Slowly go back down to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"sh":9,"p":7,"fo":"pull","pt":"Rosca direta em pé com pegada fechada"},{"id":"Decline_Barbell_Bench_Press","n":"Decline Barbell Bench Press","eq":"barbell","lv":"beginner","pm":["chest"],"sm":["shoulders","triceps"],"mc":"compound","ins":["Secure your legs at the end of the decline bench and slowly lay down on the bench.","Using a medium width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. The arms should be perpendicular to the floor. This will be your starting position. Tip: In order to protect your rotator cuff, it is best if you have a spotter help you lift the barbell off the rack.","As you breathe in, come down slowly until you feel the bar on your lower chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up).","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"sh":9,"p":8,"fo":"push","pt":"Supino declinado com barra"},{"id":"Decline_Close-Grip_Bench_To_Skull_Crusher","n":"Decline Close-Grip Bench To Skull Crusher","eq":"barbell","lv":"intermediate","pm":["triceps"],"sm":["chest","shoulders"],"mc":"compound","ins":["Secure your legs at the end of the decline bench and slowly lay down on the bench.","Using a close grip (a grip that is slightly less than shoulder width), lift the bar from the rack and hold it straight over you with your arms locked and elbows in. The arms should be perpendicular to the floor. This will be your starting position. Tip: In order to protect your rotator cuff, it is best if you have a spotter help you lift the barbell off the rack.","Now lower the bar down to your lower chest as you breathe in. Keep the elbows in as you perform this movement.","Using the triceps to push the bar back up, press it back to the starting position as you exhale.","As you breathe in and you keep the upper arms stationary, bring the bar down slowly by moving your forearms in a semicircular motion towards you until you feel the bar slightly touch your forehead. Breathe in as you perform this portion of the movement.","Lift the bar back to the starting position by contracting the triceps and exhaling.","Repeat steps 3-6 until the recommended amount of repetitions is performed."],"sh":9,"p":9,"fo":"push","pt":"Supino fechado declinado até a testa"},{"id":"Decline_EZ_Bar_Triceps_Extension","n":"Decline EZ Bar Triceps Extension","eq":"barbell","lv":"beginner","pm":["triceps"],"sm":[],"mc":"isolation","ins":["Secure your legs at the end of the decline bench and slowly lay down on the bench.","Using a close grip (a grip that is slightly less than shoulder width), lift the EZ bar from the rack and hold it straight over you with your arms locked and elbows in. The arms should be perpendicular to the floor. This will be your starting position. Tip: In order to protect your rotator cuff, it is best if you have a spotter help you lift the barbell off the rack.","As you breathe in and you keep the upper arms stationary, bring the bar down slowly by moving your forearms in a semicircular motion towards you until you feel the bar slightly touch your forehead. Breathe in as you perform this portion of the movement.","Lift the bar back to the starting position by contracting the triceps and exhaling.","Repeat until the recommended amount of repetitions is performed."],"sh":9,"p":10,"fo":"push","pt":"Tríceps testa declinado com barra W"},{"id":"Drag_Curl","n":"Drag Curl","eq":"barbell","lv":"intermediate","pm":["biceps"],"sm":["forearms"],"mc":"compound","ins":["Grab a barbell with a supinated grip (palms facing forward) and get your elbows close to your torso and back. This will be your starting position.","As you exhale, curl the bar up while keeping the elbows to the back as you \"Drag\" the bar up by keeping it in contact with your torso. Tip: As you can see, you will not be keeping the elbows pinned to your sides, but instead you will be bringing them back. Also, do not lift your shoulders.","Slowly go back to the starting position as you keep the bar in contact with the torso at all times.","Repeat for the recommended amount of repetitions."],"sh":9,"p":11,"fo":"pull","pt":"Rosca arrastada (drag curl)"},{"id":"Finger_Curls","n":"Finger Curls","eq":"barbell","lv":"beginner","pm":["forearms"],"sm":[],"mc":"isolation","ins":["Hold a barbell with both hands and your palms facing up; hands spaced about shoulder width.","Place your feet flat on the floor, at a distance that is slightly wider than shoulder width apart. This will be your starting position.","Lower the bar as far as possible by extending the fingers. Allowing the bar to roll down the hands, catch the bar with the final joint in the fingers.","Now curl bar up as high as possible by closing your hands while exhaling. Hold the contraction at the top."],"sh":9,"p":12,"fo":"pull","pt":"Rosca de dedos com barra"},{"id":"Front_Raise_And_Pullover","n":"Front Raise And Pullover","eq":"barbell","lv":"beginner","pm":["chest"],"sm":["lats","shoulders","triceps"],"mc":"compound","ins":["Lie on a flat bench while holding a barbell using a palms down grip that is about 15 inches apart.","Place the bar on your upper thighs, extend your arms and lock them while keeping a slight bend on the elbows. This will be your starting position.","Now raise the weight using a semicircular motion and keeping your arms straight as you inhale. Continue the same movement until the bar is on the other side above your head . (Tip: the bar will travel approximately 180-degrees). At this point your arms should be parallel to the floor with the palms of your hands facing the ceiling.","Now return the barbell to the starting position by reversing the motion as you exhale.","Repeat for the recommended amount of repetitions."],"sh":9,"p":13,"fo":"pull","pt":"Elevação frontal com pullover"},{"id":"Incline_Barbell_Triceps_Extension","n":"Incline Barbell Triceps Extension","eq":"barbell","lv":"intermediate","pm":["triceps"],"sm":["forearms"],"mc":"isolation","ins":["Hold a barbell with an overhand grip (palms down) that is a little closer together than shoulder width.","Lie back on an incline bench set at any angle between 45-75-degrees.","Bring the bar overhead with your arms extended and elbows in. The arms should be in line with the torso above the head. This will be your starting position.","Now lower the bar in a semicircular motion behind your head until your forearms touch your biceps. Inhale as you perform this movement. Tip: Keep your upper arms stationary and close to your head at all times. Only the forearms should move.","Return to the starting position as you breathe out and you contract the triceps. Hold the contraction for a second.","Repeat for the recommended amount of repetitions."],"sh":9,"p":14,"fo":"push","pt":"Tríceps testa inclinado com barra"},{"id":"Incline_Bench_Pull","n":"Incline Bench Pull","eq":"barbell","lv":"beginner","pm":["middle back"],"sm":["lats","shoulders"],"mc":"isolation","ins":["Grab a dumbbell in each hand and lie face down on an incline bench that is set to an incline that is approximately 30 degrees.","Let the arms hang to your sides fully extended as they point to the floor.","Turn the wrists until your hands have a pronated (palms down) grip.","Now flare the elbows out. This will be your starting position.","As you breathe out, start to pull the dumbbells up as if you are doing a reverse bench press. You will do this by bending at the elbows and bringing the upper arms up as you let the forearms hang. Continue this motion until the upper arms are at the same level as your back. Tip: The elbows will come out to the side and your upper arms and torso should make the letter \"T\" at the top of the movement. Hold the contraction at the top for a second.","Slowly go back down to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."],"sh":9,"p":15,"fo":"pull","pt":"Remada deitado no banco inclinado"},{"id":"JM_Press","n":"JM Press","eq":"barbell","lv":"beginner","pm":["triceps"],"sm":["chest","shoulders"],"mc":"compound","ins":["Start the exercise the same way you would a close grip bench press. You will lie on a flat bench while holding a barbell at arms length (fully extended) with the elbows in. However, instead of having the arms perpendicular to the torso, make sure the bar is set in a direct line above the upper chest. This will be your starting position.","Now beginning from a fully extended position lower the bar down as if performing a lying triceps extension. Inhale as you perform this movement. When you reach the half way point, let the bar roll back about one inch by moving the upper arms towards your legs until they are perpendicular to the torso. Tip: Keep the bend at the elbows constant as you bring the upper arms forward.","As you exhale, press the bar back up by using the triceps to perform a close grip bench press.","Now go back to the starting position and start over.","Repeat for the recommended amount of repetitions."],"sh":9,"p":16,"fo":"push","pt":"JM press (tríceps)"},{"id":"Landmine_180s","n":"Landmine 180's","eq":"barbell","lv":"beginner","pm":["abdominals"],"sm":["glutes","lower back","shoulders"],"mc":"compound","ins":["Position a bar into a landmine or securely anchor it in a corner. Load the bar to an appropriate weight.","Raise the bar from the floor, taking it to shoulder height with both hands with your arms extended in front of you. Adopt a wide stance. This will be your starting position.","Perform the movement by rotating the trunk and hips as you swing the weight all the way down to one side. Keep your arms extended throughout the exercise.","Reverse the motion to swing the weight all the way to the opposite side.","Continue alternating the movement until the set is complete."],"sh":9,"p":17,"fo":"pull","pt":"Giro 180° com barra (landmine)"},{"id":"Lying_Cambered_Barbell_Row","n":"Lying Cambered Barbell Row","eq":"barbell","lv":"beginner","pm":["middle back"],"sm":["biceps","lats","traps"],"mc":"isolation","ins":["Place a cambered bar underneath an exercise bench.","Lie face down on the exercise bench and grab the bar using a palms down (pronated grip) that is wider than shoulder width. This will be your starting position.","As you exhale row the bar up as you keep the elbows close to your body to either your chest, in order to target the upper mid back, or to your stomach if targeting the lats is your goal.","After a second hold at the top, lower back down to the starting position slowly as you inhale."],"sh":9,"p":18,"fo":"pull","pt":"Remada deitado com barra curva"},{"id":"Palms-Down_Wrist_Curl_Over_A_Bench","n":"Palms-Down Wrist Curl Over A Bench","eq":"barbell","lv":"beginner","pm":["forearms"],"sm":[],"mc":"isolation","ins":["Start out by placing a barbell on one side of a flat bench.","Kneel down on both of your knees so that your body is facing the flat bench.","Use your arms to grab the barbell with a pronated grip (palms down) and bring them up so that your forearms are resting against the flat bench. Your wrists should be hanging over the edge.","Start out by curling your wrist upwards and exhaling.","Slowly lower your wrists back down to the starting position while inhaling.","Your forearms should be stationary as your wrist is the only movement needed to perform this exercise.","Repeat for the recommended amount of repetitions."],"sh":9,"p":19,"fo":"pull","pt":"Rosca de punho inversa com barra no banco"},{"id":"Palms-Up_Barbell_Wrist_Curl_Over_A_Bench","n":"Palms-Up Barbell Wrist Curl Over A Bench","eq":"barbell","lv":"beginner","pm":["forearms"],"sm":[],"mc":"isolation","ins":["Start out by placing a barbell on one side of a flat bench.","Kneel down on both of your knees so that your body is facing the flat bench.","Use your arms to grab the barbell with a supinated grip (palms up) and bring them up so that your forearms are resting against the flat bench. Your wrists should be hanging over the edge.","Start out by curling your wrist upwards and exhaling.","Slowly lower your wrists back down to the starting position while inhaling.","Your forearms should be stationary as your wrist is the only movement needed to perform this exercise.","Repeat for the recommended amount of repetitions."],"sh":9,"p":20,"fo":"pull","pt":"Rosca de punho com barra no banco"},{"id":"Power_Clean","n":"Power Clean","eq":"barbell","lv":"intermediate","pm":["hamstrings"],"sm":["calves","forearms","glutes","lower back","middle back","quadriceps","shoulders","traps","triceps"],"mc":"compound","ins":["Stand with your feet slightly wider than shoulder width apart and toes pointing out slightly.","Squat down and grasp bar with a closed, pronated grip. Your hands should be slightly wider than shoulder width apart outside knees with elbows fully extended.","Place the bar about 1 inch in front of your shins and over the balls of your feet.","Your back should be flat or slightly arched, your chest held up and out and your shoulder blades should be retracted.","Keep your head in a neutral position (in line with vertebral column and not tilted or rotated) with your eyes focused straight ahead. Inhale during this phase.","Lift the bar from the floor by forcefully extending the hips and the knees as you exhale. Tip: The upper torso should maintain the same angle. Do not bend at the waist yet and do not let the hips rise before the shoulders (this would have the effect of pushing the glutes in the air and stretching the hamstrings.","Keep elbows fully extended with the head in a neutral position and the shoulders over the bar.","As the bar raises keep it as close to the shins as possible.","As the bar passes the knees, thrust your hips forward and slightly bend the knees to avoid locking them. Tip: At this point your thighs should be against the bar.","Keep the back flat or slightly arched, elbows fully extended and your head neutral. Tip: You will hold your breath until the next phase.","Inhale and then forcefully and quickly extend your hips and knees and stand on your toes.","Keep the bar as close to your body as possible. Tip: Your back should be flat with the elbows pointed out to the sides and your head in a neutral position. Also, keep your shoulders over the bar and arms straight as long as possible.","When your lower body joints are fully extended, shrug the shoulders upward rapidly without letting the elbows flex yet. Exhale during this portion of the movement.","As the shoulders reach their highest elevation flex your elbows to begin pulling your body under the bar.","Continue to pull the arms as high and as long as possible. Tip: Due to the explosive nature of this phase, your torso will be erect or with an arched back, your head will be tilted back slightly and your feet may lose contact with the floor.","After the lower body has fully extended and the bar reaches near maximal height, pull your body under the bar and rotate the arms around and under the bar.","Simultaneously, flex the hips and knees into a quarter squat position.","Once the arms are under the bar, inhale and then lift your elbows to position the upper arms parallel to the floor. Rack the bar across the front of your collar bones and front shoulder muscles.","Catch the bar with an erect and tight torso, a neutral head position and flat feet. Exhale during this movement.","Stand up by extending the hips and knees to a fully erect position.","Lower the bar by gradually reducing the muscular tension of the arms to allow a controlled descent of the bar to the thighs. Inhale during this movement.","Simultaneously flex the hips and knees to cushion the impact of the bar on the thighs.","Squat down with the elbows fully extended until the bar touches the floor.","Start over at Phase 1 and repeat for the recommended amount of repetitions."],"sh":9,"p":21,"fo":"pull","pt":"Power clean"},{"id":"Rocking_Standing_Calf_Raise","n":"Rocking Standing Calf Raise","eq":"barbell","lv":"beginner","pm":["calves"],"sm":[],"mc":"isolation","ins":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place it on the back of your shoulders (slightly below the neck).","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance. Also maintain a straight back and keep the knees with a slight bend; never locked. This will be your starting position.","Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending (other than the slight initial bend we created during positioning) at any time. Hold the contracted position by a second before you start to go back down.","Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.","Now lift your toes by contracting the tibia muscles in the front of the calves as you breathe out.","Hold for a second and bring them back down as you breathe in.","Repeat for the recommended amount of repetitions."],"sh":9,"p":22,"fo":"push","pt":"Panturrilha em pé com balanço"},{"id":"Romanian_Deadlift","n":"Romanian Deadlift","eq":"barbell","lv":"intermediate","pm":["hamstrings"],"sm":["calves","glutes","lower back"],"mc":"compound","ins":["Put a barbell in front of you on the ground and grab it using a pronated (palms facing down) grip that a little wider than shoulder width. Tip: Depending on the weight used, you may need wrist wraps to perform the exercise and also a raised platform in order to allow for better range of motion.","Bend the knees slightly and keep the shins vertical, hips back and back straight. This will be your starting position.","Keeping your back and arms completely straight at all times, use your hips to lift the bar as you exhale. Tip: The movement should not be fast but steady and under control.","Once you are standing completely straight up, lower the bar by pushing the hips back, only slightly bending the knees, unlike when squatting. Tip: Take a deep breath at the start of the movement and keep your chest up. Hold your breath as you lower and exhale as you complete the movement.","Repeat for the recommended amount of repetitions."],"sh":9,"p":23,"fo":"pull","pt":"Levantamento terra romeno"},{"id":"Seated_Barbell_Twist","n":"Seated Barbell Twist","eq":"barbell","lv":"beginner","pm":["abdominals"],"sm":[],"mc":"isolation","ins":["Start out by sitting at the end of a flat bench with a barbell placed on top of your thighs. Your feet should be shoulder width apart from each other.","Grip the bar with your palms facing down and make sure your hands are wider than shoulder width apart from each other. Begin to lift the barbell up over your head until your arms are fully extended.","Now lower the barbell behind your head until it is resting along the base of your neck. This is the starting position.","While keeping your feet and head stationary, move your waist from side to side so that your oblique muscles feel the contraction. Only move from side to side as far as your waist will allow you to go. Stretching or moving too far can cause an injury to occur. Tip: Use a slow and controlled motion.","Remember to breathe out while twisting your body to the side and in when moving back to the starting position.","Repeat for the recommended amount of repetitions."],"sh":10,"p":0,"fo":"pull","pt":"Rotação de tronco sentado com barra"},{"id":"Seated_Palm-Up_Barbell_Wrist_Curl","n":"Seated Palm-Up Barbell Wrist Curl","eq":"barbell","lv":"beginner","pm":["forearms"],"sm":[],"mc":"isolation","ins":["Hold a barbell with both hands and your palms facing up; hands spaced about shoulder width.","Place your feet flat on the floor, at a distance that is slightly wider than shoulder width apart.","Lean forward and place your forearms on top of your upper thighs with your palms up. Tip: Make sure that the front of the wrists lay on top of your knees. This will be your starting position.","Lower the bar as far as possible while inhaling and keeping a tight grip.","Now curl bar up as high as possible while flexing the forearms and exhaling. Hold the contraction at the top for a second and Tip: Only the wrist should move."],"sh":10,"p":1,"fo":"pull","pt":"Rosca de punho sentado com barra (palmas para cima)"},{"id":"Seated_Palms-Down_Barbell_Wrist_Curl","n":"Seated Palms-Down Barbell Wrist Curl","eq":"barbell","lv":"beginner","pm":["forearms"],"sm":[],"mc":"isolation","ins":["Hold a barbell with both hands and your palms facing down; hands spaced about shoulder width.","Place your feet flat on the floor, at a distance that is slightly wider than shoulder width apart.","Lean forward and place your forearms on top of your upper thighs with your palms down. Tip: Make sure that the back of the wrists lay on top of your knees. This will be your starting position.","Lower the bar as far as possible while inhaling and keeping a tight grip.","Now curl bar up as high as possible while flexing the forearms and exhaling. Hold the contraction at the top for a second and Tip: Only the wrist should move."],"sh":10,"p":2,"fo":"pull","pt":"Rosca de punho inversa sentado com barra"},{"id":"Snatch_Pull","n":"Snatch Pull","eq":"barbell","lv":"intermediate","pm":["hamstrings"],"sm":["calves","glutes","lower back","quadriceps","traps"],"mc":"compound","ins":["With a barbell on the floor close to the shins, take a wide snatch grip. Lower your hips with the weight focused on the heels, back straight, head facing forward, chest up, with your shoulders just in front of the bar. This will be your starting position.","Begin the first pull by driving through the heels, extending your knees. Your back angle should stay the same, and your arms should remain straight. Move the weight with control as you continue to above the knees.","Next comes the second pull, the main source of acceleration for the pull. As the bar approaches the mid-thigh position, begin extending through the hips. In a jumping motion, accelerate by extending the hips, knees, and ankles, using speed to move the bar upward.","There should be no need to actively pull through the arms to accelerate the weight; at the end of the second pull, the body should be fully extended, leaning slightly back. Full extension should be violent and abrupt, and ensure that you do not prolong the extension for longer than necessary."],"sh":10,"p":3,"fo":"pull","pt":"Puxada de arranco (snatch pull)"},{"id":"Standing_Barbell_Calf_Raise","n":"Standing Barbell Calf Raise","eq":"barbell","lv":"beginner","pm":["calves"],"sm":[],"mc":"isolation","ins":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the bar on the back of your shoulders (slightly below the neck).","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. The knees should be kept with a slight bend; never locked. This will be your starting position. Tip: For better range of motion you may also place the ball of your feet on a wooden block but be careful as this option requires more balance and a sturdy block.","Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.","Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.","Repeat for the recommended amount of repetitions."],"sh":10,"p":4,"fo":"push","pt":"Panturrilha em pé com barra"},{"id":"Stiff-Legged_Barbell_Deadlift","n":"Stiff-Legged Barbell Deadlift","eq":"barbell","lv":"intermediate","pm":["hamstrings"],"sm":["glutes","lower back"],"mc":"compound","ins":["Grasp a bar using an overhand grip (palms facing down). You may need some wrist wraps if using a significant amount of weight.","Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.","Keeping the knees stationary, lower the barbell to over the top of your feet by bending at the hips while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Inhale as you perform this movement.","Start bringing your torso up straight again by extending your hips until you are back at the starting position. Exhale as you perform this movement.","Repeat for the recommended amount of repetitions."],"sh":10,"p":5,"fo":"pull","pt":"Stiff com barra"},{"id":"Stiff_Leg_Barbell_Good_Morning","n":"Stiff Leg Barbell Good Morning","eq":"barbell","lv":"beginner","pm":["lower back"],"sm":["glutes","hamstrings"],"mc":"compound","ins":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position.","Keeping your legs stationary, move your torso forward by bending at the hips while inhaling. Lower your torso until it is parallel with the floor.","Begin to raise the bar as you exhale by elevating your torso back to the starting position.","Repeat for the recommended amount of repetitions."],"sh":10,"p":6,"fo":"push","pt":"Good morning com pernas estendidas"},{"id":"Bodyweight_Flyes","n":"Bodyweight Flyes","eq":"e-z curl bar","lv":"intermediate","pm":["chest"],"sm":["abdominals","shoulders","triceps"],"mc":"isolation","ins":["Position two equally loaded EZ bars on the ground next to each other. Ensure they are able to roll.","Assume a push-up position over the bars, supporting your weight on your toes and hands with your arms extended and body straight.","Place your hands on the bars. This will be your starting position.","Using a slow and controlled motion, move your hands away from the midline of your body, rolling the bars apart. Inhale during this portion of the motion.","After moving the bars as far apart as you can, return to the starting position by pulling them back together. Exhale as you perform this movement."],"sh":10,"p":7,"fo":"push","pt":"Crucifixo com peso do corpo"},{"id":"Close-Grip_EZ-Bar_Curl_with_Band","n":"Close-Grip EZ-Bar Curl with Band","eq":"e-z curl bar","lv":"beginner","pm":["biceps"],"sm":["forearms"],"mc":"isolation","ins":["Attach a band to each end of the bar. Take the bar, placing a foot on the middle of the band. Stand upright with a narrow, supinated grip on the EZ bar. The elbows should be close to the torso. This will be your starting position.","While keeping the upper arms in place, flex the elbows to execute the curl. Exhale as the weight is lifted.","Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"sh":10,"p":8,"fo":"pull","pt":"Rosca com barra W e elástico (pegada fechada)"},{"id":"Close-Grip_EZ-Bar_Press","n":"Close-Grip EZ-Bar Press","eq":"e-z curl bar","lv":"beginner","pm":["triceps"],"sm":["chest","shoulders"],"mc":"compound","ins":["Lie on a flat bench with an EZ bar loaded to an appropriate weight.","Using a narrow grip lift the bar and hold it straight over your torso with your elbows in. The arms should be perpendicular to the floor. This will be your starting position.","Now lower the bar down to your lower chest as you breathe in. Keep the elbows in as you perform this movement.","Using the triceps to push the bar back up, press it back to the starting position by extending the elbows as you exhale.","Repeat."],"sh":10,"p":9,"fo":"push","pt":"Supino fechado com barra W"},{"id":"EZ-Bar_Curl","n":"EZ-Bar Curl","eq":"e-z curl bar","lv":"beginner","pm":["biceps"],"sm":[],"mc":"isolation","ins":["Stand up straight while holding an EZ curl bar at the wide outer handle. The palms of your hands should be facing forward and slightly tilted inward due to the shape of the bar. Keep your elbows close to your torso. This will be your starting position.","Now, while keeping your upper arms stationary, exhale and curl the weights forward while contracting the biceps. Focus on only moving your forearms.","Continue to raise the weight until your biceps are fully contracted and the bar is at shoulder level. Hold the top contracted position for a moment and squeeze the biceps.","Then inhale and slowly lower the bar back to the starting position.","Repeat for the recommended amount of repetitions."],"sh":10,"p":10,"fo":"pull","pt":"Rosca direta com barra W"},{"id":"EZ-Bar_Skullcrusher","n":"EZ-Bar Skullcrusher","eq":"e-z curl bar","lv":"beginner","pm":["triceps"],"sm":["forearms"],"mc":"isolation","ins":["Using a close grip, lift the EZ bar and hold it with your elbows in as you lie on the bench. Your arms should be perpendicular to the floor. This will be your starting position.","Keeping the upper arms stationary, lower the bar by allowing the elbows to flex. Inhale as you perform this portion of the movement. Pause once the bar is directly above the forehead.","Lift the bar back to the starting position by extending the elbow and exhaling.","Repeat."],"sh":10,"p":11,"fo":"push","pt":"Tríceps testa com barra W"},{"id":"Lying_Close-Grip_Barbell_Triceps_Press_To_Chin","n":"Lying Close-Grip Barbell Triceps Press To Chin","eq":"e-z curl bar","lv":"intermediate","pm":["triceps"],"sm":[],"mc":"isolation","ins":["While holding a barbell or EZ Curl bar with a pronated grip (palms facing forward), lie on your back on a flat bench with your head off the end of the bench. Tip: If you are holding a barbell grab it using a shoulder-width grip and if you are using an E-Z Bar grab it on the inner handles.","Extend your arms in front of you as you hold the barbell over your chest. The arms should be perpendicular to your torso (90-degree angle). This will be your starting position.","As you inhale, lower the bar in a semi-circular motion by bending at the elbows and while keeping the upper arm stationary and elbows in. Keep lowering the bar until it lightly touches your chin.","As you exhale bring the bar back up to the starting position by pushing the bar up in a semi-circular motion. Contract the triceps hard at the top of the movement for a second. Tip: Again, only the forearms should move. The upper arms should remain stationary at all times.","Repeat for the recommended amount of repetitions."],"sh":10,"p":12,"fo":"push","pt":"Tríceps deitado com barra até o queixo"},{"id":"Reverse_Barbell_Preacher_Curls","n":"Reverse Barbell Preacher Curls","eq":"e-z curl bar","lv":"intermediate","pm":["biceps"],"sm":["forearms"],"mc":"isolation","ins":["Grab an EZ-bar using a shoulder width and palms down (pronated) grip.","Now place the upper part of both arms on top of the preacher bench and have your arms extended. This will be your starting position.","As you exhale, use the biceps to curl the weight up until your biceps are fully contracted and the barbell is at shoulder height. Squeeze the biceps hard for a second at the contracted position.","As you breathe in, slowly lower the barbell until your upper arms are extended and the biceps is fully stretched.","Repeat for the recommended amount of repetitions."],"sh":10,"p":13,"fo":"pull","pt":"Rosca Scott inversa com barra"},{"id":"3_4_Sit-Up","n":"3/4 Sit-Up","eq":"body only","lv":"beginner","pm":["abdominals"],"sm":[],"mc":"compound","ins":["Lie down on the floor and secure your feet. Your legs should be bent at the knees.","Place your hands behind or to the side of your head. You will begin with your back on the ground. This will be your starting position.","Flex your hips and spine to raise your torso toward your knees.","At the top of the contraction your torso should be perpendicular to the ground. Reverse the motion, going only ¾ of the way down.","Repeat for the recommended amount of repetitions."],"sh":10,"p":14,"fo":"pull","pt":"Abdominal 3/4"},{"id":"Air_Bike","n":"Air Bike","eq":"body only","lv":"beginner","pm":["abdominals"],"sm":[],"mc":"compound","ins":["Lie flat on the floor with your lower back pressed to the ground. For this exercise, you will need to put your hands beside your head. Be careful however to not strain with the neck as you perform it. Now lift your shoulders into the crunch position.","Bring knees up to where they are perpendicular to the floor, with your lower legs parallel to the floor. This will be your starting position.","Now simultaneously, slowly go through a cycle pedal motion kicking forward with the right leg and bringing in the knee of the left leg. Bring your right elbow close to your left knee by crunching to the side, as you breathe out.","Go back to the initial position as you breathe in.","Crunch to the opposite side as you cycle your legs and bring closer your left elbow to your right knee and exhale.","Continue alternating in this manner until all of the recommended repetitions for each side have been completed."],"sh":10,"p":15,"fo":"pull","pt":"Abdominal bicicleta no ar"},{"id":"Alternate_Heel_Touchers","n":"Alternate Heel Touchers","eq":"body only","lv":"beginner","pm":["abdominals"],"sm":[],"mc":"isolation","ins":["Lie on the floor with the knees bent and the feet on the floor around 18-24 inches apart. Your arms should be extended by your side. This will be your starting position.","Crunch over your torso forward and up about 3-4 inches to the right side and touch your right heel as you hold the contraction for a second. Exhale while performing this movement.","Now go back slowly to the starting position as you inhale.","Now crunch over your torso forward and up around 3-4 inches to the left side and touch your left heel as you hold the contraction for a second. Exhale while performing this movement and then go back to the starting position as you inhale. Now that both heels have been touched, that is considered 1 repetition.","Continue alternating sides in this manner until all prescribed repetitions are done."],"sh":10,"p":16,"fo":"pull","pt":"Toque alternado nos calcanhares"},{"id":"Bent-Knee_Hip_Raise","n":"Bent-Knee Hip Raise","eq":"body only","lv":"beginner","pm":["abdominals"],"sm":[],"mc":"compound","ins":["Lay flat on the floor with your arms next to your sides.","Now bend your knees at around a 75 degree angle and lift your feet off the floor by around 2 inches.","Using your lower abs, bring your knees in towards you as you maintain the 75 degree angle bend in your legs. Continue this movement until you raise your hips off of the floor by rolling your pelvis backward. Breathe out as you perform this portion of the movement. Tip: At the end of the movement your knees will be over your chest.","Squeeze your abs at the top of the movement for a second and then return to the starting position slowly as you breathe in. Tip: Maintain a controlled motion at all times.","Repeat for the recommended amount of repetitions."],"sh":10,"p":17,"fo":"pull","pt":"Elevação de quadril com joelhos flexionados"},{"id":"Bodyweight_Squat","n":"Bodyweight Squat","eq":"body only","lv":"beginner","pm":["quadriceps"],"sm":["glutes","hamstrings"],"mc":"compound","ins":["Stand with your feet shoulder width apart. You can place your hands behind your head. This will be your starting position.","Begin the movement by flexing your knees and hips, sitting back with your hips.","Continue down to full depth if you are able,and quickly reverse the motion until you return to the starting position. As you squat, keep your head and chest up and push your knees out."],"sh":10,"p":18,"fo":"push","pt":"Agachamento com peso do corpo"},{"id":"Butt_Lift_Bridge","n":"Butt Lift (Bridge)","eq":"body only","lv":"beginner","pm":["glutes"],"sm":["hamstrings"],"mc":"isolation","ins":["Lie flat on the floor on your back with the hands by your side and your knees bent. Your feet should be placed around shoulder width. This will be your starting position.","Pushing mainly with your heels, lift your hips off the floor while keeping your back straight. Breathe out as you perform this part of the motion and hold at the top for a second.","Slowly go back to the starting position as you breathe in."],"sh":10,"p":19,"fo":"push","pt":"Elevação de quadril (ponte)"},{"id":"Flutter_Kicks","n":"Flutter Kicks","eq":"body only","lv":"beginner","pm":["glutes"],"sm":["hamstrings"],"mc":"compound","ins":["On a flat bench lie facedown with the hips on the edge of the bench, the legs straight with toes high off the floor and with the arms on top of the bench holding on to the front edge.","Squeeze your glutes and hamstrings and straighten the legs until they are level with the hips. This will be your starting position.","Start the movement by lifting the left leg higher than the right leg.","Then lower the left leg as you lift the right leg.","Continue alternating in this manner (as though you are doing a flutter kick in water) until you have done the recommended amount of repetitions for each leg. Make sure that you keep a controlled movement at all times. Tip: You will breathe normally as you perform this movement."],"sh":10,"p":20,"fo":"pull","pt":"Elevação alternada de pernas (tesoura)"},{"id":"Glute_Kickback","n":"Glute Kickback","eq":"body only","lv":"beginner","pm":["glutes"],"sm":["hamstrings"],"mc":"compound","ins":["Kneel on the floor or an exercise mat and bend at the waist with your arms extended in front of you (perpendicular to the torso) in order to get into a kneeling push-up position but with the arms spaced at shoulder width. Your head should be looking forward and the bend of the knees should create a 90-degree angle between the hamstrings and the calves. This will be your starting position.","As you exhale, lift up your right leg until the hamstrings are in line with the back while maintaining the 90-degree angle bend. Contract the glutes throughout this movement and hold the contraction at the top for a second. Tip: At the end of the movement the upper leg should be parallel to the floor while the calf should be perpendicular to it.","Go back to the initial position as you inhale and now repeat with the left leg.","Continue to alternate legs until all of the recommended repetitions have been performed."],"sh":10,"p":21,"fo":"push","pt":"Coice de glúteo"},{"id":"Leg_Lift","n":"Leg Lift","eq":"body only","lv":"beginner","pm":["glutes"],"sm":["hamstrings"],"mc":"isolation","ins":["While standing up straight with both feet next to each other at around shoulder width, grab a sturdy surface such as the sides of a squat rack or the top of a chair to brace yourself and keep balance.","With or without an ankle weight, lift one leg behind you as if performing a leg curl but standing up while keeping the other leg straight. Breathe out as you perform this movement.","Slowly bring the raised leg back to the floor as you breathe in.","Repeat for the recommended amount of repetitions.","Repeat the movement with the opposite leg."],"sh":10,"p":22,"fo":"push","pt":"Elevação de pernas"}];

function jointsOfName(en,pm){
  var n=String(en||'').toLowerCase(),o=[];pm=pm||[];
  if(/squat|lunge|leg press|leg extension|leg curl|hack|step[- ]?up|jump|sissy|pistol|split|chair|sprint|clean|snatch|agach|avan[cç]o|afundo|passada|extensora|flexora|leg\b|salto|step\b|hack/.test(n)||pm.indexOf('quadriceps')>-1)o.push('j-joelho');
  if(/deadlift|good morning|bent over|bent-over|hyperextension|pull through|t-bar|squat|clean|snatch|romanian|stiff|landmine|russian|twist|side bend|rollout|judo|wood chop|cable lift|terra|stiff|curvada|lombar|agach/.test(n)||pm.indexOf('lower back')>-1)o.push('j-lombar');
  if(pm.indexOf('shoulders')>-1||/overhead|upright|behind the (neck|back)|pullover|\bdip|guillotine|snatch|cuban|arnold|anti-gravity|bradford|desenvolvimento|militar|paralelas|elevacao|elevação/.test(n))o.push('j-ombro');
  if(pm.indexOf('triceps')>-1||pm.indexOf('biceps')>-1||/skull|\bdip|jm press|close-grip.*press|rosca|tr[ií]ceps|b[ií]ceps/.test(n))o.push('j-cotovelo');
  return o;
}
function jointsOf(it){return it.e?jointsOfName(it.e.en,it.e.pm):jointsOfName(it.n,[])}
function careKeys(it){return it.pg.concat(it.sg).concat(jointsOf(it))}

function eqOk(k){return S.prof.eq[k]!==false}

function allLib(){
  var o=LIB.map(function(e){var pg=[],sg=[];e.pm.forEach(function(m){var g=DBMG[m];if(g&&pg.indexOf(g)<0)pg.push(g)});e.sm.forEach(function(m){var g=DBMG[m];if(g&&pg.indexOf(g)<0&&sg.indexOf(g)<0)sg.push(g)});return {id:e.id,n:e.n,e:e,eq:eqKey(e.eq),pg:pg,sg:sg,cu:0}});
  S.cust.forEach(function(c){o.push({id:c.id,n:c.name,e:null,eq:c.eq||'other',pg:c.mg?[c.mg]:[],sg:[],cu:1,c:c})});
  return o;
}
function libMatch(it,q){
  if(!q)return true;var hay=norm(it.n+' '+(it.e?it.e.en:'')+' '+it.pg.map(function(g){return MGN[g]}).join(' ')+' '+EQN[it.eq]+' '+(it.e?it.e.pm.concat(it.e.sm).join(' '):''));
  return norm(q).split(/\s+/).filter(Boolean).every(function(t){
    if(hay.indexOf(t)>-1)return true;var x=PTX[t];var enm=(it.e&&it.e.en)||it.n;if(x&&new RegExp(x,'i').test(enm))return true;
    return Object.keys(PTX).some(function(k){return k.indexOf(t)===0&&t.length>=3&&new RegExp(PTX[k],'i').test(enm)});
  });
}
function libItems(){
  var L=S.lib;
  return allLib().filter(function(it){
    if(L.mine&&!it.cu)return false;
    if(L.mg&&it.pg.indexOf(L.mg)<0)return false;
    if(L.eq&&it.eq!==L.eq)return false;
    if(L.only&&!eqOk(it.eq)&&!it.cu)return false;
    return libMatch(it,L.q);
  });
}
function libOf(name){var m=LIBMAP[norm(name)];return m?{id:m[0],sim:!!m[1]}:null}
function thumb(it,cls){
  if(!it.e)return '<div class="th none '+(cls||'')+'" aria-hidden="true">sem<br>imagem</div>';
  var c=it.e.p%4,r=Math.floor(it.e.p/4);

}
