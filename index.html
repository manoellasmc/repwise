var SLUG={trapezius:'costas','upper-back':'costas','lower-back':'costas',deltoids:'ombros',chest:'peito',biceps:'biceps',triceps:'triceps',forearm:'antebraco',abs:'abdomen',obliques:'abdomen',quadriceps:'quadriceps',adductors:'adutores',hamstring:'posterior',gluteal:'gluteos',calves:'panturrilha'};
function mapSvg(sel,prim,sec,click,act){
  act=act||'mg';
  function side(k,label){
    var B=BODYF[k],w=B.vb.split(' ')[2],h='<div class="bcol" style="flex:'+w+' 1 0"><svg viewBox="'+B.vb+'" role="img" aria-label="Corpo feminino, '+label.toLowerCase()+'"><path class="bd" d="'+B.outline+'"/>';
    B.parts.forEach(function(pt){
      var g=SLUG[pt.s];
      if(!g){pt.p.forEach(function(d){h+='<path class="bd2" d="'+d+'"/>'});return}
      var on=(sel===g),cl='rg'+(on?' on':'')+(prim&&prim.indexOf(g)>-1?' p':'')+(sec&&sec.indexOf(g)>-1&&!(prim&&prim.indexOf(g)>-1)?' s':'');
      pt.p.forEach(function(d){h+='<path d="'+d+'" class="'+cl+'"'+(click?' data-act="'+act+'" data-v="'+g+'" role="button" tabindex="0" aria-pressed="'+on+'"':'')+' aria-label="'+MGN[g]+'"><title>'+MGN[g]+'</title></path>'});
    });
    return h+'</svg><span class="bl">'+label+'</span></div>';
  }
  return '<div class="bodymap">'+side('front','FRENTE')+side('back','COSTAS')+'</div>';
}

/* biblioteca */
function chipRow(items,cur,act){return '<div class="chips" role="group">'+items.map(function(c){return '<button class="chip" data-act="'+act+'" data-v="'+c[0]+'" aria-pressed="'+(cur===c[0])+'">'+esc(c[1])+'</button>'}).join('')+'</div>'}
function libRow(it){
  var cuid=(it.cu?' · meu exercício':'')+(it.why?' · '+it.why:'');
  return '<li><button class="lrow" data-act="libopen" data-id="'+esc(it.id)+'">'+thumb(it)+'<span class="tx"><span class="nm">'+esc(it.n)+'</span><span class="sub">'+esc((it.pg.map(function(g){return MGN[g]}).join(', ')||'sem grupo')+' · '+EQN[it.eq]+cuid)+'</span></span><span class="ic" aria-hidden="true">›</span></button></li>';
}
function libListHtml(){
  var L=S.lib,its=libItems(),shown=its.slice(0,L.n);
  var h='<div class="sub" aria-live="polite" style="margin:2px 2px 8px">'+its.length+' exercício'+(its.length===1?'':'s')+(L.mg?' · '+MGN[L.mg]:'')+'</div>';
  if(!its.length)return h+'<div class="empty"><b>Nada encontrado.</b> Tente outro termo (pode buscar em português: supino, remada, rosca...) ou limpe os filtros.</div>';
  h+='<ul class="list">'+shown.map(libRow).join('')+'</ul>';
  if(its.length>shown.length)h+='<div class="pad"><button class="btn block" data-act="libmore">Mostrar mais ('+(its.length-shown.length)+')</button></div>';
  return h;
}
function viewLib(){
  var L=S.lib;if(L.open)return viewLibDetail(L.open);
  var cov=coverCounts(),covG=Object.keys(cov);
  var h='<div class="card"><div class="pad"><div class="kicker">Mapa muscular</div><div class="sub">Toque num músculo para filtrar a lista. Ilustração simplificada dos principais grupos musculares, não é um atlas de anatomia.</div>'+mapSvg(L.mg,null,covG,true)+'<div class="sub">Rosa claro: músculos que suas fichas já trabalham. Cinza: sem exercício nas suas fichas.</div><div class="chips">'+MGS.filter(function(g){return g[0]!=='aerobio'}).map(function(g){var n=cov[g[0]]||0;return '<button class="chip'+(n?'':' dash')+'" data-act="fmg" data-v="'+g[0]+'" aria-pressed="'+(L.mg===g[0])+'">'+g[1]+' · '+(n?n+' exerc.':'nenhum')+'</button>'}).join('')+'</div></div></div>';
  h+='<div class="card"><div class="pad"><label class="field">BUSCAR<input id="l-q" type="search" value="'+esc(L.q)+'" placeholder="Ex.: supino, rosca, leg press" autocomplete="off"></label>';
  h+='<div class="sub">Grupo muscular</div>'+chipRow([['','Todos']].concat(MGS.filter(function(g){return g[0]!=='aerobio'})),L.mg,'fmg');
  h+='<div class="sub">Equipamento</div>'+chipRow([['','Todos']].concat(EQK.map(function(k){return [k,EQN[k]]})),L.eq,'feq');
  h+='<div class="acts"><button class="chip" data-act="fonly" aria-pressed="'+L.only+'">Só equipamentos do meu perfil</button><button class="chip" data-act="fmine" aria-pressed="'+L.mine+'">Meus exercícios</button></div></div></div>';
  h+='<div id="liblist">'+libListHtml()+'</div>';
  if(L.form)h+=custForm();else h+='<div class="pad"><button class="btn block" data-act="custnew">+ Cadastrar meu exercício</button></div>';
  h+='<div class="src">Desenho do corpo: <a href="https://github.com/HichamELBSI/react-native-body-highlighter" target="_blank" rel="noopener">react-native-body-highlighter</a> (MIT). Imagens e instruções: <a href="https://github.com/yuhonas/free-exercise-db" target="_blank" rel="noopener">free-exercise-db</a> (domínio público, em inglês). Conteúdo informativo; consulte um profissional para orientação individual.</div>';
  return h;
}
function custForm(){
  var c=S.lib.form,x=c.id?S.cust.filter(function(q){return q.id===c.id})[0]:null;x=x||{};
  return '<div class="card"><div class="pad"><div class="kicker">'+(c.id?'Editar exercício':'Novo exercício meu')+'</div>'+
   '<label class="field">NOME<input id="c-name" value="'+esc(x.name||'')+'" placeholder="Ex.: Elevação de quadril com elástico"></label>'+
   '<div class="two"><label class="field">GRUPO PRINCIPAL<select id="c-mg"><option value="">Escolher</option>'+MGS.map(function(g){return '<option value="'+g[0]+'"'+(x.mg===g[0]?' selected':'')+'>'+g[1]+'</option>'}).join('')+'</select></label>'+
   '<label class="field">EQUIPAMENTO<select id="c-eq">'+EQK.map(function(k){return '<option value="'+k+'"'+((x.eq||'other')===k?' selected':'')+'>'+EQN[k]+'</option>'}).join('')+'</select></label></div>'+
   '<label class="field">COMO FAZER / OBSERVAÇÕES<textarea id="c-notes" placeholder="Suas anotações, ajuste da máquina, dicas do instrutor...">'+esc(x.notes||'')+'</textarea></label>'+
   '<div class="sub">Este cadastro guarda só texto. Ainda não há envio de foto.</div>'+
   '<div class="acts"><button class="btn pri" data-act="custsave">Salvar</button><button class="btn" data-act="custcancel">Cancelar</button>'+(c.id?'<button class="btn dng" data-act="custdel" data-id="'+esc(c.id)+'">'+(S.confirm==='cust'?'Confirmar exclusão':'Excluir')+'</button>':'')+'</div></div></div>';
}

function coverCounts(){var F=fichas(),cnt={},use=[];DAYS.forEach(function(d){if(d.off)return;var f=F[S.week+'_'+d.k];if(f)use.push(f)});Object.keys(F).forEach(function(k){if(!F[k].cycle&&!F[k].deleted)use.push(F[k])});use.forEach(function(f){f.ex.forEach(function(x){var g=exMg(x);if(g&&g!=='aerobio')cnt[g]=(cnt[g]||0)+1})});return cnt}
function whySame(it,o){var p=[];if(it.e&&o.e&&it.e.fo&&it.e.fo===o.e.fo)p.push(FON[o.e.fo]);if(it.e&&o.e&&it.e.mc&&it.e.mc===o.e.mc)p.push(MCN[o.e.mc]);return p.length?'mesmo movimento: '+p.join(' · '):''}
function alternatives(it){
  if(!it.pg.length)return [];
  return allLib().filter(function(o){return o.id!==it.id&&!o.cu&&o.pg[0]===it.pg[0]&&eqOk(o.eq)}).map(function(o){
    var sc=(o.e&&it.e&&o.e.fo&&o.e.fo===it.e.fo?4:0)+((o.e&&it.e&&o.e.mc===it.e.mc)?2:0)+(o.eq===it.eq?1:0);return {o:o,sc:sc}}).sort(function(a,b){return b.sc-a.sc||(a.o.n<b.o.n?-1:1)}).slice(0,6).map(function(x){return Object.assign({},x.o,{why:whySame(it,x.o)})});

var EQR={machine:0,cable:1,dumbbell:2,barbell:3,'body only':4,other:5};
function careHit(it){return careOf(it).length>0}
function lvOk(it){var lv=PLV[S.prof.nivel];return !(lv&&it.e&&LVR[it.e.lv]>lv)}
function mkCands(g){
  var beg=S.prof.nivel==='iniciante',all=allLib().filter(function(it){return it.pg[0]===g&&eqOk(it.eq)&&lvOk(it)});
  S.mk.excl+=all.filter(careHit).length;
  return all.filter(function(it){return !careHit(it)}).sort(function(a,b){
    var ca=a.cu?9:(a.e.mc==='compound'?0:1),cb=b.cu?9:(b.e.mc==='compound'?0:1);
    var ea=(beg?EQR[a.eq]:0)+0,eb=(beg?EQR[b.eq]:0)+0;
    if(a.cu!==b.cu)return a.cu-b.cu;
    if(ea!==eb)return ea-eb;if(ca!==cb)return ca-cb;
    var ra=EQR[a.eq],rb=EQR[b.eq];if(ra!==rb)return ra-rb;return a.n<b.n?-1:a.n>b.n?1:0});
}
function mkGen(){
  S.mk.excl=0;var items=[];
  MGS.forEach(function(g){if(S.mk.groups.indexOf(g[0])<0)return;mkCands(g[0]).slice(0,S.mk.per).forEach(function(it){items.push({g:g[0],id:it.id})})});
  S.mk.items=items;
  if(!S.mk.name)S.mk.name='Treino · '+MGS.filter(function(g){return S.mk.groups.indexOf(g[0])>-1}).map(function(g){return g[1]}).join(' e ');
}

function swapPanel(x,act){act=act||'swapdo';

  var c=mkCands(g).filter(function(it){return it.n!==x.name&&it.id!==x.lib&&!(m&&it.id===m.id)}).sort(function(a,b){return sc(b)-sc(a)}).slice(0,8);

function mkClick(a,b,id){
  var M=S.mk;
  if(a==='mkopen'){M.open=true;S.view='fichas';S.ficha=null;render();window.scrollTo(0,0);return true}
  if(a==='mkclose'){M.open=false;render();return true}
  if(a==='mkg'){var i=M.groups.indexOf(b.dataset.v);if(i>-1)M.groups.splice(i,1);else M.groups.push(b.dataset.v);M.items=[];M.name='';render();return true}
  if(a==='mkper'){M.per=+b.dataset.v;M.items=[];render();return true}
  if(a==='mkgen'){mkGen();render();return true}
  if(a==='mkrm'){M.items.splice(+id,1);render();return true}
  if(a==='mkre'){
    var cur=M.items[+id],cs=mkCands(cur.g),used=M.items.map(function(x){return x.id}),k=cs.map(function(c){return c.id}).indexOf(cur.id),n=cs.length,j;
    for(var s=1;s<=n;s++){j=(k+s)%n;if(used.indexOf(cs[j].id)<0){cur.id=cs[j].id;break}}
    render();return true;
  }
  if(a==='mksave'){
    var nid='u'+Date.now().toString(36),ex=M.items.map(function(x,i){var it=mkItem(i);return {id:nid+'-'+i,name:it.n,sets:'3 × 15',load:'',rest:"1'",mg:x.g,lib:it.id}});
    S.over[nid]={id:nid,name:M.name||'Treino montado',sub:MGS.filter(function(g){return M.groups.indexOf(g[0])>-1}).map(function(g){return g[1]}).join(' · '),cycle:null,day:null,ex:ex};
    saveCfg();M.open=false;M.items=[];M.name='';M.groups=[];S.ficha=nid;render();window.scrollTo(0,0);return true;
  }
  if(a==='swap'){S.swap=S.swap===id?null:id;render();return true}
  if(a==='swapdo'){
    var lid=b.dataset.v,it=allLib().filter(function(o){return o.id===lid})[0];if(!it)return true;
    editFicha(S.ficha,function(f){f.ex=f.ex.map(function(x){return x.id===id?Object.assign({},x,{name:it.n,load:'',mg:it.pg[0]||x.mg||'',lib:lid,ref:undefined,chk:undefined}):x})});
    S.swap=null;render();return true;
  }
  return false;
}

    h+='<div class="form"><div class="sub">No Fitdays, exporte o histórico (se o seu app tiver “exportar dados”) e cole aqui o conteúdo, com o cabeçalho na primeira linha. Também funciona copiar as linhas de uma planilha. O app procura colunas como data, peso, gordura, músculo, água, osso, visceral, TMB e IMC.</div><textarea id="bd-txt" rows="6" placeholder="Data;Peso (kg);Gordura corporal (%);..."></textarea><button class="btn pri block" data-act="bdgo">Importar</button></div>';
  }
  if(B.length){
    h+='<div class="kicker" style="margin-top:6px">Histórico</div><ul class="list">'+B.slice().reverse().slice(0,12).map(function(b){
      var bits=BDF.filter(function(f){return b[f[0]]!=null}).slice(0,4).map(function(f){return esc(f[1].split(' ')[0])+' '+bdFmt(b[f[0]],f[0])}).join(' · ');
      return '<li style="display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 0"><span style="font-size:13px"><b>'+b.d.slice(8)+'/'+b.d.slice(5,7)+'/'+b.d.slice(0,4)+(b.id.length>10?' '+b.id.slice(11):'')+'</b><br><span style="color:var(--muted)">'+bits+'</span></span><button class="btn sm" data-act="bddel" data-id="'+esc(b.id)+'" aria-label="Apagar medição">'+(bd.conf===b.id?'Apagar?':'×')+'</button></li>'}).join('')+'</ul>';
  }
  return h+'</div></div>';
}

function bdClick(a,b){
  var bd=S.bd;
  if(a==='bdform'){bd.form=!bd.form;bd.imp=false;bd.msg='';render();return true}
  if(a==='bdimp'){bd.imp=!bd.imp;bd.form=false;bd.msg='';render();return true}
  if(a==='bdmet'){bd.metric=b.dataset.v;render();return true}
  if(a==='bdsave'){
    var d=($('#bd-d')||{}).value||todayIso,e={id:d,d:d},any=0;
    BDF.forEach(function(f){var n=bdNum(($('#bd-'+f[0])||{}).value);if(n!=null){e[f[0]]=n;any=1}});
    if(!any){bd.msg='Preencha pelo menos um valor.';render();return true}
    bdMerge([e]);bd.form=false;bd.msg='Medição de '+d.slice(8)+'/'+d.slice(5,7)+' salva.';render();return true;
  }
  if(a==='bdgo'){
    var r=bdParse(($('#bd-txt')||{}).value);
    if(r.err){bd.msg=r.err;render();return true}
    if(!r.rows.length){bd.msg='Nenhuma linha com data e valores foi reconhecida.'+(r.ign.length?' Colunas não reconhecidas: '+r.ign.join(', ')+'.':'');render();return true}
    var m=bdMerge(r.rows);bd.imp=false;bd.msg=m.n+' medição(ões) nova(s), '+m.u+' atualizada(s)'+(r.bad?', '+r.bad+' linha(s) ignorada(s)':'')+'.'+(r.ign.length?' Colunas não usadas: '+r.ign.join(', ')+'.':'');render();return true;
  }
  if(a==='bddel'){
    if(bd.conf!==b.dataset.id){bd.conf=b.dataset.id;render();return true}
    S.body=S.body.filter(function(x){return x.id!==b.dataset.id});bd.conf=null;saveBody();render();return true;
  }
  return false;
}
