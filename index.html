Cable_Chest_Press","n":"Standing Cable Chest Press","eq":"cable","lv":"beginner","pm":["chest"],"sm":["shoulders","triceps"],"mc":"compound","ins":["Position dual pulleys to chest height and select an appropriate weight. Stand a foot or two in front of the cables, holding one in each hand. You can stagger your stance for better stability.","Position the upper arm at a 90 degree angle with the shoulder blades together. This will be your starting position.","Keeping the rest of the body stationary, extend through the elbows to press the handles forward, drawing them together in front of you.","Pause at the top of the motion, and return to the starting position."],"sh":4,"p":21,"fo":"push","pt":"Supino em pé na polia"},{"id":"Standing_Cable_Lift","n":"Standing Cable Lift","eq":"cable","lv":"beginner","pm":["abdominals"],"sm":["shoulders"],"mc":"compound","ins":["Connect a standard handle on a tower, and move the cable to the lowest pulley position.","With your side to the cable, grab the handle with one hand and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable. Your outstretched arm should be aligned with the cable.","With your feet positioned shoulder width apart, squat down and grab the handle with both hands. Your arms should still be fully extended.","In one motion, pull the handle up and across your body until your arms are in a fully-extended position above your head.","Keep your back straight and your arms close to your body as you pivot your back foot and straighten your legs to get a full range of motion.","Retract your arms and then your body. Return to the neutral position in a slow and controlled manner.","Repeat to failure.","Then, reposition and repeat the same series of movements on the opposite side."],"sh":4,"p":22,"fo":"pull","pt":"Levantamento diagonal na polia"},{"id":"Standing_Cable_Wood_Chop","n":"Standing Cable Wood Chop","eq":"cable","lv":"beginner","pm":["abdominals"],"sm":["shoulders"],"mc":"compound","ins":["Connect a standard handle to a tower, and move the cable to the highest pulley position.","With your side to the cable, grab the handle with one hand and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable. Your outstretched arm should be aligned with the cable.","With your feet positioned shoulder width apart, reach upward with your other hand and grab the handle with both hands. Your arms should still be fully extended.","In one motion, pull the handle down and across your body to your front knee while rotating your torso.","Keep your back and arms straight and core tight while you pivot your back foot and bend your knees to get a full range of motion.","Maintain your stance and straight arms. Return to the neutral position in a slow and controlled manner.","Repeat to failure.","Then, reposition and repeat the same series of movements on the opposite side."],"sh":4,"p":23,"fo":"pull","pt":"Lenhador na polia (wood chop)"},{"id":"Standing_Calf_Raises","n":"Standing Calf Raises","eq":"machine","lv":"beginner","pm":["calves"],"sm":[],"mc":"isolation","ins":["Adjust the padded lever of the calf raise machine to fit your height.","Place your shoulders under the pads provided and position your toes facing forward (or using any of the two other positions described at the beginning of the chapter). The balls of your feet should be secured on top of the calf block with the heels extending off it. Push the lever up by extending your hips and knees until your torso is standing erect. The knees should be kept with a slight bend; never locked. Toes should be facing forward, outwards or inwards as described at the beginning of the chapter. This will be your starting position.","Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.","Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.","Repeat for the recommended amount of repetitions."],"sh":5,"p":0,"fo":"push","pt":"Panturrilha em pé"},{"id":"Standing_Leg_Curl","n":"Standing Leg Curl","eq":"machine","lv":"beginner","pm":["hamstrings"],"sm":[],"mc":"isolation","ins":["Adjust the machine lever to fit your height and lie with your torso bent at the waist facing forward around 30-45 degrees (since an angled position is more favorable for hamstrings recruitment) with the pad of the lever on the back of your right leg (just a few inches under the calves) and the front of the right leg on top of the machine pad.","Keeping the torso bent forward, ensure your leg is fully stretched and grab the side handles of the machine. Position your toes straight. This will be your starting position.","As you exhale, curl your right leg up as far as possible without lifting the upper leg from the pad. Once you hit the fully contracted position, hold it for a second.","As you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions.","Perform the same exercise now for the left leg."],"sh":5,"p":1,"fo":"pull","pt":"Flexora em pé"},{"id":"Standing_Low-Pulley_Deltoid_Raise","n":"Standing Low-Pulley Deltoid Raise","eq":"cable","lv":"beginner","pm":["shoulders"],"sm":["forearms"],"mc":"isolation","ins":["Start by standing to the right side of a low pulley row. Use your left hand to come across the body and grab a single handle attached to the low pulley with a pronated grip (palms facing down). Rest your arm in front of you. Your right hand should grab the machine for better support and balance.","Make sure that your back is erect and your feet are shoulder width apart from each other. This is the starting position.","Begin to use the left hand and come across your body out until it is elevated to shoulder height while exhaling.","Feel the contraction at the top for a second and begin to slowly lower the handle back down to the original starting position while inhaling.","Repeat for the recommended amount of repetitions.","Switch arms and repeat the exercise."],"sh":5,"p":2,"fo":"push","pt":"Elevação lateral na polia baixa"},{"id":"Standing_Low-Pulley_One-Arm_Triceps_Extension","n":"Standing Low-Pulley One-Arm Triceps Extension","eq":"cable","lv":"intermediate","pm":["triceps"],"sm":["chest","shoulders"],"mc":"isolation","ins":["Grab a single handle with your left arm next to the low pulley machine. Turn away from the machine keeping the handle to the side of your body with your arm fully extended. Now use both hands to elevate the single handle directly above the head with the palm facing forward. Keep your upper arm completely vertical (perpendicular to the floor) and put your right hand on your left elbow to help keep it steady. This is the starting position.","Keeping your upper arms close to your head (elbows in) and perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.","Go back to the starting position by using the triceps to raise the single handle. Breathe out as you perform this step.","Repeat for the recommended amount of repetitions.","Switch arms and repeat the exercise."],"sh":5,"p":3,"fo":"push","pt":"Extensão de tríceps unilateral em pé na polia baixa"},{"id":"Standing_One-Arm_Cable_Curl","n":"Standing One-Arm Cable Curl","eq":"cable","lv":"intermediate","pm":["biceps"],"sm":[],"mc":"isolation","ins":["Start out by grabbing single handle next to the low pulley machine. Make sure you are far enough from the machine so that your arm is supporting the weight.","Make sure that your upper arm is stationary, perpendicular to the floor with elbows in and palms facing forward. Your non lifting arm should be grabbing your waist. This will allow you to keep your balance.","Slowly begin to curl the single handle upwards while keeping the upper arm stationary until your forearm touches your bicep while exhaling. Tip: Only the forearm should move.","Hold the contraction position as you squeeze the bicep and then lower the single handle back down to the starting position as you inhale.","Repeat for the recommended amount of repetitions.","Switch arms while performing this exercise."],"sh":5,"p":4,"fo":"pull","pt":"Rosca unilateral em pé na polia"},{"id":"Standing_Rope_Crunch","n":"Standing Rope Crunch","eq":"cable","lv":"beginner","pm":["abdominals"],"sm":[],"mc":"isolation","ins":["Attach a rope to a high pulley and select an appropriate weight.","Stand with your back to the cable tower. Take the rope with both hands over your shoulders, holding it to your upper chest. This will be your starting position.","Perform the movement by flexing the spine, crunching the weight down as far as you can.","Hold the peak contraction for a moment before returning to the starting position."],"sh":5,"p":5,"fo":"pull","pt":"Abdominal em pé na polia com corda"},{"id":"Straight-Arm_Pulldown","n":"Straight-Arm Pulldown","eq":"cable","lv":"beginner","pm":["lats"],"sm":[],"mc":"isolation","ins":["You will start by grabbing the wide bar from the top pulley of a pulldown machine and using a wider than shoulder-width pronated (palms down) grip. Step backwards two feet or so.","Bend your torso forward at the waist by around 30-degrees with your arms fully extended in front of you and a slight bend at the elbows. If your arms are not fully extended then you need to step a bit more backwards until they are. Once your arms are fully extended and your torso is slightly bent at the waist, tighten the lats and then you are ready to begin.","While keeping the arms straight, pull the bar down by contracting the lats until your hands are next to the side of the thighs. Breathe out as you perform this step.","While keeping the arms straight, go back to the starting position while breathing in.","Repeat for the recommended amount of repetitions."],"sh":5,"p":6,"fo":"pull","pt":"Pulldown com braços estendidos"},{"id":"Thigh_Abductor","n":"Thigh Abductor","eq":"machine","lv":"beginner","pm":["abductors"],"sm":["glutes"],"mc":"isolation","ins":["To begin, sit down on the abductor machine and select a weight you are comfortable with. When your legs are positioned properly, grip the handles on each side. Your entire upper body (from the waist up) should be stationary. This is the starting position.","Slowly press against the machine with your legs to move them away from each other while exhaling.","Feel the contraction for a second and begin to move your legs back to the starting position while breathing in. Note: Remember to keep your upper body stationary to prevent any injuries from occurring.","Repeat for the recommended amount of repetitions."],"sh":5,"p":7,"fo":"push","pt":"Cadeira abdutora"},{"id":"Thigh_Adductor","n":"Thigh Adductor","eq":"machine","lv":"beginner","pm":["adductors"],"sm":["glutes","hamstrings"],"mc":"isolation","ins":["To begin, sit down on the adductor machine and select a weight you are comfortable with. When your legs are positioned properly on the leg pads of the machine, grip the handles on each side. Your entire upper body (from the waist up) should be stationary. This is the starting position.","Slowly press against the machine with your legs to move them towards each other while exhaling.","Feel the contraction for a second and begin to move your legs back to the starting position while breathing in. Note: Remember to keep your upper body stationary and avoid fast jerking motions in order to prevent any injuries from occurring.","Repeat for the recommended amount of repetitions."],"sh":5,"p":8,"fo":"pull","pt":"Cadeira adutora"},{"id":"Triceps_Overhead_Extension_with_Rope","n":"Triceps Overhead Extension with Rope","eq":"cable","lv":"beginner","pm":["triceps"],"sm":[],"mc":"isolation","ins":["Attach a rope to a low pulley. After selecting an appropriate weight, grasp the rope with both hands and face away from the cable.","Position your hands behind your head with your elbows point straight up. Your elbows should start out flexed, and you can stagger your stance and lean gently away from the machine to create greater stability. This will be your starting position.","To perform the movement, extend through the elbow while keeping the upper arm in position, raising your hands above your head.","Squeeze your triceps at the top of the movement, and slowly lower the weight back to the start position."],"sh":5,"p":9,"fo":"push","pt":"Tríceps francês com corda na polia"},{"id":"Triceps_Pushdown","n":"Triceps Pushdown","eq":"cable","lv":"beginner","pm":["triceps"],"sm":[],"mc":"isolation","ins":["Attach a straight or angled bar to a high pulley and grab with an overhand grip (palms facing down) at shoulder width.","Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the bar. This is your starting position.","Using the triceps, bring the bar down until it touches the front of your thighs and the arms are fully extended perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.","After a second hold at the contracted position, bring the bar slowly up to the starting point. Breathe in as you perform this step.","Repeat for the recommended amount of repetitions."],"sh":5,"p":10,"fo":"push","pt":"Tríceps na polia"},{"id":"Triceps_Pushdown_-_Rope_Attachment","n":"Triceps Pushdown - Rope Attachment","eq":"cable","lv":"beginner","pm":["triceps"],"sm":[],"mc":"isolation","ins":["Attach a rope attachment to a high pulley and grab with a neutral grip (palms facing each other).","Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the rope with the palms facing each other. This is your starting position.","Using the triceps, bring the rope down as you bring each side of the rope to the side of your thighs. At the end of the movement the arms are fully extended and perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.","After holding for a second, at the contracted position, bring the rope slowly up to the starting point. Breathe in as you perform this step.","Repeat for the recommended amount of repetitions."],"sh":5,"p":11,"fo":"push","pt":"Tríceps corda na polia"},{"id":"Triceps_Pushdown_-_V-Bar_Attachment","n":"Triceps Pushdown - V-Bar Attachment","eq":"cable","lv":"beginner","pm":["triceps"],"sm":[],"mc":"isolation","ins":["Attach a V-Bar to a high pulley and grab with an overhand grip (palms facing down) at shoulder width.","Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the bar. The thumbs should be higher than the small finger. This is your starting position.","Using the triceps, bring the bar down until it touches the front of your thighs and the arms are fully extended perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.","After a second hold at the contracted position, bring the V-Bar slowly up to the starting point. Breathe in as you perform this step.","Repeat for the recommended amount of repetitions."],"sh":5,"p":12,"fo":"push","pt":"Tríceps na polia com barra V"},{"id":"Underhand_Cable_Pulldowns","n":"Underhand Cable Pulldowns","eq":"cable","lv":"beginner","pm":["lats"],"sm":["biceps","middle back","shoulders"],"mc":"compound","ins":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the pull-down bar with the palms facing your torso (a supinated grip). Make sure that the hands are placed closer than the shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, pull the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the fully contracted position and keep the elbows close to your body. The upper torso should remain stationary as your bring the bar to you and only the arms should move. The forearms should do no other work other than hold the bar.","After a second on the contracted position, while breathing in, slowly bring the bar back to the starting position when your arms are fully extended and the lats are fully stretched.","Repeat this motion for the prescribed amount of repetitions."],"sh":5,"p":13,"fo":"pull","pt":"Puxada com pegada supinada na polia"},{"id":"Upright_Cable_Row","n":"Upright Cable Row","eq":"cable","lv":"intermediate","pm":["traps"],"sm":["shoulders"],"mc":"compound","ins":["Grasp a straight bar cable attachment that is attached to a low pulley with a pronated (palms facing your thighs) grip that is slightly less than shoulder width. The bar should be resting on top of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight. This will be your starting position.","Use your side shoulders to lift the cable bar as you exhale. The bar should be close to the body as you move it up. Continue to lift it until it nearly touches your chin. Tip: Your elbows should drive the motion. As you lift the bar, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.","Lower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."],"sh":5,"p":14,"fo":"pull","pt":"Remada alta na polia"},{"id":"V-Bar_Pulldown","n":"V-Bar Pulldown","eq":"cable","lv":"intermediate","pm":["lats"],"sm":["biceps","middle back","shoulders"],"mc":"compound","ins":["Sit down on a pull-down machine with a V-Bar attached to the top pulley.","Adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the V-bar with the palms facing each other (a neutral grip). Stick your chest out and lean yourself back slightly (around 30-degrees) in order to better engage the lats. This will be your starting position.","Using your lats, pull the bar down as you squeeze your shoulder blades. Continue until your chest nearly touches the V-bar. Exhale as you execute this motion. Tip: Keep the torso stationary throughout the movement.","After a second hold on the contracted position, slowly bring the bar back to the starting position as you breathe in.","Repeat for the prescribed number of repetitions."],"sh":5,"p":15,"fo":"pull","pt":"Puxada com barra V"},{"id":"Wide-Grip_Lat_Pulldown","n":"Wide-Grip Lat Pulldown","eq":"cable","lv":"beginner","pm":["lats"],"sm":["biceps","middle back","shoulders"],"mc":"compound","ins":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, bring the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the bar; therefore do not try to pull down the bar using the forearms.","After a second at the contracted position squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.","Repeat this motion for the prescribed amount of repetitions."],"sh":5,"p":16,"fo":"pull","pt":"Puxada aberta (pulldown)"},{"id":"Wide-Grip_Pulldown_Behind_The_Neck","n":"Wide-Grip Pulldown Behind The Neck","eq":"cable","lv":"intermediate","pm":["lats"],"sm":["biceps","middle back","shoulders"],"mc":"compound","ins":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso and head forward. Think of an imaginary line from the center of the bar down to the back of your neck. This is your starting position.","As you breathe out, bring the bar down until it touches the back of your neck by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the bar; therefore do not try to pull down the bar using the forearms.","After a second on the contracted position squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.","Repeat this motion for the prescribed amount of repetitions."],"sh":5,"p":17,"fo":"pull","pt":"Puxada aberta atrás da nuca"},{"id":"Smith_Incline_Shoulder_Raise","n":"Smith Incline Shoulder Raise","eq":"barbell","lv":"beginner","pm":["shoulders"],"sm":["chest"],"mc":"isolation","ins":["Place an incline bench underneath the smith machine. Place the barbell at a height that you can reach when lying down and your arms are almost fully extended. Once the weight you need is selected, lie down on the incline bench and make sure your shoulders are aligned right under the barbell.","Using a shoulder width pronated (palms forward) grip, lift the bar from the rack and hold it straight over you with a slight bend at the elbows. This will be your starting position.","As you breathe out, lift the bar up until your arms are fully extended. Note: The contraction should be felt around the shoulders.","After a second pause, bring the bar back down to the starting position as you breathe in.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"sh":5,"p":18,"fo":"push","pt":"Elevação de ombros inclinada no Smith"},{"id":"Alternate_Hammer_Curl","n":"Alternate Hammer Curl","eq":"dumbbell","lv":"beginner","pm":["biceps"],"sm":["forearms"],"mc":"isolation","ins":["Stand up with your torso upright and a dumbbell in each hand being held at arms length. The elbows should be close to the torso.","The palms of the hands should be facing your torso. This will be your starting position.","While holding the upper arm stationary, curl the right weight forward while contracting the biceps as you breathe out. Continue the movement until your biceps is fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps. Tip: Only the forearms should move.","Slowly begin to bring the dumbbells back to starting position as your breathe in.","Repeat the movement with the left hand. This equals one repetition.","Continue alternating in this manner for the recommended amount of repetitions."],"sh":5,"p":19,"fo":"pull","pt":"Rosca martelo alternada"},{"id":"Alternate_Incline_Dumbbell_Curl","n":"Alternate Incline Dumbbell Curl","eq":"dumbbell","lv":"beginner","pm":["biceps"],"sm":["forearms"],"mc":"isolation","ins":["Sit down on an incline bench with a dumbbell in each hand being held at arms length. Tip: Keep the elbows close to the torso.This will be your starting position.","While holding the upper arm stationary, curl the right weight forward while contracting the biceps as you breathe out. As you do so, rotate the hand so that the palm is facing up. Continue the movement until your biceps is fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps. Tip: Only the forearms should move.","Slowly begin to bring the dumbbell back to starting position as your breathe in.","Repeat the movement with the left hand. This equals one repetition.","Continue alternating in this manner for the recommended amount of repetitions."],"sh":5,"p":20,"fo":"pull","pt":"Rosca alternada no banco inclinado"},{"id":"Alternating_Deltoid_Raise","n":"Alternating Deltoid Raise","eq":"dumbbell","lv":"beginner","pm":["shoulders"],"sm":[],"mc":"isolation","ins":["In a standing position, hold a pair of dumbbells at your side.","Keeping your elbows slightly bent, raise the weights directly in front of you to shoulder height, avoiding any swinging or cheating.","Return the weights to your side.","On the next repetition, raise the weights laterally, raising them out to your side to about shoulder height.","Return the weights to the starting position and continue alternating to the front and side."],"sh":5,"p":21,"fo":"push","pt":"Elevação frontal alternada"},{"id":"Arnold_Dumbbell_Press","n":"Arnold Dumbbell Press","eq":"dumbbell","lv":"intermediate","pm":["shoulders"],"sm":["triceps"],"mc":"compound","ins":["Sit on an exercise bench with back support and hold two dumbbells in front of you at about upper chest level with your palms facing your body and your elbows bent. Tip: Your arms should be next to your torso. The starting position should look like the contracted portion of a dumbbell curl.","Now to perform the movement, raise the dumbbells as you rotate the palms of your hands until they are facing forward.","Continue lifting the dumbbells until your arms are extended above you in straight arm position. Breathe out as you perform this portion of the movement.","After a second pause at the top, begin to lower the dumbbells to the original position by rotating the palms of your hands towards you. Tip: The left arm will be rotated in a counter clockwise manner while the right one will be rotated clockwise. Breathe in as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."],"sh":5,"p":22,"fo":"push","pt":"Desenvolvimento Arnold"},{"id":"Around_The_Worlds","n":"Around The Worlds","eq":"dumbbell","lv":"intermediate","pm":["chest"],"sm":["shoulders"],"mc":"compound","ins":["Lay down on a flat bench holding a dumbbell in each hand with the palms of the hands facing towards the ceiling. Tip: Your arms should be parallel to the floor and next to your thighs. To avoid injury, make sure that you keep your elbows slightly bent. This will be your starting position.","Now move the dumbbells by creating a semi-circle as you displace them from the initial position to over the head. All of the movement should happen with the arms parallel to the floor at all times. Breathe in as you perform this portion of the movement.","Reverse the movement to return the weight to the starting position as you exhale."],"sh":5,"p":23,"fo":"push","pt":"Voo ao redor do mundo com halteres"},{"id":"Bent-Arm_Dumbbell_Pullover","n":"Bent-Arm Dumbbell Pullover","eq":"dumbbell","lv":"intermediate","pm":["chest"],"sm":["lats","shoulders","triceps"],"mc":"compound","ins":["Place a dumbbell standing up on a flat bench.","Ensuring that the dumbbell stays securely placed at the top of the bench, lie perpendicular to the bench (torso across it as in forming a cross) with only your shoulders lying on the surface. Hips should be below the bench and legs bent with feet firmly on the floor. The head will be off the bench as well.","Grasp the dumbbell with both hands and hold it straight over your chest with a bend in your arms. Both palms should be pressing against the underside one of the sides of the dumbbell. This will be your starting position. Caution: Always ensure that the dumbbell used for this exercise is secure. Using a dumbbell with loose plates can result in the dumbbell falling apart and falling on your face.","While keeping your arms locked in the bent arm position, lower the weight slowly in an arc behind your head while breathing in until you feel a stretch on the chest.","At that point, bring the dumbbell back to the starting position using the arc through which the weight was lowered and exhale as you perform this movement.","Hold the weight on the initial position for a second and repeat the motion for the prescribed number of repetitions."],"sh":6,"p":0,"fo":"push","pt":"Pullover com halter e cotovelos flexionados"},{"id":"Bent_Over_Dumbbell_Rear_Delt_Raise_With_Head_On_Bench","n":"Bent Over Dumbbell Rear Delt Raise With Head On Bench","eq":"dumbbell","lv":"beginner","pm":["shoulders"],"sm":[],"mc":"isolation","ins":["Stand up straight while holding a dumbbell in each hand and with an incline bench in front of you.","While keeping your back straight and maintaining the natural arch of your back, lean forward until your forehead touches the bench in front of you. Let the arms hang in front of you perpendicular to the ground. The palms of your hands should be facing each other and your torso should be parallel to the floor. This will be your starting position.","Keeping your torso forward and stationary, and the arms straight with a slight bend at the elbows, lift the dumbbells straight to the side until both arms are parallel to the floor. Exhale as you lift the weights. Caution: avoid swinging the torso or bringing the arms back as opposed to the side.","After a one second contraction at the top, slowly lower the dumbbells back to the starting position.","Repeat the recommended amount of repetitions."],"sh":6,"p":1,"fo":"pull","pt":"Crucifixo inverso com halteres apoiado no banco"},{"id":"Bent_Over_Two-Dumbbell_Row","n":"Bent Over Two-Dumbbell Row","eq":"dumbbell","lv":"beginner","pm":["middle back"],"sm":["biceps","lats","shoulders"],"mc":"compound","ins":["With a dumbbell in each hand (palms facing your torso), bend your knees slightly and bring your torso forward by bending at the waist; as you bend make sure to keep your back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The weights should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.","While keeping the torso stationary, lift the dumbbells to your side (as you breathe out), keeping the elbows close to the body (do not exert any force with the forearm other than holding the weights). On the top contracted position, squeeze the back muscles and hold for a second.","Slowly lower the weight again to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"sh":6,"p":2,"fo":"pull","pt":"Remada curvada com halteres"},{"id":"Bent_Over_Two-Dumbbell_Row_With_Palms_In","n":"Bent Over Two-Dumbbell Row With Palms In","eq":"dumbbell","lv":"beginner","pm":["middle back"],"sm":["biceps","lats"],"mc":"compound","ins":["With a dumbbell in each hand (palms facing each other), bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The weights should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.","While keeping the torso stationary, lift the dumbbells to your side as you breathe out, squeezing your shoulder blades together. On the top contracted position, squeeze the back muscles and hold for a second.","Slowly lower the weight again to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"sh":6,"p":3,"fo":"pull","pt":"Remada curvada com halteres (pegada neutra)"},{"id":"Calf_Raise_On_A_Dumbbell","n":"Calf Raise On A Dumbbell","eq":"dumbbell","lv":"intermediate","pm":["calves"],"sm":[],"mc":"isolation","ins":["Hang on to a sturdy object for balance and stand on a dumbbell handle, preferably one with round plates so that it rolls as in this manner you have to work harder to stabilize yourself; thus increasing the effectiveness of the exercise.","Now roll your foot slightly forward so that you can get a nice stretch of the calf. This will be your starting position.","Lift the calf as you roll your foot over the top of the handle so that you get a full extension. Exhale during the execution of this movement. Contract the calf hard at the top and hold for a second. Tip: As you come up, roll the dumbbell slightly backward.","Now inhale as you roll the dumbbell slightly forward as you come down to get a better stretch.","Repeat for the recommended amount of repetitions."],"sh":6,"p":4,"fo":"push","pt":"Panturrilha apoiada em halter"},{"id":"Close-Grip_Dumbbell_Press","n":"Close-Grip Dumbbell Press","eq":"dumbbell","lv":"beginner","pm":["triceps"],"sm":["chest","shoulders"],"mc":"compound","ins":["Place a dumbbell standing up on a flat bench.","Ensuring that the dumbbell stays securely placed at the top of the bench, lie perpendicular to the bench with only your shoulders lying on the surface. Hips should be below the bench and your legs bent with your feet firmly on the floor.","Grasp the dumbbell with both hands and hold it straight over your chest at arm's length. Both palms should be pressing against the underside of the sides of the dumbbell. This will be your starting position.","Initiate the movement by lowering the dumbbell to your chest.","Return to the starting position by extending the elbows."],"sh":6,"p":5,"fo":"push","pt":"Supino fechado com halteres"},{"id":"Concentration_Curls","n":"Concentration Curls","eq":"dumbbell","lv":"beginner","pm":["biceps"],"sm":["forearms"],"mc":"isolation","ins":["Sit down on a flat bench with one dumbbell in front of you between your legs. Your legs should be spread with your knees bent and feet on the floor.","Use your right arm to pick the dumbbell up. Place the back of your right upper arm on the top of your inner right thigh. Rotate the palm of your hand until it is facing forward away from your thigh. Tip: Your arm should be extended and the dumbbell should be above the floor. This will be your starting position.","While holding the upper arm stationary, curl the weights forward while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Tip: At the top of the movement make sure that the little finger of your arm is higher than your thumb. This guarantees a good contraction. Hold the contracted position for a second as you squeeze the biceps.","Slowly begin to bring the dumbbells back to starting position as your breathe in. Caution: Avoid swinging motions at any time.","Repeat for the recommended amount of repetitions. Then repeat the movement with the left arm."],"sh":6,"p":6,"fo":"pull","pt":"Rosca concentrada"},{"id":"Cross_Body_Hammer_Curl","n":"Cross Body Hammer Curl","eq":"dumbbell","lv":"beginner","pm":["biceps"],"sm":["forearms"],"mc":"isolation","ins":["Stand up straight with a dumbbell in each hand. Your hands should be down at your side with your palms facing in.","While keeping your palms facing in and without twisting your arm, curl the dumbbell of the right arm up towards your left shoulder as you exhale. Touch the top of the dumbbell to your shoulder and hold the contraction for a second.","Slowly lower the dumbbell along the same path as you inhale and then repeat the same movement for the left arm.","Continue alternating in this fashion until the recommended amount of repetitions is performed for each arm."],"sh":6,"p":7,"fo":"pull","pt":"Rosca martelo cruzada"},{"id":"Cuban_Press","n":"Cuban Press","eq":"dumbbell","lv":"intermediate","pm":["shoulders"],"sm":["traps"],"mc":"compound","ins":["Take a dumbbell in each hand with a pronated grip in a standing position. Raise your upper arms so that they are parallel to the floor, allowing your lower arms to hang in the \"scarecrow\" position. This will be your starting position.","To initiate the movement, externally rotate the shoulders to move the upper arm 180 degrees. Keep the upper arms in place, rotating the upper arms until the wrists are directly above the elbows, the forearms perpendicular to the floor.","Now press the dumbbells by extending at the elbows, straightening your arms overhead.","Return to the starting position as you breathe in by reversing the steps.","Repeat for the recommended amount of repetitions."],"sh":6,"p":8,"fo":"push","pt":"Cuban press (rotação com desenvolvimento)"},{"id":"Decline_Dumbbell_Bench_Press","n":"Decline Dumbbell Bench Press","eq":"dumbbell","lv":"beginner","pm":["chest"],"sm":["shoulders","triceps"],"mc":"compound","ins":["Secure your legs at the end of the decline bench and lie down with a dumbbell on each hand on top of your thighs. The palms of your hand will be facing each other.","Once you are laying down, move the dumbbells in front of you at shoulder width.","Once at shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position.","Bring down the weights slowly to your side as you breathe out. Keep full control of the dumbbells at all times. Tip: Throughout the motion, the forearms should always be perpendicular to the floor.","As you breathe out, push the dumbbells up using your pectoral muscles. Lock your arms in the contracted position, squeeze your chest, hold for a second and then start coming down slowly. Tip: It should take at least twice as long to go down than to come up..","Repeat the movement for the prescribed amount of repetitions of your training program."],"sh":6,"p":9,"fo":"push","pt":"Supino declinado com halteres"},{"id":"Decline_Dumbbell_Flyes","n":"Decline Dumbbell Flyes","eq":"dumbbell","lv":"beginner","pm":["chest"],"sm":[],"mc":"compound","ins":["Secure your legs at the end of the decline bench and lie down with a dumbbell on each hand on top of your thighs. The palms of your hand will be facing each other.","Once you are laying down, move the dumbbells in front of you at shoulder width. The palms of the hands should be facing each other and the arms should be perpendicular to the floor and fully extended. This will be your starting position.","With a slight bend on your elbows in order to prevent stress at the biceps tendon, lower your arms out at both sides in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms should remain stationary; the movement should only occur at the shoulder joint.","Return your arms back to the starting position as you squeeze your chest muscles and breathe out. Tip: Make sure to use the same arc of motion used to lower the weights.","Hold for a second at the contracted position and repeat the movement for the prescribed amount of repetitions."],"sh":6,"p":10,"fo":"push","pt":"Crucifixo declinado com halteres"},{"id":"Decline_Dumbbell_Triceps_Extension","n":"Decline Dumbbell Triceps Extension","eq":"dumbbell","lv":"beginner","pm":["triceps"],"sm":[],"mc":"isolation","ins":["Secure your legs at the end of the decline bench and lie down with a dumbbell on each hand on top of your thighs. The palms of your hand will be facing each other.","Once you are laying down, move the dumbbells in front of you at shoulder width. The palms of the hands should be facing each other and the arms should be perpendicular to the floor and fully extended. This will be your starting position.","As you breathe in and you keep the upper arms stationary (and elbows in), bring the dumbbells down slowly by moving your forearms in a semicircular motion towards you until your thumbs are next to your ears. Breathe in as you perform this portion of the movement.","Lift the dumbbells back to the starting position by contracting the triceps and exhaling.","Repeat for the recommended amount of repetitions."],"sh":6,"p":11,"fo":"push","pt":"Tríceps testa declinado com halter"},{"id":"Dumbbell_Alternate_Bicep_Curl","n":"Dumbbell Alternate Bicep Curl","eq":"dumbbell","lv":"beginner","pm":["biceps"],"sm":["forearms"],"mc":"isolation","ins":["Stand (torso upright) with a dumbbell in each hand held at arms length. The elbows should be close to the torso and the palms of your hand should be facing your thighs.","While holding the upper arm stationary, curl the right weight as you rotate the palm of the hands until they are facing forward. At this point continue contracting the biceps as you breathe out until your biceps is fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps. Tip: Only the forearms should move.","Slowly begin to bring the dumbbell back to the starting position as your breathe in. Tip: Remember to twist the palms back to the starting position (facing your thighs) as you come down.","Repeat the movement with the left hand. This equals one repetition.","Continue alternating in this manner for the recommended amount of repetitions."],"sh":6,"p":12,"fo":"pull","pt":"Rosca direta alternada com halteres"},{"id":"Dumbbell_Bench_Press","n":"Dumbbell Bench Press","eq":"dumbbell","lv":"beginner","pm":["chest"],"sm":["shoulders","triceps"],"mc":"compound","ins":["Lie down on a flat bench with a dumbbell in each hand resting on top of your thighs. The palms of your hands will be facing each other.","Then, using your thighs to help raise the dumbbells up, lift the dumbbells one at a time so that you can hold them in front of you at shoulder width.","Once at shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. The dumbbells should be just to the sides of your chest, with your upper arm and forearm creating a 90 degree angle. Be sure to maintain full control of the dumbbells at all times. This will be your starting position.","Then, as you breathe out, use your chest to push the dumbbells up. Lock your arms at the top of the lift and squeeze your chest, hold for a second and then begin coming down slowly. Tip: Ideally, lowering the weight should take about twice as long as raising it.","Repeat the movement for the prescribed amount of repetitions of your training program."],"sh":6,"p":13,"fo":"push","pt":"Supino reto com halteres"},{"id":"Dumbbell_Bench_Press_with_Neutral_Grip","n":"Dumbbell Bench Press with Neutral Grip","eq":"dumbbell","lv":"beginner","pm":["chest"],"sm":["shoulders","triceps"],"mc":"compound","ins":["Take a dumbbell in each hand and lay back onto a flat bench. Your feet should be flat on the floor and your shoulder blades retracted.","Maintaining a neutral grip, palms facing each other, begin with your arms extended directly above you, perpendicular to the floor. This will be your starting position.","Begin the movement by flexing the elbow, lowering the upper arms to the side. Descend until the dumbbells are to your torso.","Pause, then extend the elbow and return to the starting position."],"sh":6,"p":14,"fo":"push","pt":"Supino com halteres e pegada neutra"},{"id":"Dumbbell_Bicep_Curl","n":"Dumbbell Bicep Curl","eq":"dumbbell","lv":"beginner","pm":["biceps"],"sm":["forearms"],"mc":"isolation","ins":["Stand up straight with a dumbbell in each hand at arm's length. Keep your elbows close to your torso and rotate the palms of your hands until they are facing forward. This will be your starting position.","Now, keeping the upper arms stationary, exhale and curl the weights while contracting your biceps. Continue to raise the weights until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a brief pause as you squeeze your biceps.","Then, inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the recommended amount of repetitions."],"sh":6,"p":15,"fo":"pull","pt":"Rosca direta com halteres"},{"id":"Dumbbell_Clean","n":"Dumbbell Clean","eq":"dumbbell","lv":"intermediate","pm":["hamstrings"],"sm":["calves","forearms","glutes","lower back","quadriceps","shoulders","traps"],"mc":"compound","ins":["Begin standing with a dumbbell in each hand with your feet shoulder width apart.","Lower the weights to the floor by flexing at the hips and knees, pushing your hips back until the dumbbells reach the floor. This will be your starting position.","To initiate the movement, violently jump upward by extending the hips, knees, and ankles to acclerate the weights upward. Maintaining a neutral grip on the dumbbells, keep the arms straight until full extension is reached.","After full extension, rebend the hips and knees to receive the weight in a squat position. Allow the arms to bend, guiding the dumbbells to your shoulders.","Upon receiving the weight in the squat position, extend the hips and knees to finish in a standing position with the weights on your shoulders."],"sh":6,"p":16,"fo":"pull","pt":"Clean com halteres"},{"id":"Dumbbell_Flyes","n":"Dumbbell Flyes","eq":"dumbbell","lv":"beginner","pm":["chest"],"sm":[],"mc":"isolation","ins":["Lie down on a flat bench with a dumbbell on each hand resting on top of your thighs. The palms of your hand will be facing each other.","Then using your thighs to help raise the dumbbells, lift the dumbbells one at a time so you can hold them in front of you at shoulder width with the palms of your hands facing each other. Raise the dumbbells up like you're pressing them, but stop and hold just before you lock out. This will be your starting position.","With a slight bend on your elbows in order to prevent stress at the biceps tendon, lower your arms out at both sides in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms should remain stationary; the movement should only occur at the shoulder joint.","Return your arms back to the starting position as you squeeze your chest muscles and breathe out. Tip: Make sure to use the same arc of motion used to lower the weights.","Hold for a second at the contracted position and repeat the movement for the prescribed amount of repetitions."],"sh":6,"p":17,"fo":"push","pt":"Crucifixo reto com halteres"},{"id":"Dumbbell_Incline_Row","n":"Dumbbell Incline Row","eq":"dumbbell","lv":"beginner","pm":["middle back"],"sm":["biceps","forearms","lats","shoulders"],"mc":"compound","ins":["Using a neutral grip, lean into an incline bench.","Take a dumbbell in each hand with a neutral grip, beginning with the arms straight. This will be your starting position.","Retract the shoulder blades and flex the elbows to row the dumbbells to your side.","Pause at the top of the motion, and then return to the starting position."],"sh":6,"p":18,"fo":"pull","pt":"Remada inclinada com halteres"},{"id":"Dumbbell_Incline_Shoulder_Raise","n":"Dumbbell Incline Shoulder Raise","eq":"dumbbell","lv":"beginner","pm":["shoulders"],"sm":["triceps"],"mc":"isolation","ins":["Sit on an Incline Bench while holding a dumbbell on each hand on top of your thighs.","Lift your legs up to kick the weights to your shoulders and lean back. Position the dumbbells above your shoulders with your arms extended. The arms should be perpendicular to the floor with your palms facing forward and knuckles pointing towards the ceiling. This will be your starting position.","While keeping the arms straight and locked, lift the dumbbells by raising the shoulders from the bench as you breathe out.","Bring back the dumbbells to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."],"sh":6,"p":19,"fo":"push","pt":"Elevação de ombros inclinada com halteres"},{"id":"Dumbbell_Lunges","n":"Dumbbell Lunges","eq":"dumbbell","lv":"beginner","pm":["quadriceps"],"sm":["calves","glutes","hamstrings"],"mc":"compound","ins":["Stand with your torso upright holding two dumbbells in your hands by your sides. This will be your starting position.","Step forward with your right leg around 2 feet or so from the foot being left stationary behind and lower your upper body down, while keeping the torso upright and maintaining balance. Inhale as you go down. Note: As in the other exercises, do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. Make sure that you keep your front shin perpendicular to the ground.","Using mainly the heel of your foot, push up and go back to the starting position as you exhale.","Repeat the movement for the recommended amount of repetitions and then perform with the left leg."],"sh":6,"p":20,"fo":"push","pt":"Avanço com halteres"},{"id":"Dumbbell_Lying_One-Arm_Rear_Lateral_Raise","n":"Dumbbell Lying One-Arm Rear Lateral Raise","eq":"dumbbell","lv":"intermediate","pm":["shoulders"],"sm":["middle back"],"mc":"isolation","ins":["While holding a dumbbell in one hand, lay with your chest down on a slightly inclined (around 15 degrees when measured from the floor) adjustable bench. The other hand can be used to hold to the leg of the bench for stability.","Position the palm of the hand that is holding the dumbbell in a neutral manner (palms facing your torso) as you keep the arm extended with the elbow slightly bent. This will be your starting position.","Now raise the arm with the dumbbell to the side until your elbow is at shoulder height and your arm is roughly parallel to the floor as you exhale. Tip: Maintain your arm perpendicular to the torso while keeping your arm extended throughout the movement. Also, keep the contraction at the top for a second.","Slowly lower the dumbbell to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"sh":6,"p":21,"fo":"pull","pt":"Elevação lateral posterior unilateral deitado"},{"id":"Dumbbell_Lying_Pronation","n":"Dumbbell Lying Pronation","eq":"dumbbell","lv":"intermediate","pm":["forearms"],"sm":[],"mc":"isolation","ins":["Lie on a flat bench face down with one arm holding a dumbbell and the other hand on top of the bench folded so that you can rest your head on it.","Bend the elbows of the arm holding the dumbbell so that it creates a 90-degree angle between the upper arm and the forearm.","Now raise the upper arm so that the forearm is perpendicular to the floor and the upper arm is perpendicular to your torso. Tip: The upper arm should be parallel to the floor and also creating a 90-degree angle with your torso. This will be your starting position.","As you breathe out, externally rotate your forearm so that the dumbbell is lifted forward as you maintain the 90 degree angle bend between the upper arms and the forearm. You will continue this external rotation until the forearm is parallel to the floor. At this point you will hold the contraction for a second.","As you breathe in, slowly go back to the starting position.","Repeat for the recommended amount of repetitions."],"sh":6,"p":22,"fo":"pull","pt":"Pronação do antebraço com halter deitado"},{"id":"Dumbbell_Lying_Rear_Lateral_Raise","n":"Dumbbell Lying Rear Lateral Raise","eq":"dumbbell","lv":"intermediate","pm":["shoulders"],"sm":[],"mc":"isolation","ins":["While holding a dumbbell in each hand, lay with your chest down on a slightly inclined (around 15 degrees when measured from the floor) adjustable bench.","Position the palms of the hands in a neutral manner (palms facing your torso) as you keep the arms extended with the elbows slightly bent. This will be your starting position.","Now raise the arms to the side until your elbows are at shoulder height and your arms are roughly parallel to the floor as you exhale. Tip: Maintain your arms perpendicular to the torso while keeping them extended throughout the movement. Also, keep the contraction at the top for a second.","Slowly lower the dumbbells to the starting position as you inhale.","Repeat for the recommended amount of repetitions and then switch to the other arm."],"sh":6,"p":23,"fo":"pull","pt":"Elevação lateral posterior deitado"},{"id":"Dumbbell_Lying_Supination","n":"Dumbbell Lying Supination","eq":"dumbbell","lv":"intermediate","pm":["forearms"],"sm":[],"mc":"isolation","ins":["Lie sideways on a flat bench with one arm holding a dumbbell and the other hand on top of the bench folded so that you can rest your head on it.","Bend the elbows of the arm holding the dumbbell so that it creates a 90-degree angle between the upper arm and the forearm.","Now raise the upper arm so that the forearm is parallel to the floor and perpendicular to your torso (Tip: So the forearm will be directly in front of you). The upper arm will be stationary by your torso and should be parallel to the floor (aligned with your torso at all times). This will be your starting position.","As you breathe out, externally rotate your forearm so that the dumbbell is lifted up in a semicircle motion as you maintain the 90 degree angle bend between the upper arms and the forearm. You will continue this external rotation until the forearm is perpendicular to the floor and the torso pointing towards the ceiling. At this point you will hold the contraction for a second.","As you breathe in, slowly go back to the starting position.","Repeat for the recommended amount of repetitions and then switch to the other arm."],"sh":7,"p":0,"fo":"pull","pt":"Supinação do antebraço com halter deitado"},{"id":"Dumbbell_One-Arm_Triceps_Extension","n":"Dumbbell One-Arm Triceps Extension","eq":"dumbbell","lv":"intermediate","pm":["triceps"],"sm":[],"mc":"isolation","ins":["Grab a dumbbell and either sit on a military press bench or a utility bench that has a back support on it as you place the dumbbells upright on top of your thighs or stand up straight.","Clean the dumbbell up to bring it to shoulder height and then extend the arm over your head so that the whole arm is perpendicular to the floor and next to your head. The dumbbell should be on top of you. The other hand can be kept fully extended to the side, by the waist, supporting the upper arm that has the dumbbell or grabbing a fixed surface.","Rotate the wrist so that the palm of your hand is facing forward and the pinkie is facing the ceiling. This will be your starting position.","Slowly lower the dumbbell behind your head as you hold the upper arm stationary. Inhale as you perform this movement and pause when your triceps are fully stretched.","Return to the starting position by flexing your triceps as you breathe out. Tip: It is imperative that only the forearm moves. The upper arm should remain at all times stationary next to your head.","Repeat for the recommended amount of repetitions and switch arms."],"sh":7,"p":1,"fo":"push","pt":"Tríceps unilateral com halter"},{"id":"Dumbbell_Prone_Incline_Curl","n":"Dumbbell Prone Incline Curl","eq":"dumbbell","lv":"intermediate","pm":["biceps"],"sm":[],"mc":"isolation","ins":["Grab a dumbbell on each hand and lie face down on an incline bench with your shoulders near top of the incline. Your knees can rest on the seat or your legs can be straddled to the sides (my preferred way).","Let your arms extend and hang naturally in front of you so that they are perpendicular to the floor.","Now keep your elbows in by your side and face the palms forward. This will be your starting position.","Raise the dumbbells by contracting the biceps until your arms are fully flexed. Exhale as you perform this portion of the movement and ensure that only the forearms move. The upper arms should remain stationary at all times.","Lower the dumbbells until your arms are fully extended.","Repeat for the recommended amount of times."],"sh":7,"p":2,"fo":"pull","pt":"Rosca com halteres de bruços no banco inclinado"},{"id":"Dumbbell_Rear_Lunge","n":"Dumbbell Rear Lunge","eq":"dumbbell","lv":"intermediate","pm":["quadriceps"],"sm":["calves","glutes","hamstrings"],"mc":"compound","ins":["Stand with your torso upright holding two dumbbells in your hands by your sides. This will be your starting position.","Step backward with your right leg around two feet or so from the left foot and lower your upper body down, while keeping the torso upright and maintaining balance. Inhale as you go down. Tip: As in the other exercises, do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. Make sure that you keep your front shin perpendicular to the ground. Keep the torso upright during the lunge; flexible hip flexors are important. A long lunge emphasizes the Gluteus Maximus; a short lunge emphasizes Quadriceps.","Push up and go back to the starting position as you exhale. Tip: Use the ball of your feet to push in order to accentuate the quadriceps. To focus on the glutes, press with your heels.","Now repeat with the opposite leg."],"sh":7,"p":3,"fo":"push","pt":"Avanço para trás com halteres"},{"id":"Dumbbell_Seated_One-Leg_Calf_Raise","n":"Dumbbell Seated One-Leg Calf Raise","eq":"dumbbell","lv":"beginner","pm":["calves"],"sm":[],"mc":"isolation","ins":["Place a block on the floor about 12 inches from a flat bench.","Sit on a flat bench and place a dumbbell on your upper left thigh about 3 inches above your knee.","Now place the ball of your left foot on the block. This will be your starting position.","Raise your toes up as high as possible as you exhale and you contract your calf muscle. Hold the contraction for a second.","Slowly return to the starting position, stretching as far down as possible.","Repeat for your prescribed number of repetitions and then repeat with the right leg."],"sh":7,"p":4,"fo":"push","pt":"Panturrilha unilateral sentado com halter"},{"id":"Dumbbell_Shrug","n":"Dumbbell Shrug","eq":"dumbbell","lv":"beginner","pm":["traps"],"sm":[],"mc":"isolation","ins":["Stand erect with a dumbbell on each hand (palms facing your torso), arms extended on the sides.","Lift the dumbbells by elevating the shoulders as high as possible while you exhale. Hold the contraction at the top for a second. Tip: The arms should remain extended at all times. Refrain from using the biceps to help lift the dumbbells. Only the shoulders should be moving up and down.","Lower the dumbbells back to the original position.","Repeat for the recommended amount of repetitions."],"sh":7,"p":5,"fo":"pull","pt":"Encolhimento com halteres"},{"id":"Dumbbell_Side_Bend","n":"Dumbbell Side Bend","eq":"dumbbell","lv":"beginner","pm":["abdominals"],"sm":[],"mc":"isolation","ins":["Stand up straight while holding a dumbbell on the left hand (palms facing the torso) as you have the right hand holding your waist. Your feet should be placed at shoulder width. This will be your starting position.","While keeping your back straight and your head up, bend only at the waist to the right as far as possible. Breathe in as you bend to the side. Then hold for a second and come back up to the starting position as you exhale. Tip: Keep the rest of the body stationary.","Now repeat the movement but bending to the left instead. Hold for a second and come back to the starting position.","Repeat for the recommended amount of repetitions and then change hands."],"sh":7,"p":6,"fo":"pull","pt":"Inclinação lateral com halter"},{"id":"Dumbbell_Squat","n":"Dumbbell Squat","eq":"dumbbell","lv":"beginner","pm":["quadriceps"],"sm":["calves","glutes","hamstrings","lower back"],"mc":"compound","ins":["Stand up straight while holding a dumbbell on each hand (palms facing the side of your legs).","Position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section.","Begin to slowly lower your torso by bending the knees as you maintain a straight posture with the head up. Continue down until your thighs are parallel to the floor. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise your torso as you exhale by pushing the floor with the heel of your foot mainly as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."],"sh":7,"p":7,"fo":"push","pt":"Agachamento com halteres"},{"id":"Dumbbell_Squat_To_A_Bench","n":"Dumbbell Squat To A Bench","eq":"dumbbell","lv":"intermediate","pm":["quadriceps"],"sm":["calves","glutes","hamstrings","lower back"],"mc":"compound","ins":["Stand up straight with a flat bench behind you while holding a dumbbell on each hand (palms facing the side of your legs).","Position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section.","Begin to slowly lower your torso by bending the knees as you maintain a straight posture with the head up. Continue down until you slightly touch the bench behind you. Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot mainly as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."],"sh":7,"p":8,"fo":"push","pt":"Agachamento no banco com halteres"},{"id":"Dumbbell_Step_Ups","n":"Dumbbell Step Ups","eq":"dumbbell","lv":"intermediate","pm":["quadriceps"],"sm":["calves","glutes","hamstrings"],"mc":"compound","ins":["Stand up straight while holding a dumbbell on each hand (palms facing the side of your legs).","Place the right foot on the elevated platform. Step on the platform by extending the hip and the knee of your right leg. Use the heel mainly to lift the rest of your body up and place the foot of the left leg on the platform as well. Breathe out as you execute the force required to come up.","Step down with the left leg by flexing the hip and knee of the right leg as you inhale. Return to the original standing position by placing the right foot of to next to the left foot on the initial position.","Repeat with the right leg for the recommended amount of repetitions and then perform with the left leg."],"sh":7,"p":9,"fo":"push","pt":"Subida no banco com halteres (step-up)"},{"id":"Dumbbell_Tricep_Extension_-Pronated_Grip","n":"Dumbbell Tricep Extension -Pronated Grip","eq":"dumbbell","lv":"beginner","pm":["triceps"],"sm":[],"mc":"isolation","ins":["Lie down on a flat bench holding two dumbbells directly above your shoulders. Your arms should be fully extended and form a 90 degree angle from your torso and the floor.","The palms of your hands should be facing forward, and your elbows should be tucked in. This will be your starting position.","Now, inhale and slowly lower the dumbbells until they are near your ears. Be sure to keep your upper arms stationary and your elbows tucked in.","Then, exhale and use your triceps to return the weight to the starting position."],"sh":7,"p":10,"fo":"push","pt":"Tríceps com halteres (pegada pronada)"},{"id":"Lying_Dumbbell_Tricep_Extension","n":"Lying Dumbbell Tricep Extension","eq":"dumbbell","lv":"intermediate","pm":["triceps"],"sm":["chest","shoulders"],"mc":"isolation","ins":["Lie on a flat bench while holding two dumbbells directly in front of you. Your arms should be fully extended at a 90-degree angle from your torso and the floor. The palms should be facing in and the elbows should be tucked in. This is the starting position.","As you breathe in and you keep the upper arms stationary with the elbows in, slowly lower the weight until the dumbbells are near your ears.","At that point, while keeping the elbows in and the upper arms stationary, use the triceps to bring the weight back up to the starting position as you breathe out.","Repeat for the recommended amount of repetitions."],"sh":7,"p":11,"fo":"push","pt":"Tríceps testa com halteres"},{"id":"Middle_Back_Shrug","n":"Middle Back Shrug","eq":"dumbbell","lv":"intermediate","pm":["middle back"],"sm":[],"mc":"isolation","ins":["Lie facedown on an incline bench while holding a dumbbell in each hand. Your arms should be fully extended hanging down and pointing towards the floor. The palms of your hands should be facing each other. This will be your starting position.","As you exhale, squeeze your shoulder blades together and hold the contraction for a full second. Tip: This movement is just like the reverse action of a hug, or trying to perform rear laterals as if you had no arms.","As you inhale go back to the starting position.","Repeat for the recommended amount of repetitions."],"sh":7,"p":12,"fo":"pull","pt":"Encolhimento para meio das costas"},{"id":"One-Arm_Dumbbell_Row","n":"One-Arm Dumbbell Row","eq":"dumbbell","lv":"beginner","pm":["middle back"],"sm":["biceps","lats","shoulders"],"mc":"compound","ins":["Choose a flat bench and place a dumbbell on each side of it.","Place the right leg on top of the end of the bench, bend your torso forward from the waist until your upper body is parallel to the floor, and place your right hand on the other end of the bench for support.","Use the left hand to pick up the dumbbell on the floor and hold the weight while keeping your lower back straight. The palm of the hand should be facing your torso. This will be your starting position.","Pull the resistance straight up to the side of your chest, keeping your upper arm close to your side and keeping the torso stationary. Breathe out as you perform this step. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. Also, make sure that the force is performed with the back muscles and not the arms. Finally, the upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the dumbbell; therefore do not try to pull the dumbbell up using the forearms.","Lower the resistance straight down to the starting position. Breathe in as you perform this step.","Repeat the movement for the specified amount of repetitions.","Switch sides and repeat again with the other arm."],"sh":7,"p":13,"fo":"pull","pt":"Remada unilateral com halter (serrote)"},{"id":"One_Arm_Pronated_Dumbbell_Triceps_Extension","n":"One Arm Pronated Dumbbell Triceps Extension","eq":"dumbbell","lv":"beginner","pm":["triceps"],"sm":[],"mc":"isolation","ins":["Lie flat on a bench while holding a dumbbell at arms length. Your arm should be perpendicular to your body. The palm of your hand should be facing towards your feet as a pronated grip is required to perform this exercise.","Place your non lifting hand on your bicep for support.","Slowly begin to lower the dumbbell down as you breathe in.","Then, begin lifting the dumbbell upward as you contract the triceps. Remember to breathe out during the concentric (lifting part of the exercise).","Repeat until you have performed your set repetitions.","Switch arms and repeat the movement."],"sh":7,"p":14,"fo":"push","pt":"Tríceps unilateral com halter (pronado)"},{"id":"One_Arm_Supinated_Dumbbell_Triceps_Extension","n":"One Arm Supinated Dumbbell Triceps Extension","eq":"dumbbell","lv":"beginner","pm":["triceps"],"sm":[],"mc":"isolation","ins":["Lie flat on a bench while holding a dumbbell at arms length. Your arm should be perpendicular to your body. The palm of your hand should be facing towards your face as a supinated grip is required to perform this exercise.","Place your non lifting hand on your bicep for support.","Slowly begin to lower the dumbbell down as you breathe in.","Then, begin lifting the dumbbell upward as you contract the triceps. Remember to breathe out during the concentric (lifting part of the exercise).","Repeat until you have performed your set repetitions.","Switch arms and repeat the movement.","Switch arms again and repeat the movement."],"sh":7,"p":15,"fo":"push","pt":"Tríceps unilateral com halter (supinado)"},{"id":"Palms-Down_Dumbbell_Wrist_Curl_Over_A_Bench","n":"Palms-Down Dumbbell Wrist Curl Over A Bench","eq":"dumbbell","lv":"beginner","pm":["forearms"],"sm":[],"mc":"isolation","ins":["Start out by placing two dumbbells on one side of a flat bench.","Kneel down on both of your knees so that your body is facing the flat bench.","Use your arms to grab both of the dumbbells with a pronated grip (palms facing down) and bring them up so that your forearms are resting against the flat bench. Your wrists should be hanging over the edge.","Start out by curling your wrist upwards and exhaling.","Slowly lower your wrists back down to the starting position while inhaling.","Your forearms should be stationary as your wrist is the only movement needed to perform this exercise.","Repeat for the recommended amount of repetitions."],"sh":7,"p":16,"fo":"pull","pt":"Rosca de punho inversa com halteres no banco"},{"id":"Palms-Up_Dumbbell_Wrist_Curl_Over_A_Bench","n":"Palms-Up Dumbbell Wrist Curl Over A Bench","eq":"dumbbell","lv":"beginner","pm":["forearms"],"sm":[],"mc":"isolation","ins":["Start out by placing two dumbbells on one side of a flat bench.","Kneel down on both of your knees so that your body is facing the flat bench.","Use your arms to grab both of the dumbbells with a supinated grip (palms up) and bring them up so that your forearms are resting against the flat bench. Your wrists should be hanging over the edge.","Start out by curling your wrist upwards and exhaling.","Slowly lower your wrists back down to the starting position while inhaling. Make sure to inhale during this part of the exercise.","Your forearms should be stationary as your wrist is the only movement needed to perform this exercise.","Repeat for the recommended amount of repetitions."],"sh":7,"p":17,"fo":"pull","pt":"Rosca de punho com halteres no banco"},{"id":"Plie_Dumbbell_Squat","n":"Plie Dumbbell Squat","eq":"dumbbell","lv":"beginner","pm":["quadriceps"],"sm":["abdominals","calves","glutes","hamstrings"],"mc":"compound","ins":["Hold a dumbbell at the base with both hands and stand straight up. Move your legs so that they are wider than shoulder width apart from each other with your knees slightly bent.","Your toes should be facing out. Note: Your arms should be stationary while performing the exercise. This is the starting position.","Slowly bend the knees and lower your legs until your thighs are parallel to the floor. Make sure to inhale as this is the eccentric part of the exercise.","Press mainly with the heel of the foot to bring the body back to the starting position while exhaling.","Repeat for the recommended amount of repetitions."],"sh":7,"p":18,"fo":"push","pt":"Agachamento sumô com halter"},{"id":"Seated_Dumbbell_Palms-Down_Wrist_Curl","n":"Seated Dumbbell Palms-Down Wrist Curl","eq":"dumbbell","lv":"beginner","pm":["forearms"],"sm":[],"mc":"isolation","ins":["Start out by placing two dumbbells on the floor in front of a flat bench.","Sit down on the edge of the flat bench with your legs at about shoulder width apart. Make sure to keep your feet on the floor.","Use your arms to grab both of the dumbbells and bring them up so that your forearms are resting against your thighs with the palms of the hands facing down. Your wrists should be hanging over the edge of your thighs.","Start out by curling your wrist upwards and exhaling.","Slowly lower your wrists back down to the starting position while inhaling. Make sure to inhale during this part of the exercise. Tip: Your forearms should be stationary as your wrist is the only movement needed to perform this exercise.","Repeat for the recommended amount of repetitions.","When finished, simply lower the dumbbells to the floor."],"sh":7,"p":19,"fo":"pull","pt":"Rosca de punho inversa sentado com halteres"},{"id":"Seated_Dumbbell_Palms-Up_Wrist_Curl","n":"Seated Dumbbell Palms-Up Wrist Curl","eq":"dumbbell","lv":"beginner","pm":["forearms"],"sm":[],"mc":"isolation","ins":["Start out by placing two dumbbells on the floor in front of a flat bench.","Sit down on the edge of the flat bench with your legs at about shoulder width apart. Make sure to keep your feet on the floor.","Use your arms to grab both of the dumbbells and bring them up so that your forearms are resting against your thighs with the palms of the hands facing up. Your wrists should be hanging over the edge of your thighs.","Start out by curling your wrist upwards and exhaling.","Slowly lower your wrists back down to the starting position while inhaling. Make sure to inhale during this part of the exercise. Tip: Your forearms should be stationary as your wrist is the only movement needed to perform this exercise.","Repeat for the recommended amount of repetitions.","When finished, simply lower the dumbbells to the floor."],"sh":7,"p":20,"fo":"pull","pt":"Rosca de punho sentado com halteres"},{"id":"Seated_One-Arm_Dumbbell_Palms-Down_Wrist_Curl","n":"Seated One-Arm Dumbbell Palms-Down Wrist Curl","eq":"dumbbell","lv":"intermediate","pm":["forearms"],"sm":[],"mc":"isolation","ins":["Sit on a flat bench with a dumbbell in your right hand.","Place your feet flat on the floor, at a distance that is slightly wider than shoulder width apart.","Lean forward and place your right forearm on top of your upper right thigh with your palm down. Tip: Make sure that the back of the wrist lies on top of your knees. This will be your starting position.","Lower the dumbbell as far as possible as you keep a tight grip on the dumbbell. Inhale as you perform this movement.","Now curl the dumbbell as high as possible as you contract the forearms and as you exhale. Keep the contraction for a second before you lower again. Tip: The only movement should happen at the wrist.","Perform for the recommended amount of repetitions, switch arms and repeat the movement."],"sh":7,"p":21,"fo":"pull","pt":"Rosca de punho inversa unilateral sentado"},{"id":"Spell_Caster","n":"Spell Caster","eq":"dumbbell","lv":"beginner","pm":["abdominals"],"sm":["glutes","shoulders"],"mc":"compound","ins":["Hold a dumbbell in each hand with a pronated grip. Your feet should be wide with your hips and knees extended. This will be your starting position.","Begin the movement by pulling both of the dumbbells to one side next to your hip, rotating your torso.","Keeping your arms straight and the dumbbells parallel to the ground, rotate your torso to swing the weights to your opposite side.","Continue alternating, rotating from one side to the other until the set is complete."],"sh":7,"p":22,"fo":"pull","pt":"Spell caster (movimento diagonal com halteres)"},{"id":"Split_Squat_with_Dumbbells","n":"Split Squat with Dumbbells","eq":"dumbbell","lv":"beginner","pm":["quadriceps"],"sm":["glutes","hamstrings"],"mc":"compound","ins":["Position yourself into a staggered stance with the rear foot elevated and front foot forward.","Hold a dumbbell in each hand, letting them hang at the sides. This will be your starting position.","Begin by descending, flexing your knee and hip to lower your body down. Maintain good posture througout the movement. Keep the front knee in line with the foot as you perform the exercise.","At the bottom of the movement, drive through the heel to extend the knee and hip to return to the starting position."],"sh":7,"p":23,"fo":"push","pt":"Agachamento búlgaro com halteres"},{"id":"Standing_Dumbbell_Calf_Raise","n":"Standing Dumbbell Calf Raise","eq":"dumbbell","lv":"intermediate","pm":["calves"],"sm":[],"mc":"isolation","ins":["Stand with your torso upright holding two dumbbells in your hands by your sides. Place the ball of the foot on a sturdy and stable wooden board (that is around 2-3 inches tall) while your heels extend off and touch the floor. This will be your starting position.","With the toes pointing either straight (to hit all parts equally), inwards (for emphasis on the outer head) or outwards (for emphasis on the inner head), raise the heels off the floor as you exhale by contracting the calves. Hold the top contraction for a second.","As you inhale, go back to the starting position by slowly lowering the heels.","Repeat for the recommended amount of times."],"sh":8,"p":0,"fo":"push","pt":"Panturrilha em pé com halteres"},{"id":"Standing_Dumbbell_Upright_Row","n":"Standing Dumbbell Upright Row","eq":"dumbbell","lv":"beginner","pm":["traps"],"sm":["biceps","shoulders"],"mc":"compound","ins":["Grasp a dumbbell in each hand with a pronated (palms forward) grip that is slightly less than shoulder width. The dumbbells should be resting on top of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight. This will be your starting position.","Use your side shoulders to lift the dumbbells as you exhale. The dumbbells should be close to the body as you move it up and the elbows should drive the motion. Continue to lift them until they nearly touch your chin. Tip: Your elbows should drive the motion. As you
