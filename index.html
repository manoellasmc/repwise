 keep your elbow pressed firmly to your side. We recommend you hold a pad or foam roll in place with your elbow to keep it firmly in position.","With your upper arm in position, your elbow should be flexed to 90 degrees with your hand reaching across the front of your torso. This will be your starting position.","Execute the movement by rotating your arm in a backhand motion, keeping your elbow in place."],"sh":1,"p":13,"fo":"pull","pt":"Rotação externa na polia"},{"id":"Face_Pull","n":"Face Pull","eq":"cable","lv":"intermediate","pm":["shoulders"],"sm":["middle back"],"mc":"compound","ins":["Facing a high pulley with a rope or dual handles attached, pull the weight directly towards your face, separating your hands as you do so. Keep your upper arms parallel to the ground."],"sh":1,"p":14,"fo":"pull","pt":"Face pull (puxada para o rosto)"},{"id":"Flat_Bench_Cable_Flyes","n":"Flat Bench Cable Flyes","eq":"cable","lv":"intermediate","pm":["chest"],"sm":[],"mc":"isolation","ins":["Position a flat bench between two low pulleys so that when you are laying on it, your chest will be lined up with the cable pulleys.","Lay flat on the bench and keep your feet on the ground.","Have someone hand you the handles on each hand. You will grab each single handle attachment with a palms up grip.","Extend your arms by your side with a slight bend on your elbows. Tip: You will keep this bend constant through the whole movement. Your arms should be parallel to the floor. This is your starting position.","Now start lifting the arms in a semi-circle motion directly in front of you by pulling the cables together until both hands meet at the top of the movement. Squeeze your chest as you perform this motion and breathe out during this movement. Also, hold the contraction for a second at the top. Tip: When performed correctly, at the top position of this movement, your arms should be perpendicular to your torso and the floor touching above your chest.","Slowly come back to the starting position.","Repeat for the recommended amount of repetitions."],"sh":1,"p":15,"fo":"push","pt":"Crucifixo na polia no banco reto"},{"id":"Front_Cable_Raise","n":"Front Cable Raise","eq":"cable","lv":"beginner","pm":["shoulders"],"sm":[],"mc":"isolation","ins":["Select the weight on a low pulley machine and grasp the single hand cable attachment that is attached to the low pulley with your left hand.","Face away from the pulley and put your arm straight down with the hand cable attachment in front of your thighs at arms' length with the palms of the hand facing your thighs. This will be your starting position.","While maintaining the torso stationary (no swinging), lift the left arm to the front with a slight bend on the elbow and the palms of the hand always faces down. Continue to go up until you arm is slightly above parallel to the floor. Exhale as you execute this portion of the movement and pause for a second at the top.","Now as you inhale lower the arm back down slowly to the starting position.","Once all of the recommended amount of repetitions have been performed for this arm, switch arms and perform the exercise with the right one."],"sh":1,"p":16,"fo":"push","pt":"Elevação frontal na polia"},{"id":"Full_Range-Of-Motion_Lat_Pulldown","n":"Full Range-Of-Motion Lat Pulldown","eq":"cable","lv":"intermediate","pm":["lats"],"sm":["biceps","middle back","shoulders"],"mc":"compound","ins":["Either standing or seated on a high bench, grasp two stirrup cables that are attached to the high pulleys. Grab with the opposing hand so your arms are crisscrossed about you and your palms are facing forward.","Keeping your chest up and maintaining a slight arch in your lower back, pull the handles down as if you were doing a regular pulldown. The range of motion will be more of an arc. During the movement, rotate your hands so that in the bottom position your palms face each other rather than forward. Return slowly to the starting position and repeat."],"sh":1,"p":17,"fo":"pull","pt":"Puxada frontal com amplitude total"},{"id":"Hack_Squat","n":"Hack Squat","eq":"machine","lv":"beginner","pm":["quadriceps"],"sm":["calves","glutes","hamstrings"],"mc":"compound","ins":["Place the back of your torso against the back pad of the machine and hook your shoulders under the shoulder pads provided.","Position your legs in the platform using a shoulder width medium stance with the toes slightly pointed out. Tip: Keep your head up at all times and also maintain the back on the pad at all times.","Place your arms on the side handles of the machine and disengage the safety bars (which on most designs is done by moving the side handles from a facing front position to a diagonal position).","Now straighten your legs without locking the knees. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).","Begin to slowly lower the unit by bending the knees as you maintain a straight posture with the head up (back on the pad at all times). Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the unit as you exhale by pushing the floor with mainly with the heel of your foot as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."],"sh":1,"p":18,"fo":"push","pt":"Agachamento hack"},{"id":"High_Cable_Curls","n":"High Cable Curls","eq":"cable","lv":"intermediate","pm":["biceps"],"sm":[],"mc":"compound","ins":["Stand between a couple of high pulleys and grab a handle in each arm. Position your upper arms in a way that they are parallel to the floor with the palms of your hands facing you. This will be your starting position.","Curl the handles towards you until they are next to your ears. Make sure that as you do so you flex your biceps and exhale. The upper arms should remain stationary and only the forearms should move. Hold for a second in the contracted position as you squeeze the biceps.","Slowly bring back the arms to the starting position.","Repeat for the recommended amount of repetitions."],"sh":1,"p":19,"fo":"pull","pt":"Rosca na polia alta"},{"id":"Incline_Cable_Chest_Press","n":"Incline Cable Chest Press","eq":"cable","lv":"beginner","pm":["chest"],"sm":["shoulders","triceps"],"mc":"compound","ins":["Adjust the weight to an appropriate amount and be seated, grasping the handles. Your upper arms should be about 45 degrees to the body, with your head and chest up. The elbows should be bent to about 90 degrees. This will be your starting position.","Begin by extending through the elbow, pressing the handles together straight in front of you. Keep your shoulder blades retracted as you execute the movement.","After pausing at full extension, return to the starting position, keeping tension on the cables."],"sh":1,"p":20,"fo":"push","pt":"Supino inclinado na polia"},{"id":"Incline_Cable_Flye","n":"Incline Cable Flye","eq":"cable","lv":"intermediate","pm":["chest"],"sm":["shoulders"],"mc":"isolation","ins":["To get yourself into the starting position, set the pulleys at the floor level (lowest level possible on the machine that is below your torso).","Place an incline bench (set at 45 degrees) in between the pulleys, select a weight on each one and grab a pulley on each hand.","With a handle on each hand, lie on the incline bench and bring your hands together at arms length in front of your face. This will be your starting position.","With a slight bend of your elbows (in order to prevent stress at the biceps tendon), lower your arms out at both sides in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms should remain stationary. The movement should only occur at the shoulder joint.","Return your arms back to the starting position as you squeeze your chest muscles and exhale. Hold the contracted position for a second. Tip: Make sure to use the same arc of motion used to lower the weights.","Repeat the movement for the prescribed amount of repetitions."],"sh":1,"p":21,"fo":"push","pt":"Crucifixo inclinado na polia"},{"id":"Kneeling_Cable_Crunch_With_Alternating_Oblique_Twists","n":"Kneeling Cable Crunch With Alternating Oblique Twists","eq":"cable","lv":"beginner","pm":["abdominals"],"sm":[],"mc":"isolation","ins":["Connect a rope attachment to a high pulley cable and position a mat on the floor in front of it.","Grab the rope with both hands and kneel approximately two feet back from the tower.","Position the rope behind your head with your hands by your ears.","Keep your hands in the same place, contract your abs and pull downward on the rope in a crunching movement until your elbows reach your knees.","Pause briefly at the bottom and rise up in a slow and controlled manner until you reach the starting position.","Repeat the same downward movement until you're halfway down, at which time you'll begin rotating one of your elbows to the opposite knee.","Again, pause briefly at the bottom and rise up in a slow and controlled manner until you reach the starting position.","Repeat the same movement as before, but alternate the other elbow to the opposite knee.","Continue this series of movements to failure."],"sh":1,"p":22,"fo":"pull","pt":"Abdominal ajoelhado na polia com rotação alternada"},{"id":"Kneeling_Cable_Triceps_Extension","n":"Kneeling Cable Triceps Extension","eq":"cable","lv":"intermediate","pm":["triceps"],"sm":[],"mc":"isolation","ins":["Place a bench sideways in front of a high pulley machine.","Hold a straight bar attachment above your head with your hands about 6 inches apart with your palms facing down.","Face away from the machine and kneel.","Place your head and the back of your upper arms on the bench. Your elbows should be bent with the forearms pointing towards the high pulley. This will be your starting position.","While keeping your upper arms close to your head at all times with the elbows in, press the bar out in a semicircular motion until the elbows are locked and your arms are parallel to the floor. Contract the triceps hard and keep this position for a second. Exhale as you perform this movement.","Slowly return to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."],"sh":1,"p":23,"fo":"push","pt":"Extensão de tríceps ajoelhado na polia"},{"id":"Kneeling_High_Pulley_Row","n":"Kneeling High Pulley Row","eq":"cable","lv":"beginner","pm":["lats"],"sm":["biceps","middle back"],"mc":"compound","ins":["Select the appropriate weight using a pulley that is above your head. Attach a rope to the cable and kneel a couple of feet away, holding the rope out in front of you with both arms extended. This will be your starting position.","Initiate the movement by flexing the elbows and fully retracting your shoulders, pulling the rope toward your upper chest with your elbows out.","After pausing briefly, slowly return to the starting position."],"sh":2,"p":0,"fo":"pull","pt":"Remada ajoelhado na polia alta"},{"id":"Kneeling_Single-Arm_High_Pulley_Row","n":"Kneeling Single-Arm High Pulley Row","eq":"cable","lv":"beginner","pm":["lats"],"sm":["biceps","middle back"],"mc":"compound","ins":["Attach a single handle to a high pulley and make your weight selection.","Kneel in front of the cable tower, taking the cable with one hand with your arm extended. This will be your starting position.","Starting with your palm facing forward, pull the weight down to your torso by flexing the elbow and retract the shoulder blade. As you do so, rotate the wrist so that at the completion of the movement, your palm is now facing you.","After a brief pause, return to the starting position."],"sh":2,"p":1,"fo":"pull","pt":"Remada unilateral ajoelhado na polia alta"},{"id":"Leg_Extensions","n":"Leg Extensions","eq":"machine","lv":"beginner","pm":["quadriceps"],"sm":[],"mc":"isolation","ins":["For this exercise you will need to use a leg extension machine. First choose your weight and sit on the machine with your legs under the pad (feet pointed forward) and the hands holding the side bars. This will be your starting position. Tip: You will need to adjust the pad so that it falls on top of your lower leg (just above your feet). Also, make sure that your legs form a 90-degree angle between the lower and upper leg. If the angle is less than 90-degrees then that means the knee is over the toes which in turn creates undue stress at the knee joint. If the machine is designed that way, either look for another machine or just make sure that when you start executing the exercise you stop going down once you hit the 90-degree angle.","Using your quadriceps, extend your legs to the maximum as you exhale. Ensure that the rest of the body remains stationary on the seat. Pause a second on the contracted position.","Slowly lower the weight back to the original position as you inhale, ensuring that you do not go past the 90-degree angle limit.","Repeat for the recommended amount of times."],"sh":2,"p":2,"fo":"push","pt":"Cadeira extensora"},{"id":"Leg_Press","n":"Leg Press","eq":"machine","lv":"beginner","pm":["quadriceps"],"sm":["calves","glutes","hamstrings"],"mc":"compound","ins":["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a medium (shoulder width) foot stance. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).","Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you. Tip: Make sure that you do not lock your knees. Your torso and the legs should make a perfect 90-degree angle. This will be your starting position.","As you inhale, slowly lower the platform until your upper and lower legs make a 90-degree angle.","Pushing mainly with the heels of your feet and using the quadriceps go back to the starting position as you exhale.","Repeat for the recommended amount of repetitions and ensure to lock the safety pins properly once you are done. You do not want that platform falling on you fully loaded."],"sh":2,"p":3,"fo":"push","pt":"Leg press"},{"id":"Leverage_Chest_Press","n":"Leverage Chest Press","eq":"machine","lv":"beginner","pm":["chest"],"sm":["shoulders","triceps"],"mc":"compound","ins":["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the bottom or middle of the pectorals at the beginning of the motion.","Your chest and head should be up and your shoulder blades retracted. This will be your starting position.","Press the handles forward by extending through the elbow.","After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."],"sh":2,"p":4,"fo":"push","pt":"Supino articulado na máquina"},{"id":"Leverage_Deadlift","n":"Leverage Deadlift","eq":"machine","lv":"beginner","pm":["quadriceps"],"sm":["glutes","hamstrings"],"mc":"compound","ins":["Load the pins to an appropriate weight. Position yourself directly between the handles. Grasp the bottom handles with a comfortable grip, and then lower your hips as you take a breath. Look forward with your head and keep your chest up. This will be your starting position.","Return the weight to the starting position."],"sh":2,"p":5,"fo":"pull","pt":"Levantamento terra na máquina articulada"},{"id":"Leverage_Decline_Chest_Press","n":"Leverage Decline Chest Press","eq":"machine","lv":"beginner","pm":["chest"],"sm":["shoulders","triceps"],"mc":"compound","ins":["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the bottom of the pectorals at the beginning of the motion. Your chest and head should be up and your shoulder blades retracted. This will be your starting position.","Press the handles forward by extending through the elbow.","After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."],"sh":2,"p":6,"fo":"push","pt":"Supino declinado articulado na máquina"},{"id":"Leverage_High_Row","n":"Leverage High Row","eq":"machine","lv":"beginner","pm":["middle back"],"sm":["lats"],"mc":"compound","ins":["Load an appropriate weight onto the pins and adjust the seat height so that you can just reach the handles above you. Adjust the knee pad to help keep you down. Grasp the handles with a pronated grip. This will be your starting position.","Pull the handles towards your torso, retracting your shoulder blades as you flex the elbow.","Pause at the bottom of the motion, and then slowly return the handles to the starting position.","For multiple repetitions, avoid completely returning the weight to the stops to keep tension on the muscles being worked."],"sh":2,"p":7,"fo":"pull","pt":"Remada alta articulada na máquina"},{"id":"Leverage_Incline_Chest_Press","n":"Leverage Incline Chest Press","eq":"machine","lv":"beginner","pm":["chest"],"sm":["shoulders","triceps"],"mc":"compound","ins":["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the top of the pectorals at the beginning of the motion. Your chest and head should be up and your shoulder blades retracted. This will be your starting position.","Press the handles forward by extending through the elbow.","After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."],"sh":2,"p":8,"fo":"push","pt":"Supino inclinado articulado na máquina"},{"id":"Leverage_Iso_Row","n":"Leverage Iso Row","eq":"machine","lv":"beginner","pm":["lats"],"sm":["biceps","middle back"],"mc":"compound","ins":["Load an appropriate weight onto the pins and adjust the seat height so that the handles are at chest level. Grasp the handles with either a neutral or pronated grip. This will be your starting position.","Pull the handles towards your torso, retracting your shoulder blades as you flex the elbow.","Pause at the bottom of the motion, and then slowly return the handles to the starting position. For multiple repetitions, avoid completely returning the weight to the stops to keep tension on the muscles being worked."],"sh":2,"p":9,"fo":"pull","pt":"Remada articulada unilateral na máquina"},{"id":"Leverage_Shoulder_Press","n":"Leverage Shoulder Press","eq":"machine","lv":"beginner","pm":["shoulders"],"sm":["triceps"],"mc":"compound","ins":["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the top of the shoulders at the beginning of the motion. Your chest and head should be up and handles held with a pronated grip. This will be your starting position.","Press the handles upward by extending through the elbow.","After a brief pause at the top, return the weight to just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."],"sh":2,"p":10,"fo":"push","pt":"Desenvolvimento articulado na máquina"},{"id":"Leverage_Shrug","n":"Leverage Shrug","eq":"machine","lv":"beginner","pm":["traps"],"sm":["forearms"],"mc":"isolation","ins":["Load the pins to an appropriate weight. Position yourself directly between the handles.","Grasp the top handles with a comfortable grip, and then lower your hips as you take a breath. Look forward with your head and keep your chest up.","Drive through the floor with your heels, extending your hips and knees as you rise to a standing position. Keep your arms straight throughout the movement, finishing with your shoulders back. This will be your starting position.","Raise the weight by shrugging the shoulders towards your ears, moving straight up and down.","Pause at the top of the motion, and then return the weight to the starting position."],"sh":2,"p":11,"fo":"pull","pt":"Encolhimento na máquina articulada"},{"id":"Low_Cable_Crossover","n":"Low Cable Crossover","eq":"cable","lv":"beginner","pm":["chest"],"sm":["shoulders"],"mc":"isolation","ins":["To move into the starting position, place the pulleys at the low position, select the resistance to be used and grasp a handle in each hand.","Step forward, gaining tension in the pulleys. Your palms should be facing forward, hands below the waist, and your arms straight. This will be your starting position.","With a slight bend in your arms, draw your hands upward and toward the midline of your body. Your hands should come together in front of your chest, palms facing up.","Return your arms back to the starting position after a brief pause."],"sh":2,"p":12,"fo":"push","pt":"Crossover na polia baixa"},{"id":"Low_Cable_Triceps_Extension","n":"Low Cable Triceps Extension","eq":"cable","lv":"beginner","pm":["triceps"],"sm":[],"mc":"isolation","ins":["Select the desired weight and lay down face up on the bench of a seated row machine that has a rope attached to it. Your head should be pointing towards the attachment.","Grab the outside of the rope ends with your palms facing each other (neutral grip).","Position your elbows so that they are bent at a 90 degree angle and your upper arms are perpendicular (90 degree angle) to your torso. Tip: Keep the elbows in and make sure that the upper arms point to the ceiling while your forearms point towards the pulley above your head. This will be your starting position.","As you breathe out, extend your lower arms until they are straight and vertical. The upper arms and elbows remain stationary throughout the movement. Only the forearms should move. Contract the triceps hard for a second.","As you breathe in slowly return to the starting position.","Repeat for the recommended amount of repetitions."],"sh":2,"p":13,"fo":"push","pt":"Extensão de tríceps na polia baixa"},{"id":"Low_Pulley_Row_To_Neck","n":"Low Pulley Row To Neck","eq":"cable","lv":"beginner","pm":["shoulders"],"sm":["biceps","middle back","traps"],"mc":"compound","ins":["Sit on a low pulley row machine with a rope attachment.","Grab the ends of the rope using a palms-down grip and sit with your back straight and your knees slightly bent. Tip: Keep your back almost completely vertical and your arms fully extended in front of you. This will be your starting position.","While keeping your torso stationary, lift your elbows and start bending them as you pull the rope towards your neck while exhaling. Throughout the movement your upper arms should remain parallel to the floor. Tip: Continue this motion until your hands are almost next to your ears (the forearms will not be parallel to the floor at the end of the movement as they will be angled a bit upwards) and your elbows are out away from your sides.","After holding for a second or so at the contracted position, come back slowly to the starting position as you inhale. Tip: Again, during no part of the movement should the torso move.","Repeat for the recommended amount of repetitions."],"sh":2,"p":14,"fo":"pull","pt":"Remada na polia baixa até o pescoço"},{"id":"Lunge_Sprint","n":"Lunge Sprint","eq":"machine","lv":"intermediate","pm":["quadriceps"],"sm":["calves","glutes","hamstrings"],"mc":"compound","ins":["Adjust a bar in a Smith machine to an appropriate height. Position yourself under the bar, racking it across the back of your shoulders. Unrack the bar, and then split your feet, moving one foot forward and one foot back. This will be your starting position.","Lower your back knee nearly to the ground, flexing the knees and lowering your hips as you do so.","At the bottom of the descent, immediately reverse direction. Explosively drive through the heel of your front foot with light pressure from your back foot. Jump up and reverse the position of your legs.","Repeat for the recommended amount of repetitions."],"sh":2,"p":15,"fo":"push","pt":"Avanço com corrida (sprint)"},{"id":"Lying_Cable_Curl","n":"Lying Cable Curl","eq":"cable","lv":"intermediate","pm":["biceps"],"sm":[],"mc":"isolation","ins":["Grab a straight bar or E-Z bar attachment that is attached to the low pulley with both hands, using an underhand (palms facing up) shoulder-width grip.","Lie flat on your back on top of an exercise mat in front of the weight stack with your feet flat against the frame of the pulley machine and your legs straight.","With your arms extended and your elbows close to your body slightly bend your arms. This will be your starting position.","While keeping your upper arms stationary and the elbows close to your body, curl the bar up slowly toward your chest as you breathe out and you squeeze the biceps.","After a second squeeze at the top of the movement, slowly return to the starting position.","Repeat for the recommended amount of repetitions."],"sh":2,"p":16,"fo":"pull","pt":"Rosca na polia deitado"},{"id":"Lying_Close-Grip_Bar_Curl_On_High_Pulley","n":"Lying Close-Grip Bar Curl On High Pulley","eq":"cable","lv":"beginner","pm":["biceps"],"sm":[],"mc":"isolation","ins":["Place a flat bench in front of a high pulley or lat pulldown machine.","Hold the straight bar attachment using an underhand grip (palms up) that is about shoulder width.","Lie on your back with your head over the end of the bench.","Now extend your arms straight above your shoulders. Your torso and your arms should make a 90-degree angle and the elbows should be in. This will be your starting position.","As you breathe out, curl the bar down in a semicircular motion until it touches your chin. Squeeze the biceps for a second at the top contracted position. Tip: As you execute this motion only the forearms should move. At no time should the upper arms be moving at all. They are to remain perpendicular throughout the movement.","Return to starting position slowly.","Repeat for the recommended amount of repetitions."],"sh":2,"p":17,"fo":"pull","pt":"Rosca deitado com barra na polia alta"},{"id":"Lying_Leg_Curls","n":"Lying Leg Curls","eq":"machine","lv":"beginner","pm":["hamstrings"],"sm":[],"mc":"isolation","ins":["Adjust the machine lever to fit your height and lie face down on the leg curl machine with the pad of the lever on the back of your legs (just a few inches under the calves). Tip: Preferably use a leg curl machine that is angled as opposed to flat since an angled position is more favorable for hamstrings recruitment.","Keeping the torso flat on the bench, ensure your legs are fully stretched and grab the side handles of the machine. Position your toes straight (or you can also use any of the other two stances described on the foot positioning section). This will be your starting position.","As you exhale, curl your legs up as far as possible without lifting the upper legs from the pad. Once you hit the fully contracted position, hold it for a second.","As you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions."],"sh":2,"p":18,"fo":"pull","pt":"Mesa flexora"},{"id":"Lying_Machine_Squat","n":"Lying Machine Squat","eq":"machine","lv":"intermediate","pm":["quadriceps"],"sm":["calves","glutes","hamstrings"],"mc":"compound","ins":["Adjust the leg machine to a height that will allow you to get inside it with your knees bent and the thighs slightly below parallel.","Once you select the weight, position yourself inside the machine face up with the knees bent and thighs slightly below parallel to the platform. Make sure that the knees do not go past the toes. The angle created between the hamstrings and the calves should be one that is slightly less than 90 degrees (since your starting position requires you to start slightly below parallel). Your back and your head should be resting on the machine while your shoulders are pressed under the shoulder pads.","Place your hands by the handles and position your feet slightly pointing out at a shoulder width position. This will be your starting position.","While pressing with the balls of the feet as you breathe out, make your whole body erect as you squeeze the quads. Hold the contracted position for a second. Tip: Since you are starting below parallel, you can opt to use your hands to help you up by pressing on your thighs only on the first repetition.","Slowly squat down as you inhale but instead of going all the way down to the starting position, just stop once your thighs are parallel to the platform. The angle between your hamstrings and calves should be a 90-degree angle.","Repeat for the recommended amount of repetitions."],"sh":2,"p":19,"fo":"push","pt":"Agachamento deitado na máquina"},{"id":"Lying_T-Bar_Row","n":"Lying T-Bar Row","eq":"machine","lv":"intermediate","pm":["middle back"],"sm":["biceps","lats"],"mc":"compound","ins":["Load up the T-bar Row Machine with the desired weight and adjust the leg height so that your upper chest is at the top of the pad. Tip: In some machines all you can do is stand on the appropriate step that allows you to be at a height that has the upper chest at the top of the pad.","Lay face down on the pad and grab the handles. You can either use a palms down, palms up, or palms in position depending on what part of your back you want to emphasize.","Lift the bar off the rack and extend your arms in front of you. This will be your starting position.","As you exhale slowly pull the weight up and squeeze your back at the top of the movement. Tip: Keep the upper arms as close to the torso as possible throughout the movement in order to better engage the back muscles. Also, do not lift your body off of the pad at any time and refrain from using the biceps to lift the weight.","After a second contraction at the top of the movement, as you inhale, slowly go back down to the starting position.","Repeat for the recommended amount of repetitions."],"sh":2,"p":20,"fo":"pull","pt":"Remada cavalinho deitado"},{"id":"Machine_Bench_Press","n":"Machine Bench Press","eq":"machine","lv":"beginner","pm":["chest"],"sm":["shoulders","triceps"],"mc":"compound","ins":["Sit down on the Chest Press Machine and select the weight.","Step on the lever provided by the machine since it will help you to bring the handles forward so that you can grab the handles and fully extend the arms.","Grab the handles with a palms-down grip and lift your elbows so that your upper arms are parallel to the floor to the sides of your torso. Tip: Your forearms will be pointing forward since you are grabbing the handles. Once you bring the handles forward and extend the arms you will be at the starting position.","Now bring the handles back towards you as you breathe in.","Push the handles away from you as you flex your pecs and you breathe out. Hold the contraction for a second before going back to the starting position.","Repeat for the recommended amount of reps.","When finished step on the lever again and slowly get the handles back to their original place."],"sh":2,"p":21,"fo":"push","pt":"Supino na máquina"},{"id":"Machine_Bicep_Curl","n":"Machine Bicep Curl","eq":"machine","lv":"beginner","pm":["biceps"],"sm":[],"mc":"isolation","ins":["Adjust the seat to the appropriate height and make your weight selection. Place your upper arms against the pads and grasp the handles. This will be your starting position.","Perform the movement by flexing the elbow, pulling your lower arm towards your upper arm.","Pause at the top of the movement, and then slowly return the weight to the starting position.","Avoid returning the weight all the way to the stops until the set is complete to keep tension on the muscles being worked."],"sh":2,"p":22,"fo":"pull","pt":"Rosca bíceps na máquina"},{"id":"Machine_Preacher_Curls","n":"Machine Preacher Curls","eq":"machine","lv":"beginner","pm":["biceps"],"sm":[],"mc":"isolation","ins":["Sit down on the Preacher Curl Machine and select the weight.","Place the back of your upper arms (your triceps) on the preacher pad provided and grab the handles using an underhand grip (palms facing up). Tip: Make sure that when you place the arms on the pad you keep the elbows in. This will be your starting position.","Now lift the handles as you exhale and you contract the biceps. At the top of the position make sure that you hold the contraction for a second. Tip: Only the forearms should move. The upper arms should remain stationary and on the pad at all times.","Lower the handles slowly back to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"sh":2,"p":23,"fo":"pull","pt":"Rosca Scott na máquina"},{"id":"Machine_Shoulder_Military_Press","n":"Machine Shoulder (Military) Press","eq":"machine","lv":"beginner","pm":["shoulders"],"sm":["triceps"],"mc":"compound","ins":["Sit down on the Shoulder Press Machine and select the weight.","Grab the handles to your sides as you keep the elbows bent and in line with your torso. This will be your starting position.","Now lift the handles as you exhale and you extend the arms fully. At the top of the position make sure that you hold the contraction for a second.","Lower the handles slowly back to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"sh":3,"p":0,"fo":"push","pt":"Desenvolvimento militar na máquina"},{"id":"Machine_Triceps_Extension","n":"Machine Triceps Extension","eq":"machine","lv":"beginner","pm":["triceps"],"sm":[],"mc":"isolation","ins":["Adjust the seat to the appropriate height and make your weight selection. Place your upper arms against the pads and grasp the handles. This will be your starting position.","Perform the movement by extending the elbow, pulling your lower arm away from your upper arm.","Pause at the completion of the movement, and then slowly return the weight to the starting position.","Avoid returning the weight all the way to the stops until the set is complete to keep tension on the muscles being worked."],"sh":3,"p":1,"fo":"push","pt":"Extensão de tríceps na máquina"},{"id":"Narrow_Stance_Hack_Squats","n":"Narrow Stance Hack Squats","eq":"machine","lv":"intermediate","pm":["quadriceps"],"sm":["calves","glutes","hamstrings"],"mc":"compound","ins":["Place the back of your torso against the back pad of the machine and hook your shoulders under the shoulder pads provided.","Position your legs in the platform using a less than shoulder width narrow stance with the toes slightly pointed out. Your feet should be around 3 inches or less apart. Tip: Keep your head up at all times and also maintain the back on the pad at all times.","Place your arms on the side handles of the machine and disengage the safety bars (which on most designs is done by moving the side handles from a facing front position to a diagonal position).","Now straighten your legs without locking the knees. This will be your starting position.","Begin to slowly lower the unit by bending the knees as you maintain a straight posture with the head up (back on the pad at all times). Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement.","Begin to raise the unit as you exhale by pushing the floor with mainly with the heels of your feet as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."],"sh":3,"p":2,"fo":"push","pt":"Agachamento hack com base estreita"},{"id":"Narrow_Stance_Leg_Press","n":"Narrow Stance Leg Press","eq":"machine","lv":"intermediate","pm":["quadriceps"],"sm":["calves","glutes","hamstrings"],"mc":"compound","ins":["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a less-than-shoulder-width narrow stance with the toes slightly pointed out. Your feet should be around 3 inches or less apart. Tip: Keep your head up at all times and also maintain the back on the pad at all times.","Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you. Tip: Make sure that you do not lock your knees. Your torso and the legs should make a perfect 90-degree angle. This will be your starting position.","As you inhale, slowly lower the platform until your upper and lower legs make a 90-degree angle.","Pushing mainly with the heels of your feet and using the quadriceps go back to the starting position as you exhale.","Repeat for the recommended amount of repetitions and ensure to lock the safety pins properly once you are done. You do not want that platform falling on you fully loaded."],"sh":3,"p":3,"fo":"push","pt":"Leg press com base estreita"},{"id":"One-Arm_High-Pulley_Cable_Side_Bends","n":"One-Arm High-Pulley Cable Side Bends","eq":"cable","lv":"beginner","pm":["abdominals"],"sm":[],"mc":"isolation","ins":["Connect a standard handle to a tower. Move cable to highest pulley position.","Stand with side to cable. With one hand, reach up and grab handle with underhand grip.","Pull down cable until elbow touches your side and the handle is by your shoulder.","Position feet hip-width apart. Place free hand on hip to help gauge pivot point.","Keep arm in static position. Contract oblique to bring the weight down in a side crunch.","Once you reach maximum contraction, slowly release the weight to the starting position. The weight stack should never be unloaded in a resting position. The aim is constant tension during the set.","Repeat to failure.","Then, reposition and repeat the same series of movements on the opposite side."],"sh":3,"p":4,"fo":"pull","pt":"Inclinação lateral unilateral na polia alta"},{"id":"One-Legged_Cable_Kickback","n":"One-Legged Cable Kickback","eq":"cable","lv":"intermediate","pm":["glutes"],"sm":["hamstrings"],"mc":"isolation","ins":["Hook a leather ankle cuff to a low cable pulley and then attach the cuff to your ankle.","Face the weight stack from a distance of about two feet, grasping the steel frame for support.","While keeping your knees and hips bent slightly and your abs tight, contract your glutes to slowly \"kick\" the working leg back in a semicircular arc as high as it will comfortably go as you breathe out. Tip: At full extension, squeeze your glutes for a second in order to achieve a peak contraction.","Now slowly bring your working leg forward, resisting the pull of the cable until you reach the starting position.","Repeat for the recommended amount of repetitions.","Switch legs and repeat the movement for the other side."],"sh":3,"p":5,"fo":"push","pt":"Coice unilateral na polia"},{"id":"One_Arm_Lat_Pulldown","n":"One Arm Lat Pulldown","eq":"cable","lv":"beginner","pm":["lats"],"sm":["biceps","middle back"],"mc":"compound","ins":["Select an appropriate weight and adjust the knee pad to help keep you down. Grasp the handle with a pronated grip. This will be your starting position.","Pull the handle down, squeezing your elbow to your side as you flex the elbow.","Pause at the bottom of the motion, and then slowly return the handle to the starting position.","For multiple repetitions, avoid completely returning the weight to keep tension on the muscles being worked."],"sh":3,"p":6,"fo":"pull","pt":"Puxada unilateral na polia"},{"id":"Overhead_Cable_Curl","n":"Overhead Cable Curl","eq":"cable","lv":"intermediate","pm":["biceps"],"sm":[],"mc":"isolation","ins":["To begin, set a weight that is comfortable on each side of the pulley machine. Note: Make sure that the amount of weight selected is the same on each side.","Now adjust the height of the pulleys on each side and make sure that they are positioned at a height higher than that of your shoulders.","Stand in the middle of both sides and use an underhand grip (palms facing towards the ceiling) to grab each handle. Your arms should be fully extended and parallel to the floor with your feet positioned shoulder width apart from each other. Your body should be evenly aligned the handles. This is the starting position.","While exhaling, slowly squeeze the biceps on each side until your forearms and biceps touch.","While inhaling, move your forearms back to the starting position. Note: Your entire body is stationary during this exercise except for the forearms.","Repeat for the recommended amount of repetitions prescribed in your program."],"sh":3,"p":7,"fo":"pull","pt":"Rosca na polia acima da cabeça"},{"id":"Pallof_Press","n":"Pallof Press","eq":"cable","lv":"beginner","pm":["abdominals"],"sm":["chest","shoulders","triceps"],"mc":"isolation","ins":["Connect a standard handle to a tower, and—if possible—position the cable to shoulder height. If not, a low pulley will suffice.","With your side to the cable, grab the handle with both hands and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable.","With your feet positioned hip-width apart and knees slightly bent, hold the cable to the middle of your chest. This will be your starting position.","Press the cable away from your chest, fully extending both arms. You core should be tight and engaged.","Hold the repetition for several seconds before returning to the starting position.","At the conclusion of the set, repeat facing the other direction."],"sh":3,"p":8,"fo":"pull","pt":"Pallof press (anti-rotação)"},{"id":"Pallof_Press_With_Rotation","n":"Pallof Press With Rotation","eq":"cable","lv":"beginner","pm":["abdominals"],"sm":["chest","shoulders","triceps"],"mc":"compound","ins":["Connect a standard handle to a tower, and position the cable to shoulder height.","With your side to the cable, grab the handle with one hand and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable. Align outstretched arm with cable.","With your feet positioned hip-width apart, pull the cable into your chest and grab the handle with your other hand. Both hands should be on the handle at this time.","Facing forward, press the cable away from your chest. You core should be tight and engaged.","Keeping your hips straight, twist your torso away from the pulley until you get a full quarter rotation.","Maintain your rigid stance and straight arms. Return to the neutral position in a slow and controlled manner. Your arms should be extended in front of you.","With the side tension still engaging your core, bring your hands to your chest and immediately press outward to a fully extended position. This constitutes one rep.","Repeat to failure.","Then, reposition and repeat the same series of movements on the opposite side."],"sh":3,"p":9,"fo":"pull","pt":"Pallof press com rotação"},{"id":"Pull_Through","n":"Pull Through","eq":"cable","lv":"beginner","pm":["glutes"],"sm":["hamstrings","lower back"],"mc":"compound","ins":["Begin standing a few feet in front of a low pulley with a rope or handle attached. Face away from the machine, straddling the cable, with your feet set wide apart.","Begin the movement by reaching through your legs as far as possible, bending at the hips. Keep your knees slightly bent. Keeping your arms straight, extend through the hip to stand straight up. Avoid pulling upward through the shoulders; all of the motion should originate through the hips."],"sh":3,"p":10,"fo":"pull","pt":"Pull through na polia"},{"id":"Reverse_Cable_Curl","n":"Reverse Cable Curl","eq":"cable","lv":"beginner","pm":["biceps"],"sm":["forearms"],"mc":"isolation","ins":["Stand up with your torso upright while holding a bar attachment that is attached to a low pulley using a pronated (palms down) and shoulder width grip. Make sure also that you keep the elbows close to the torso. This will be your starting position.","While holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"sh":3,"p":11,"fo":"pull","pt":"Rosca inversa na polia"},{"id":"Reverse_Grip_Triceps_Pushdown","n":"Reverse Grip Triceps Pushdown","eq":"cable","lv":"beginner","pm":["triceps"],"sm":[],"mc":"isolation","ins":["Start by setting a bar attachment (straight or e-z) on a high pulley machine.","Facing the bar attachment, grab it with the palms facing up (supinated grip) at shoulder width. Lower the bar by using your lats until your arms are fully extended by your sides. Tip: Elbows should be in by your sides and your feet should be shoulder width apart from each other. This is the starting position.","Slowly elevate the bar attachment up as you inhale so it is aligned with your chest. Only the forearms should move and the elbows/upper arms should be stationary by your side at all times.","Then begin to lower the cable bar back down to the original staring position while exhaling and contracting the triceps hard.","Repeat for the recommended amount of repetitions."],"sh":3,"p":12,"fo":"push","pt":"Tríceps na polia com pegada invertida"},{"id":"Reverse_Hyperextension","n":"Reverse Hyperextension","eq":"machine","lv":"intermediate","pm":["hamstrings"],"sm":["calves","glutes"],"mc":null,"ins":["Place your feet between the pads after loading an appropriate weight. Lay on the top pad, allowing your hips to hang off the back, while grasping the handles to hold your position.","To begin the movement, flex the hips, pulling the legs forward.","Reverse the motion by extending the hips, kicking the leg back. It is very important not to over-extend the hip on this movement, stopping short of your full range of motion.","Return by again flexing the hip, pulling the carriage forward as far as you can.","Repeat for the desired number of repetitions."],"sh":3,"p":13,"fo":"pull","pt":"Extensão lombar inversa"},{"id":"Reverse_Machine_Flyes","n":"Reverse Machine Flyes","eq":"machine","lv":"beginner","pm":["shoulders"],"sm":[],"mc":"isolation","ins":["Adjust the handles so that they are fully to the rear. Make an appropriate weight selection and adjust the seat height so the handles are at shoulder level. Grasp the handles with your hands facing inwards. This will be your starting position.","In a semicircular motion, pull your hands out to your side and back, contracting your rear delts.","Keep your arms slightly bent throughout the movement, with all of the motion occurring at the shoulder joint.","Pause at the rear of the movement, and slowly return the weight to the starting position."],"sh":3,"p":14,"fo":"pull","pt":"Crucifixo inverso na máquina"},{"id":"Rope_Crunch","n":"Rope Crunch","eq":"cable","lv":"beginner","pm":["abdominals"],"sm":[],"mc":"isolation","ins":["Kneel 1-2 feet in front of a cable system with a rope attached.","After selecting an appropriate weight, grasp the rope with both hands reaching overhead. Your torso should be upright in the starting position.","To begin, flex at the spine, attempting to bring your rib cage to your legs as you pull the cable down.","Pause at the bottom of the motion, and then slowly return to the starting position.","These can be done with twists or to the side to hit the obliques."],"sh":3,"p":15,"fo":"pull","pt":"Abdominal na polia com corda"},{"id":"Rope_Straight-Arm_Pulldown","n":"Rope Straight-Arm Pulldown","eq":"cable","lv":"beginner","pm":["lats"],"sm":[],"mc":"isolation","ins":["Attach a rope to a high pulley and make your weight selection. Stand a couple feet back from the pulley with your feet staggered and take the rope with both hands. Lean forward from the hip, keeping your back straight, with your arms extended up in front of you. This will be your starting position.","Keeping your arms straight, extend the shoulder to pull the rope down to your thighs.","Pause at the bottom of the motion, squeezing your lats.","Return to the starting position without allowing the weight to fully rest on the stack."],"sh":3,"p":16,"fo":"pull","pt":"Pulldown com braços estendidos na corda"},{"id":"Seated_Cable_Rows","n":"Seated Cable Rows","eq":"cable","lv":"beginner","pm":["middle back"],"sm":["biceps","lats","shoulders"],"mc":"compound","ins":["For this exercise you will need access to a low pulley row machine with a V-bar. Note: The V-bar will enable you to have a neutral grip where the palms of your hands face each other. To get into the starting position, first sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.","Lean over as you keep the natural alignment of your back and grab the V-bar handles.","With your arms extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lats as you hold the bar in front of you. This is the starting position of the exercise.","Keeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it until you touch the abdominals. Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard. Hold that contraction for a second and slowly go back to the original position while breathing in.","Repeat for the recommended amount of repetitions."],"sh":3,"p":17,"fo":"pull","pt":"Remada sentada na polia"},{"id":"Seated_Cable_Shoulder_Press","n":"Seated Cable Shoulder Press","eq":"cable","lv":"beginner","pm":["shoulders"],"sm":["triceps"],"mc":"compound","ins":["Adjust the weight to an appropriate amount and be seated, grasping the handles. Your upper arms should be about 90 degrees to the body, with your head and chest up. The elbows should also be bent to about 90 degrees. This will be your starting position.","Begin by extending through the elbow, pressing the handles together above your head.","After pausing at the top, return the handles to the starting position. Ensure that you maintain tension on the cables.","You can also execute this movement with your back off the pad and alternate hands."],"sh":3,"p":18,"fo":"push","pt":"Desenvolvimento sentado na polia"},{"id":"Seated_Calf_Raise","n":"Seated Calf Raise","eq":"machine","lv":"beginner","pm":["calves"],"sm":[],"mc":"isolation","ins":["Sit on the machine and place your toes on the lower portion of the platform provided with the heels extending off. Choose the toe positioning of your choice (forward, in, or out) as per the beginning of this chapter.","Place your lower thighs under the lever pad, which will need to be adjusted according to the height of your thighs. Now place your hands on top of the lever pad in order to prevent it from slipping forward.","Lift the lever slightly by pushing your heels up and release the safety bar. This will be your starting position.","Slowly lower your heels by bending at the ankles until the calves are fully stretched. Inhale as you perform this movement.","Raise the heels by extending the ankles as high as possible as you contract the calves and breathe out. Hold the top contraction for a second.","Repeat for the recommended amount of repetitions."],"sh":3,"p":19,"fo":"push","pt":"Panturrilha sentado"},{"id":"Seated_Leg_Curl","n":"Seated Leg Curl","eq":"machine","lv":"beginner","pm":["hamstrings"],"sm":[],"mc":"isolation","ins":["Adjust the machine lever to fit your height and sit on the machine with your back against the back support pad.","Place the back of lower leg on top of padded lever (just a few inches under the calves) and secure the lap pad against your thighs, just above the knees. Then grasp the side handles on the machine as you point your toes straight (or you can also use any of the other two stances) and ensure that the legs are fully straight right in front of you. This will be your starting position.","As you exhale, pull the machine lever as far as possible to the back of your thighs by flexing at the knees. Keep your torso stationary at all times. Hold the contracted position for a second.","Slowly return to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."],"sh":3,"p":20,"fo":"pull","pt":"Cadeira flexora"},{"id":"Seated_One-arm_Cable_Pulley_Rows","n":"Seated One-arm Cable Pulley Rows","eq":"cable","lv":"intermediate","pm":["middle back"],"sm":["biceps","lats","traps"],"mc":"compound","ins":["To get into the starting position, first sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.","Lean over as you keep the natural alignment of your back and grab the single handle attachment with your left arm using a palms-down grip.","With your arm extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lat as you hold the bar in front of you. The right arm can be kept by the waist. This is the starting position of the exercise.","Keeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it as you rotate the wrist, so that by the time your hand is by your abdominals it is in a neutral position (palms facing the torso). Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard.","Hold that contraction for a second and slowly go back to the original position while breathing in. Tip: Remember to rotate the wrist as you go back to the starting position so that the palms are facing down again.","Repeat for the recommended amount of repetitions and then perform the same movement with the right hand."],"sh":3,"p":21,"fo":"pull","pt":"Remada unilateral sentada na polia"},{"id":"Seated_Two-Arm_Palms-Up_Low-Pulley_Wrist_Curl","n":"Seated Two-Arm Palms-Up Low-Pulley Wrist Curl","eq":"cable","lv":"beginner","pm":["forearms"],"sm":[],"mc":"isolation","ins":["Put a bench in front of a low pulley machine that has a barbell or EZ Curl attachment on it.","Move the bench far enough away so that when you bring the handle to the top of your thighs tension is created on the cable due to the weight stack being moved up.","Now hold the handle with both hands, palms up, using a shoulder-width grip.","Step back and sit on the bench with your feet about shoulder width apart, firmly on the floor.","Lean forward and place the forearms on your thighs with the back of your wrists over your knees. This will be your starting position.","Lower the bar as far as possible, while inhaling and keeping a tight grip.","Now curl the bar up as high as possible while contracting the forearms. Tip: Only the wrist should move; not the forearms.","After a second contraction at the top go back to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"sh":3,"p":22,"fo":"pull","pt":"Rosca de punho sentado na polia baixa (palmas para cima)"},{"id":"Shotgun_Row","n":"Shotgun Row","eq":"cable","lv":"beginner","pm":["lats"],"sm":["biceps","middle back"],"mc":"compound","ins":["Attach a single handle to a low cable.","After selecting the correct weight, stand a couple feet back with a wide-split stance. Your arm should be extended and your shoulder forward. This will be your starting position.","Perform the movement by retracting the shoulder and flexing the elbow. As you pull, supinate the wrist, turning the palm upward as you go.","After a brief pause, return to the starting position."],"sh":3,"p":23,"fo":"pull","pt":"Remada shotgun na polia"},{"id":"Single-Arm_Cable_Crossover","n":"Single-Arm Cable Crossover","eq":"cable","lv":"beginner","pm":["chest"],"sm":[],"mc":"isolation","ins":["Begin by moving the pulleys to the high position, select the resistance to be used, and take a handle in each hand.","Step forward in front of both pulleys with your arms extended in front of you, bringing your hands together. Your head and chest should be up as you lean forward, while your feet should be staggered. This will be your starting position.","Keeping your left arm in place, allow your right arm to extend out to the side, maintaining a slight bend at the elbow. The right arm should be perpendicular to the body at approximately shoulder level.","Return your arm back to the starting position by pulling your hand back to the midline of the body.","Hold for a second at the starting position and repeat the movement on the opposite side. Continue alternating back and forth for the prescribed number of repetitions."],"sh":4,"p":0,"fo":"push","pt":"Crossover unilateral na polia"},{"id":"Single-Leg_Leg_Extension","n":"Single-Leg Leg Extension","eq":"machine","lv":"beginner","pm":["quadriceps"],"sm":[],"mc":"isolation","ins":["Seat yourself in the machine and adjust it so that you are positioned properly. The pad should be against the lower part of the shin but not in contact with the ankle. Adjust the seat so that the pivot point is in line with your knee. Select a weight appropriate for your abilities.","Maintaining good posture, fully extend one leg, pausing at the top of the motion.","Return to the starting position without letting the weight stop, keeping tension on the muscle.","Repeat for the desired number of repetitions."],"sh":4,"p":1,"fo":"push","pt":"Extensora unilateral"},{"id":"Smith_Machine_Behind_the_Back_Shrug","n":"Smith Machine Behind the Back Shrug","eq":"machine","lv":"beginner","pm":["traps"],"sm":["shoulders"],"mc":"isolation","ins":["With the bar at thigh level, load an appropriate weight.","Stand with the bar behind you, taking a shoulder-width, pronated grip on the bar and unhook the weight. You should be standing up straight with your head and chest up and your arms extended. This will be your starting position.","Initiate the movement by shrugging your shoulders straight up. Do not flex the arms or wrist during the movement.","After a brief pause return the weight to the starting position.","Repeat for the desired number of repetitions before engaging the hooks to rack the weight."],"sh":4,"p":2,"fo":"pull","pt":"Encolhimento atrás das costas no Smith"},{"id":"Smith_Machine_Bench_Press","n":"Smith Machine Bench Press","eq":"machine","lv":"beginner","pm":["chest"],"sm":["shoulders","triceps"],"mc":"compound","ins":["Place a flat bench underneath the smith machine. Now place the barbell at a height that you can reach when lying down and your arms are almost fully extended. Once the weight you need is selected, lie down on the flat bench. Using a pronated grip that is wider than shoulder width, unlock the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your middle chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, lock the bar back in the rack."],"sh":4,"p":3,"fo":"push","pt":"Supino reto no Smith"},{"id":"Smith_Machine_Bent_Over_Row","n":"Smith Machine Bent Over Row","eq":"machine","lv":"beginner","pm":["middle back"],"sm":["biceps","lats","shoulders"],"mc":"compound","ins":["Set the barbell attached to the smith machine to a height that is about 2 inches below your knees.","Bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up.","Now grasp the barbell using an overhand (pronated) grip and unlock it from the smith machine rack. Then let it hang directly in front of you as your arms hang extended perpendicular to the floor and your torso. This is your starting position.","While keeping the torso stationary, lift the barbell as you breathe out, keeping the elbows close to the body and not doing any force with the forearm other than holding the weights. On the top contracted position, squeeze the back muscles and hold for a second.","Slowly lower the weight again to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"sh":4,"p":4,"fo":"pull","pt":"Remada curvada no Smith"},{"id":"Smith_Machine_Calf_Raise","n":"Smith Machine Calf Raise","eq":"machine","lv":"beginner","pm":["calves"],"sm":[],"mc":"isolation","ins":["Place a block or weight plate below the bar on the Smith machine. Set the bar to a position that best matches your height. Once the correct height is chosen and the bar is loaded, step onto the plates with the balls of your feet and place the bar on the back of your shoulders.","Take the bar with both hands facing forward. Rotate the bar to unrack it. This will be your starting position.","Raise your heels as high as possible by pushing off of the balls of your feet, flexing your calf at the top of the contraction. Your knees should remain extended. Hold the contracted position for a second before you start to go back down.","Return slowly to the starting position as you breathe in while lowering your heels.","Repeat for the recommended amount of repetitions."],"sh":4,"p":5,"fo":"push","pt":"Panturrilha em pé no Smith"},{"id":"Smith_Machine_Close-Grip_Bench_Press","n":"Smith Machine Close-Grip Bench Press","eq":"machine","lv":"beginner","pm":["triceps"],"sm":["chest","shoulders"],"mc":"compound","ins":["Place a flat bench underneath the smith machine. Place the barbell at a height that you can reach when lying down and your arms are almost fully extended. Once the weight you need is selected, lie down on the flat bench. Using a close and pronated grip (palms facing forward) that is around shoulder width, unlock the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your middle chest. Tip: Make sure that as opposed to a regular bench press, you keep the elbows close to the torso at all times in order to maximize triceps involvement.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your triceps muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, lock the bar back in the rack."],"sh":4,"p":6,"fo":"push","pt":"Supino fechado no Smith"},{"id":"Smith_Machine_Decline_Press","n":"Smith Machine Decline Press","eq":"machine","lv":"beginner","pm":["chest"],"sm":["shoulders","triceps"],"mc":"compound","ins":["Position a decline bench in the rack so that the bar will be above your chest. Load an appropriate weight and take your place on the bench.","Rotate the bar to unhook it from the rack and fully extend your arms. Your back should be slightly arched and your shoulder blades retracted. This will be your starting position.","Begin the movement by flexing your arms, lowering the bar to your chest.","Pause briefly, and then extend your arms to push the weight back to the starting position.","After completing the desired number of repetitions, rotate the bar to rack the weight."],"sh":4,"p":7,"fo":"","pt":"Supino declinado no Smith"},{"id":"Smith_Machine_Hang_Power_Clean","n":"Smith Machine Hang Power Clean","eq":"machine","lv":"intermediate","pm":["hamstrings"],"sm":["glutes","lower back","quadriceps","shoulders","traps"],"mc":"compound","ins":["Position the bar at knee height and load it to an appropriate weight.","Take a pronated grip on the bar outside of shoulder width and unhook the bar from the machine. Your arms should be fully extended with your head and chest up. Your elbows should be pointed out with your shoulders back and down. Your hips should be back, loading the tension into the hamstrings. This will be your starting position.","Initate the movement by forcefully extending the hips and knees, accelerating into the bar. Ensure that you keep your arms straight during this part of the motion.","Upon full extension, rebend the hips and knees to lower your receiving position.","Allow the arms to flex at this point, rotating the elbows around the bar to receive it on your shoulders.","Extend through the hips and knees to come to a standing position with the bar racked on your shoulders to complete the movement."],"sh":4,"p":8,"fo":"pull","pt":"Power clean suspenso no Smith"},{"id":"Smith_Machine_Hip_Raise","n":"Smith Machine Hip Raise","eq":"machine","lv":"beginner","pm":["abdominals"],"sm":[],"mc":"isolation","ins":["Position a bench in the rack and load the bar to an appropriate weight. Lie down on the bench, placing the bottom of your feet against the bar. Unlock the bar and extend your legs. You may need to use your hands to assist you. For added stability grasp the sides of the Smith Machine. This will be your starting position.","Initiate the movement by rotating your pelvis, flexing your spine to raise your hips off of the bench. Maintain a slight bend in the knees throughout the motion.","After a brief pause, return the hips to the bench.","Repeat for the desired number of repetitions."],"sh":4,"p":9,"fo":"pull","pt":"Elevação de quadril no Smith"},{"id":"Smith_Machine_Incline_Bench_Press","n":"Smith Machine Incline Bench Press","eq":"machine","lv":"beginner","pm":["chest"],"sm":["shoulders","triceps"],"mc":"compound","ins":["Place an incline bench underneath the smith machine. Place the barbell at a height that you can reach when lying down and your arms are almost fully extended. Once the weight you need is selected, lie down on the incline bench and make sure your upper chest is aligned with the barbell. Using a pronated grip (palms facing forward) that is wider than shoulder width, unlock the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your upper chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"sh":4,"p":10,"fo":"push","pt":"Supino inclinado no Smith"},{"id":"Smith_Machine_Leg_Press","n":"Smith Machine Leg Press","eq":"machine","lv":"intermediate","pm":["quadriceps"],"sm":["calves","glutes","hamstrings"],"mc":"compound","ins":["Position a Smith machine bar a couple feet off of the ground. Ensure that it is resting on the safeties. After loading the bar to an appropriate weight, lie underneath the bar. Place the middle of your feet on the bar, tucking your knees to your chest. This will be your starting position.","Begin the movement by driving through your feet to move the bar upward, extending the hips and knees. Do not lock out your knees.","At the top of the motion, pause briefly before returning to the starting position."],"sh":4,"p":11,"fo":"push","pt":"Leg press no Smith"},{"id":"Smith_Machine_One-Arm_Upright_Row","n":"Smith Machine One-Arm Upright Row","eq":"machine","lv":"beginner","pm":["shoulders"],"sm":["biceps","traps"],"mc":"compound","ins":["With the bar at thigh level, load an appropriate weight.","Take a wide grip on the bar and unhook the weight, removing your off hand from the bar. Your arm should be extended as you stand up straight with your head and chest up. This will be your starting position.","Begin the movement by flexing the elbow, raising the upper arm with the elbow pointed out. Continue until your upper arm is parallel to the floor.","After a brief pause, return the weight to the starting position.","Repeat for the desired number of repetitions before engaging the hooks to rack the weight."],"sh":4,"p":12,"fo":"pull","pt":"Remada alta unilateral no Smith"},{"id":"Smith_Machine_Overhead_Shoulder_Press","n":"Smith Machine Overhead Shoulder Press","eq":"machine","lv":"beginner","pm":["shoulders"],"sm":["triceps"],"mc":"compound","ins":["To begin, place a flat bench (or preferably one with back support) underneath a smith machine. Position the barbell at a height so that when seated on the flat bench, the arms must be almost fully extended to reach the barbell.","Once you have the correct height, sit slightly in behind the barbell so that there is an imaginary straight line from the tip of your nose to the barbell. Your feet should be stationary. Grab the barbell with the palms facing forward, unlock it and lift it up so that your arms are fully extended. This is the starting position.","Slowly begin to lower the barbell until it is level with your chin while inhaling.","Then lift the barbell back to the starting position using your shoulders while exhaling.","Repeat for the recommended amount of repetitions."],"sh":4,"p":13,"fo":"push","pt":"Desenvolvimento no Smith"},{"id":"Smith_Machine_Pistol_Squat","n":"Smith Machine Pistol Squat","eq":"machine","lv":"intermediate","pm":["quadriceps"],"sm":["calves","glutes","hamstrings"],"mc":"compound","ins":["To begin, first set the bar to a position that best matches your height. Step under it and position the bar across the back of your shoulders.","Take the bar with your hands facing forward, unlock it and lift it off the rack by extending your legs. 3","Move one foot forward about 12 inches in front of the bar. Extend the other leg out in front of you, holding it off the ground. Look forward at all times and maintain a neutral or slightly arched spine. This will be your starting position.","Maintaining good posture, lower yourself by flexing the knee and hip, going down as far as flexibility allows.","Pause briefly at the bottom and then return to the starting position by driving through the heel of your foot, extending the knee and hip."],"sh":4,"p":14,"fo":"push","pt":"Agachamento pistol no Smith"},{"id":"Smith_Machine_Reverse_Calf_Raises","n":"Smith Machine Reverse Calf Raises","eq":"machine","lv":"beginner","pm":["calves"],"sm":[],"mc":"isolation","ins":["Adjust the barbell on the smith machine to fit your height and align a raised platform right under the bar.","Stand on the platform with the heels of your feet secured on top of it with the balls of your feet extending off it. Position your toes facing forward with a shoulder width stance.","Now, place your shoulders under the barbell while maintaining the foot positioning described and push the barbell up by extending your hips and knees until your torso is standing erect. The knees should be kept with a slight bend; never locked. This will be your starting position. Tip: The barbell on your back is only for balance purposes.","Raise the balls of your feet as you breathe out by extending your toes as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position for a second before you start to go back down.","Slowly go back down to the starting position as you breathe in by lowering the balls of your feet and toes.","Repeat for the recommended amount of repetitions."],"sh":4,"p":15,"fo":"push","pt":"Elevação de tornozelo (tibial) no Smith"},{"id":"Smith_Machine_Squat","n":"Smith Machine Squat","eq":"machine","lv":"beginner","pm":["quadriceps"],"sm":["calves","glutes","hamstrings","lower back"],"mc":"compound","ins":["To begin, first set the bar on the height that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side (palms facing forward), unlock it and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance which targets overall development; however you can choose any of the three stances discussed in the foot stances section).","Begin to slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."],"sh":4,"p":16,"fo":"push","pt":"Agachamento no Smith"},{"id":"Smith_Machine_Stiff-Legged_Deadlift","n":"Smith Machine Stiff-Legged Deadlift","eq":"machine","lv":"beginner","pm":["hamstrings"],"sm":["glutes","lower back"],"mc":"compound","ins":["To begin, set the bar on the smith machine to a height that is around the middle of your thighs. Once the correct height is chosen and the bar is loaded, grasp the bar using a pronated (palms forward) grip that is shoulder width apart. You may need some wrist wraps if using a significant amount of weight.","Lift the bar up by fully extending your arms while keeping your back straight. Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.","Keeping the knees stationary, lower the barbell to over the top of your feet by bending at the waist while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Exhale as you perform this movement","Start bringing your torso up straight again as soon as you feel the hamstrings stretch by extending your hips and waist until you are back at the starting position. Inhale as you perform this movement.","Repeat for the recommended amount of repetitions."],"sh":4,"p":17,"fo":"pull","pt":"Stiff no Smith"},{"id":"Smith_Machine_Upright_Row","n":"Smith Machine Upright Row","eq":"machine","lv":"beginner","pm":["traps"],"sm":["biceps","middle back","shoulders"],"mc":"compound","ins":["To begin, set the bar on the smith machine to a height that is around the middle of your thighs. Once the correct height is chosen and the bar is loaded, grasp the bar using a pronated (palms forward) grip that is shoulder width apart. You may need some wrist wraps if using a significant amount of weight.","Lift the barbell up and fully extend your arms with your back straight. There should be a slight bend at the elbows. This is the starting position.","Use your side shoulders to lift the bar as you exhale. The bar should be close to the body as you move it up. Continue to lift it until it nearly touches your chin. Tip: Your elbows should drive the motion. As you lift the bar, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.","Lower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."],"sh":4,"p":18,"fo":"pull","pt":"Remada alta no Smith"},{"id":"Smith_Single-Leg_Split_Squat","n":"Smith Single-Leg Split Squat","eq":"machine","lv":"beginner","pm":["quadriceps"],"sm":["calves","glutes","hamstrings"],"mc":"compound","ins":["To begin, place a flat bench 2-3 feet behind the smith machine. Then, set the bar on the height that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side (palms facing forward), unlock it and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Position your legs by placing one foot slightly forward under the bar and extending your other leg back and place the top of your foot on the bench. This will be your starting position","Begin to slowly lower the bar by bending the knee as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calf becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knee should make an imaginary straight line with the toes that is perpendicular to the front. If your knee is past that imaginary line (if it is past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot mainly as you straighten your leg again and go back to the starting position.","Repeat for the recommended amount of repetitions.","Switch legs and repeat the movement."],"sh":4,"p":19,"fo":"push","pt":"Agachamento búlgaro unilateral no Smith"},{"id":"Standing_Biceps_Cable_Curl","n":"Standing Biceps Cable Curl","eq":"cable","lv":"beginner","pm":["biceps"],"sm":[],"mc":"isolation","ins":["Stand up with your torso upright while holding a cable curl bar that is attached to a low pulley. Grab the cable bar at shoulder width and keep the elbows close to the torso. The palm of your hands should be facing up (supinated grip). This will be your starting position.","While holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.","Slowly begin to bring the curl bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"sh":4,"p":20,"fo":"pull","pt":"Rosca bíceps em pé na polia"},{"id":"Standing_
