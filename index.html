<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>GoManu</title>

<style>
/* Layout: phone-first column. Four bottom tabs (Hoje / Fichas / Evolução / Histórico). Navy hero card for today's workout, pink as the single action color. Workout mode is full screen with the rest timer docked at the bottom. */
:root{
  --bg:#F5F6FB; --surface:#FFFFFF; --ink:#0B1F4B; --muted:#5C6A8C; --line:#DFE3F0;
  --accent:#D6076F; --accent-ink:#FFFFFF; --accent-soft:#FDE6F2;
  --navy:#0B1F4B; --on-navy:#FFFFFF; --on-navy-mut:#B4BEDB; --good:#1B8A5A; --bad:#C62F4D;
  --timer-bg:#0B1F4B; --timer-ink:#FFFFFF; --navh:calc(60px + env(safe-area-inset-bottom,0px));
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09122B; --surface:#111D42; --ink:#EEF1FA; --muted:#97A3C4; --line:#22325F;
  --accent:#FF4FA3; --accent-ink:#2A0719; --accent-soft:#3A1238;
  --navy:#18296A; --on-navy:#FFFFFF; --on-navy-mut:#B4BEDB; --good:#4CD39A; --bad:#FF8AA0;
  --timer-bg:#FF4FA3; --timer-ink:#2A0719; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09122B; --surface:#111D42; --ink:#EEF1FA; --muted:#97A3C4; --line:#22325F;
  --accent:#FF4FA3; --accent-ink:#2A0719; --accent-soft:#3A1238;
  --navy:#18296A; --on-navy:#FFFFFF; --on-navy-mut:#B4BEDB; --good:#4CD39A; --bad:#FF8AA0;
  --timer-bg:#FF4FA3; --timer-ink:#2A0719; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);
  padding-block:20px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#root{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:700;text-wrap:balance}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-size:36px;line-height:1;letter-spacing:.01em}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.wk{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.wk b{display:block;font-family:var(--display);font-size:30px;line-height:1;color:var(--accent)}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
  padding:0 max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px))}
#nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#nav button{background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px;font-weight:600;position:relative}
#nav button[aria-current=page]{color:var(--accent)}
#nav button[aria-current=page]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
#nav svg{width:22px;height:22px}

.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.weeks button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:64px}
.weeks button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.weeks .l{font-weight:600;font-size:13px}.weeks .t{font-size:12px;color:var(--muted)}
.weeks button[aria-pressed=true] .t{color:var(--on-navy-mut)}
.bars{display:flex;gap:3px;height:12px;align-items:flex-end}
.bars i{width:5px;border-radius:2px;border:1.5px solid var(--accent);background:transparent}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}.bars i:nth-child(3){height:11px}
.bars i.on{background:var(--accent)}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 0 12px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.days .dl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.days .dn{font-family:var(--display);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.days .tod{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.days .tod .dl{color:var(--on-navy-mut)}
.days .dot{position:absolute;bottom:5px;width:6px;height:6px;border-radius:50%;background:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.hero{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.hero .sub{color:var(--on-navy-mut)}
.hero h2{font-size:34px}
.pad{padding:16px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:26px;line-height:1.05}
.sub{color:var(--muted);font-size:13px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;min-height:48px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dng{color:var(--bad)}
.btn.sm{min-height:44px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:default}
.hero .btn:not(.pri){background:transparent;border-color:var(--on-navy-mut);color:var(--on-navy)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:20px 16px;color:var(--muted)}.empty b{color:var(--ink)}
.note{margin:12px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:13px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
textarea{resize:vertical;min-height:64px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.two{grid-template-columns:1fr}}

.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:4px 2px -6px}
.flist{display:flex;flex-direction:column;gap:8px}
.frow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px;min-height:56px;text-align:left;width:100%}
.frow .tx{flex:1;min-width:0}.frow .nm{font-weight:600}.frow .sub{font-size:12px}
.frow.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

ul.list{list-style:none;margin:0;padding:0}
.ex{border-top:1px solid var(--line);padding:10px 8px 10px 14px;display:flex;align-items:center;gap:8px}
.ex .tx{flex:1;min-width:0}.ex .nm{font-weight:600}.ex .rx{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.mg{display:inline-block;font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 8px;font-weight:600;margin-top:3px}
.ic{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px;font-weight:600}
.ic[disabled]{opacity:.35}
.form{padding:14px 16px;display:grid;gap:10px;border-top:1px solid var(--line);background:var(--bg)}

/* workout mode */
.ahead{display:flex;align-items:center;gap:10px}
.ahead .x{margin-left:auto}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots i.d{background:var(--accent)}.dots i.c{background:var(--ink)}
.big{font-size:38px;line-height:1}
.last{font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums;font-weight:600}
.sug{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.sug b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sug .why{color:var(--ink)}
.shead,.set{display:grid;grid-template-columns:34px 1fr 1fr 52px;gap:8px;align-items:center}
.shead{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 2px}
.set .sn{font-family:var(--display);font-size:22px;text-align:center;line-height:1}
.set .sn small{display:block;font-family:var(--body);font-size:9px;color:var(--muted);letter-spacing:.04em}
.set input{text-align:center;font-size:20px;font-weight:600;min-height:52px;font-variant-numeric:tabular-nums}
.set .ok{height:52px;width:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:transparent;display:grid;place-items:center}
.set.done .ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set.done input{opacity:.65}
.sticky{display:grid;grid-template-columns:1fr 2fr;gap:8px}

.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat div{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{font-family:var(--display);font-size:30px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.delta{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.up{color:var(--good)}.dn2{color:var(--bad)}
.pr{font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 8px;font-weight:700;margin-left:6px;white-space:nowrap}
.srow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.srow:first-child{border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.off{border-style:dashed;color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:10px}
.hh{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:none;border:0;padding:12px 14px;text-align:left}
.hh h3{font-size:20px}.hh .tag{font-size:12px;color:var(--muted);text-align:right}
.foot{font-size:12px;color:var(--muted);text-align:center}

/* evolution */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:8px 4px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);min-height:44px}
.seg button[aria-pressed=true]{background:var(--navy);color:var(--on-navy)}
.rec{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.rec:first-of-type{border-top:0}
.rec i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--accent)}
.rec i.warn{background:var(--bad)}.rec i.ok{background:var(--good)}
.grow{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.grow .tr{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.grow .tr span{display:block;height:100%;background:var(--accent);border-radius:4px}
.grow .v{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;min-width:62px}
svg.ch{width:100%;height:auto;display:block;touch-action:pan-y}
.ch .gl{stroke:var(--line);stroke-width:1}
.ch .tx{fill:var(--muted);font:11px var(--body)}
.ch .tv{fill:var(--ink);font:600 11px var(--body)}
.ch .ln{stroke:var(--accent);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.ch .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.ch .bar{fill:var(--accent)}
.ch .xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prl{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.prl:first-child{border-top:0}
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--navy);color:var(--on-navy);font-size:12px;padding:6px 9px;border-radius:8px;max-width:220px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.disc{font-size:12px;color:var(--muted)}

#timerbar{position:fixed;left:0;right:0;bottom:var(--navh);z-index:20;background:var(--timer-bg);color:var(--timer-ink);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
body.act #timerbar{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#timerbar .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
#timerbar .lab{font-size:12px;opacity:.85;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#timerbar .t{font-family:var(--display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
#timerbar button{background:transparent;color:inherit;border:1.5px solid currentColor;border-radius:10px;min-height:44px;padding:0 12px;font-weight:600}
body.act #nav{display:none}
body.act{padding-bottom:100px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:0 12px;min-height:40px;font-size:13px;font-weight:600;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.chip.st{min-height:28px;display:inline-flex;align-items:center;background:var(--bg);font-weight:600;color:var(--muted)}
.bodymap{display:flex;gap:6px;justify-content:center;width:100%;max-width:440px;margin:0 auto}
.bodymap .bcol{min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}.bodymap svg{width:100%;height:auto}
.bodymap .bd2{fill:var(--bg);stroke:var(--muted);stroke-opacity:.45;stroke-width:1;vector-effect:non-scaling-stroke}
.bodymap .bd{fill:var(--bg);stroke:var(--muted);stroke-opacity:.5;stroke-width:1.2;vector-effect:non-scaling-stroke}
.bodymap .bl{font:700 10px var(--body);color:var(--muted);letter-spacing:.1em}
.bodymap .rg{fill:var(--line);stroke:var(--muted);stroke-width:1;stroke-opacity:.5;vector-effect:non-scaling-stroke}
.bodymap [data-act]{cursor:pointer}
.bodymap [data-act]:hover{fill:var(--on-navy-mut)}
.bodymap [data-act]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bodymap .rg.s{fill:var(--accent-soft);stroke:var(--accent);stroke-opacity:1}
.bodymap .rg.p,.bodymap .rg.on{fill:var(--accent);stroke:var(--accent);stroke-opacity:1}
.lrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:8px 14px;text-align:left;min-height:64px}
.lrow .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.lrow .nm{font-weight:600}
.th{width:84px;height:56px;flex:none;border-radius:8px;background-color:var(--bg);background-size:400% 600%;border:1px solid var(--line)}
.th.none{display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;color:var(--muted);line-height:1.1;background-image:none}
.th.big{width:100%;height:auto;aspect-ratio:3/2;border-radius:0;border:0;border-bottom:1px solid var(--line)}
.ins{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.ul{margin:0;padding-left:18px;font-size:14px}
.notes{white-space:pre-wrap;font-size:14px}
.src{font-size:12px;color:var(--muted);text-align:center}
.src a{color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.xlink{background:none;border:0;padding:0;font-size:12px;color:var(--accent);font-weight:600;text-align:left;min-height:32px}
.days .dayb{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 0 12px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;min-height:64px;color:var(--ink)}
.days .dayb.now:not(.sel){border-color:var(--accent);border-width:1.5px}
.days .dayb.sel{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.days .dayb.sel .dl{color:var(--on-navy-mut)}
.mpanel{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column}
.bodymap .rg.on{stroke:var(--navy);stroke-width:2.5;stroke-opacity:1;vector-effect:non-scaling-stroke}
.ul li{margin:2px 0}
.chip.dash{border-style:dashed;color:var(--muted)}

.balday{font-size:13px;font-weight:600;min-height:40px;border-radius:999px;padding:0 12px;line-height:1.2}
.pickp+.sub+.balday,.balday{margin:0}

#nav .in{grid-template-columns:repeat(6,1fr)}#nav button{font-size:10px}
.ex{flex-wrap:wrap}.swap{display:flex;flex-direction:column;gap:6px;padding:4px 0 8px}
.pickp{display:flex;flex-direction:column;gap:6px}.hero .pickp .chip{background:var(--surface);color:var(--ink)}.hero .pickp .chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.hero .pickp .sub{color:var(--on-navy-mut)}.hero .pickp .btn{color:var(--on-navy)}
.dots i.sk{opacity:.35;background:repeating-linear-gradient(45deg,var(--muted) 0 2px,transparent 2px 4px)}
.brand{display:flex;align-items:center;gap:10px;margin:2px 0 0}.brand img{width:40px;height:40px;border-radius:10px;flex:none;box-shadow:0 2px 8px rgba(11,31,75,.25)}.brand span{font-family:var(--display);font-weight:700;font-style:italic;font-size:30px;letter-spacing:.02em;line-height:1;color:var(--ink)}.brand b{color:var(--accent);font-weight:700}

function fmt(s,o){return fromIso(s).toLocaleDateString('pt-BR',o)}
function addDays(s,n){var d=fromIso(s);return iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n))}
function monOf(s){var d=fromIso(s),w=(d.getDay()+6)%7;return iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()-w))}
function num(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(n)?0:n}
function nf(n){return (Math.round(n*10)/10).toLocaleString('pt-BR')}

/* ---------- estado e persistência ---------- */
var S={view:'hoje',week:'s1',ses:{},over:{},ficha:null,form:null,confirm:null,active:null,summary:null,openHist:null,sync:'local',ev:{ex:'',metric:'kg',range:30,table:false}};
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
S.ses=lsGet('pw2-ses')||{};S.over=lsGet('pw2-over')||{};S.week=lsGet('pw2-week')||'s1';
var weekTouched=false,dbh=null,pend={},inflight={};
function schedule(key,fn,ms){
  clearTimeout(pend[key]&&pend[key].t);
  var rec={t:setTimeout(function(){
    var prev=inflight[key]||Promise.resolve();
    inflight[key]=prev.then(fn).then(function(){S.sync='ok'}).catch(function(e){console.warn('save',key,e);S.sync='error'}).then(function(){if(pend[key]===rec)delete pend[key];foot()});
  },ms||500)};pend[key]=rec;
}
function saveSes(id){lsSet('pw2-ses',S.ses);if(!dbh)return;schedule('ses:'+id,function(){return dbh.collection('sessions').doc(id).set(clone(S.ses[id]))})}
function delSes(id){lsSet('pw2-ses',S.ses);if(!dbh)return;schedule('ses:'+id,function(){return dbh.collection('sessions').doc(id).delete()},100)}
function saveCfg(){lsSet('pw2-over',S.over);lsSet('pw2-week',S.week);if(!dbh)return;schedule('cfg',function(){return dbh.doc('app/config').set({week:S.week,over:clone(S.over),off:clone(S.off||{}),body:clone(S.body||[])})},300)}

function fichas(){var o={},k;for(k in SEED)o[k]=SEED[k];for(k in S.over){if(S.over[k].deleted)delete o[k];else o[k]=S.over[k]}return o}
function getFicha(id){return fichas()[id]}
function editFicha(id,fn){var f=clone(getFicha(id));fn(f);f.partial=false;S.over[id]=f;saveCfg()}

/* ---------- prescrição ---------- */
function parsePlan(x){
  var s=String(x.sets||'');
  if(x.chk)return {check:true};
  if(/\d+\s*min/i.test(s)&&!/[×x]\s*\d/.test(s))return {cardio:+s.match(/(\d+)\s*min/i)[1]};
  var re=/(\d+)\s*[×x]\s*(\d+)/g,g,parts=[],out=[];
  while((g=re.exec(s)))parts.push({n:+g[1],r:+g[2]});
  if(!parts.length)return {sets:[{reps:'',warm:false},{reps:'',warm:false},{reps:'',warm:false}]};
  var warm=parts.length>1&&parts[0].n===1;
  parts.forEach(function(p,pi){for(var i=0;i<p.n;i++)out.push({reps:p.r,warm:warm&&pi===0})});
  return {sets:out,side:/cada lado/i.test(s)};
}
function planWithExtra(x,en){var p=parsePlan(x);if(p.sets&&en&&en.extra){var last=p.sets[p.sets.length-1]||{reps:''};for(var i=0;i<en.extra;i++)p.sets.push({reps:last.reps,warm:false})}return p}
function planMeta(x){if(x.chk)return {tr:0,nw:0}; /* meta de reps (topo) e nº de séries de trabalho */
  var p=parsePlan(x);if(!p.sets)return {tr:0,nw:0};
  var w=p.sets.filter(function(s){return !s.warm}),tr=0;w.forEach(function(s){if(+s.reps>tr)tr=+s.reps});return {tr:tr,nw:w.length};
}
function planKg(x,warm){
  var l=String(x.load||'');if(/sem peso/i.test(l))return '';
  var m=l.match(/\d+(?:[.,]\d+)?/g);if(!m)return '';
  if(/[\/+]|\se\s/.test(l)&&m.length>1)return warm?m[0]:m[1];
  return m[0];
}
function restSec(t){var m=String(t||'').match(/(\d+)\s*("|'|min|s)/g);if(!m)return 0;var l=m[m.length-1].match(/(\d+)\s*("|'|min|s)/);return l[2]==="'"||l[2]==='min'?+l[1]*60:+l[1]}

/* ---------- histórico, recordes, volume ---------- */
function sesIds(){return Object.keys(S.ses).sort().reverse()}
function entryFor(sid,exId){var s=S.ses[sid];return s&&s.entries&&s.entries[exId]}
function doneSets(e){var out=[];if(!e||!e.sets)return out;Object.keys(e.sets).map(Number).sort(function(a,b){return a-b}).forEach(function(i){var st=e.sets[i];if(st.d)out.push({i:i,kg:num(st.kg),reps:num(st.reps),w:!!st.w})});return out}
function working(ds){var w=ds.filter(function(s){return !s.w});return w.length?w:ds}
function lastOf(name,exceptSid){
  var ids=sesIds(),cut=exceptSid&&S.ses[exceptSid]&&S.ses[exceptSid].date;
  for(var i=0;i<ids.length;i++){
    if(ids[i]===exceptSid||(cut&&S.ses[ids[i]].date>cut))continue;var en=S.ses[ids[i]].entries||{};
    for(var k in en){if(en[k].n===name){var ds=doneSets(en[k]);if(ds.length)return {sid:ids[i],date:S.ses[ids[i]].date,sets:ds}}}
  }return null;
}
function vol(sets){return sets.reduce(function(a,s){return a+s.kg*s.reps},0)}
function maxKg(sets){return sets.reduce(function(a,s){return Math.max(a,s.kg)},0)}
function prevMaxKg(name,exceptSid){var m=0;var cut=exceptSid&&S.ses[exceptSid]&&S.ses[exceptSid].date;sesIds().forEach(function(id){if(id===exceptSid||(cut&&S.ses[id].date>cut))return;var en=S.ses[id].entries||{};for(var k in en){if(en[k].n===name)m=Math.max(m,maxKg(working(doneSets(en[k]))))}});return m}
function sesVolume(id){var t=0,en=S.ses[id].entries||{};for(var k in en)t+=vol(doneSets(en[k]));return t}
function sesDone(id){var c=0,en=S.ses[id].entries||{};for(var k in en){if(doneSets(en[k]).length||en[k].cd)c++}return c}
function sessionOn(d){return sesIds().filter(function(id){return S.ses[id].date===d})}

/* por exercício: série temporal e recordes */
function exSeries(name){
  var out=[];sesIds().slice().reverse().forEach(function(id){
    var s=S.ses[id],en=s.entries||{};
    for(var k in en){if(en[k].n!==name)continue;var ds=doneSets(en[k]);if(!ds.length)continue;var wk2=working(ds);
      var rp=0;wk2.forEach(function(q){if(q.reps>rp)rp=q.reps});
      out.push({d:s.date,kg:maxKg(wk2),reps:rp,vol:vol(ds),det:ds.map(function(q){return nf(q.kg)+'×'+q.reps}).join(' · ')});}
  });return out;
}
function exNames(){
  var seen={},list=[];sesIds().forEach(function(id){var en=S.ses[id].entries||{};for(var k in en){var e=en[k];if(e.n&&!seen[e.n]&&doneSets(e).length){seen[e.n]=1;list.push(e.n)}}});return list;
}
function records(name){
  var r={kg:null,reps:null,vol:null};
  sesIds().forEach(function(id){var s=S.ses[id],en=s.entries||{};for(var k in en){if(en[k].n!==name)continue;var ds=doneSets(en[k]);if(!ds.length)continue;
    working(ds).forEach(function(q){if(!r.kg||q.kg>r.kg.kg||(q.kg===r.kg.kg&&q.reps>r.kg.reps))r.kg={kg:q.kg,reps:q.reps,d:s.date};if(!r.reps||q.reps>r.reps.reps)r.reps={reps:q.reps,kg:q.kg,d:s.date}});
    var v=vol(ds);if(!r.vol||v>r.vol.vol)r.vol={vol:v,d:s.date}}});
  return r;
}

/* progressão: sempre uma sugestão para o usuário aprovar */
function incFor(name,kg){var n=norm(name);if(/halter|martelo|concentrado|lateral|frontal/.test(n))return 1;return kg<10?1:2.5}
function suggest(name,tr,nw,exceptSid){
  var hs=[];
  sesIds().forEach(function(id){
    if(hs.length>=2||id===exceptSid)return;var en=S.ses[id].entries||{};
    for(var k in en){if(en[k].n===name){var ds=doneSets(en[k]);if(ds.length){hs.push({date:S.ses[id].date,sets:working(ds),tr:en[k].tr||0,nw:en[k].nw||0});break}}}
  });
  if(!hs.length)return {t:'none',text:'Sem histórico ainda. Comece pela carga da ficha e registre as séries.'};
  var L=hs[0],kgL=maxKg(L.sets),tgt=tr||L.tr||0,need=nw||L.nw||L.sets.length;
  if(!kgL)return {t:'none',text:'Sem carga registrada na última vez. Registre o peso usado para eu acompanhar a evolução.'};
  var hit=tgt>0&&L.sets.length>=need&&L.sets.every(function(q){return q.reps>=tgt});
  if(hit){var inc=incFor(name,kgL);return {t:'up',kg:kgL+inc,inc:inc,text:'Na última vez ('+fmt(L.date,{day:'2-digit',month:'2-digit'})+') você fez todas as '+L.sets.length+' séries com '+tgt+' reps ou mais a '+nf(kgL)+' kg. Podem valer '+nf(kgL+inc)+' kg (+'+nf(inc)+'). Ajuste ao que existe na sua academia.'}}
  if(hs.length>1){
    var struggle=hs.every(function(h){var t=h.tr||tgt;if(!t)return false;var avg=h.sets.reduce(function(a,q){return a+q.reps},0)/h.sets.length;return avg<0.85*t});
    if(struggle)return {t:'review',kg:kgL,text:'Nas últimas 2 sessões a média de reps ficou abaixo da meta. Mantenha '+nf(kgL)+' kg e, se a execução estiver comprometida, reduza 5–10%.'};
  }
  var lowest=L.sets.reduce(function(a,q){return Math.min(a,q.reps)},999);
  return {t:'keep',kg:kgL,text:'Mantenha '+nf(kgL)+' kg'+(tgt?' e busque '+tgt+' reps em todas as séries (a menor foi '+lowest+').':'.')};
}
function stalled(name){
  var s=exSeries(name);if(s.length<4)return 0;var l=s.slice(-4);
  var same=l.every(function(p){return p.kg===l[0].kg&&p.kg>0});
  return same&&l[3].vol<=l[0].vol?s.length:0;
}

/* semana e períodos */
function weekAgg(mon){
  var g={};sesIds().forEach(function(id){var s=S.ses[id];if(monOf(s.date)!==mon)return;var en=s.entries||{};
    for(var k in en){var e=en[k],ds=doneSets(e);if(!ds.length)continue;var gk=e.g||guessMg(e.n)||'outros';var o=g[gk]||(g[gk]={sets:0,vol:0});o.sets+=working(ds).length;o.vol+=vol(ds)}});
  return g;
}
function planGroups(){
  var seen={};var F=fichas();Object.keys(F).forEach(function(k){F[k].ex.forEach(function(x){var g=exMg(x);if(g&&g!=='aerobio')seen[g]=1})});return Object.keys(seen);
}
function periodStats(from,to){ /* [from,to) */
  var t=0,sets=0,v=0;sesIds().forEach(function(id){var s=S.ses[id];if(s.date<from||s.date>=to)return;if(sesDone(id)>0)t++;var en=s.entries||{};for(var k in en){var ds=doneSets(en[k]);sets+=working(ds).length;v+=vol(ds)}});
  return {t:t,sets:sets,vol:v};
}

/* ---------- sessão ativa ---------- */
function startWorkout(fid,date){var dt=date||todayIso;
  var f=getFicha(fid);var s0=S.ses[dt+'_'+fid];if(s0&&s0.ex)f=sesFicha(s0);if(!f||!f.ex.length)return;
  var sid=dt+'_'+fid;
  if(!S.ses[sid]){S.ses[sid]={date:dt,fichaId:fid,fn:f.name,w:f.cycle||'',entries:{},fin:false};saveSes(sid)}
  S.ses[sid].fin=false;
  var first=0;for(var i=0;i<f.ex.length;i++){var e=entryFor(sid,f.ex[i].id);if(!(e&&(doneSets(e).length||e.cd||e.skip))){first=i;break}first=i}
  S.active={sid:sid,i:first,past:dt!==todayIso};S.summary=null;render();window.scrollTo(0,0);
}
function ensureEntry(sid,x){
  var s=S.ses[sid];if(!s.entries)s.entries={};
  var e=s.entries[x.id]||(s.entries[x.id]={sets:{}});var m=planMeta(x);
  e.n=x.name;e.g=exMg(x);e.tr=m.tr;e.nw=m.nw;if(!e.sets)e.sets={};return e;
}
function setField(sid,x,idx,patch){var e=ensureEntry(sid,x);var st=e.sets[idx]||(e.sets[idx]={});for(var k in patch)st[k]=patch[k];saveSes(sid);return e}
function entryPatch(sid,x,patch){var e=ensureEntry(sid,x);for(var k in patch)e[k]=patch[k];saveSes(sid);return e}

/* ---------- gráficos ---------- */
function niceStep(r){var p=Math.pow(10,Math.floor(Math.log(r)/Math.LN10)),f=r/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function topRound(x,y,w,h,r){r=Math.min(r,w/2,h);return 'M'+x+','+(y+h)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+w-r)+'Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+'V'+(y+h)+'Z'}
var CH=null;
function lineChart(pts,unit){
  var W=360,H=210,L=44,Rr=16,Tp=18,B=30,iw=W-L-Rr,ih=H-Tp-B;
  var vals=pts.map(function(p){return p.v}),mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  var pad=(mx-mn)*0.2||Math.max(mx*0.1,1);var lo=Math.max(0,mn-pad),hi=mx+pad,step=niceStep((hi-lo)/4);
  lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;if(hi===lo)hi=lo+step;
  var t0=fromIso(pts[0].d).getTime(),t1=fromIso(pts[pts.length-1].d).getTime(),span=t1-t0||1;
  function X(p){return L+(pts.length===1?iw/2:(fromIso(p.d).getTime()-t0)/span*iw)}
  function Y(v){return Tp+ih-(v-lo)/(hi-lo)*ih}
  var s='<svg class="ch" id="lc" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução ao longo do tempo">';
  for(var v=lo;v<=hi+step/1000;v+=step){s+='<line class="gl" x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="tx" x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+nf(v)+'</text>'}
  s+='<text class="tx" x="'+L+'" y="11">'+unit+'</text>';
  var ticks=pts.length>1?[0,Math.floor((pts.length-1)/2),pts.length-1]:[0];
  ticks.filter(function(v,i,a){return a.indexOf(v)===i}).forEach(function(i,j,a){s+='<text class="tx" x="'+X(pts[i])+'" y="'+(H-10)+'" text-anchor="'+(j===0&&a.length>1?'start':j===a.length-1&&a.length>1?'end':'middle')+'">'+fmt(pts[i].d,{day:'2-digit',month:'2-digit'})+'</text>'});
  s+='<polyline class="ln" points="'+pts.map(function(p){return X(p).toFixed(1)+','+Y(p.v).toFixed(1)}).join(' ')+'"/>';
  pts.forEach(function(p,i){var last=i===pts.length-1;s+='<circle class="pt" cx="'+X(p).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(last?5:4)+'"/>'});
  var lp=pts[pts.length-1];s+='<text class="tv" x="'+Math.min(X(lp),W-Rr-2).toFixed(1)+'" y="'+(Y(lp.v)-10).toFixed(1)+'" text-anchor="end">'+nf(lp.v)+'</text>';
  s+='<line class="xh" id="xh" y1="'+Tp+'" y2="'+(Tp+ih)+'" visibility="hidden"/><circle class="pt" id="xp" r="6" visibility="hidden"/></svg>';
  CH={pts:pts,W:W,X:pts.map(X),Y:pts.map(function(p){return Y(p.v)}),unit:unit};
  return s;
}
function freqChart(){
  var W=360,H=150,L=8,B=24,T=22,n=8,mon=monOf(todayIso),bars=[],mx=1;
  for(var i=n-1;i>=0;i--){var m=addDays(mon,-7*i),c=0;sesIds().forEach(function(id){var s=S.ses[id];if(monOf(s.date)===m&&sesDone(id)>0)c++});bars.push({m:m,c:c});if(c>mx)mx=c}
  var bw=26,gap=(W-L*2-bw*n)/(n-1),ih=H-T-B;
  var s='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Treinos por semana nas últimas 8 semanas"><line class="gl" x1="'+L+'" x2="'+(W-L)+'" y1="'+(T+ih)+'" y2="'+(T+ih)+'"/>';
  bars.forEach(function(b,i){var x=L+i*(bw+gap),h=b.c/mx*ih,tip=b.c+' treino'+(b.c===1?'':'s')+' na semana de '+fmt(b.m,{day:'2-digit',month:'2-digit'});
    if(b.c>0)s+='<path class="bar" data-tip="'+tip+'" d="'+topRound(x,T+ih-h,bw,h,4)+'"/><text class="tv" x="'+(x+bw/2)+'" y="'+(T+ih-h-5)+'" text-anchor="middle">'+b.c+'</text>';
    else s+='<rect data-tip="'+tip+'" x="'+x+'" y="'+(T+ih-2)+'" width="'+bw+'" height="2" fill="var(--line)"/>';
    s+='<text class="tx" x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+fmt(b.m,{day:'2-digit',month:'2-digit'})+'</text>'});
  return s+'</svg>';
}

function viewEvo(){
  var ev=S.ev,R=ev.range,names=exNames();
  var h='<div class="seg" role="group" aria-label="Período">'+[30,60,90,0].map(function(r){return '<button data-act="range" data-v="'+r+'" aria-pressed="'+(R===r)+'">'+(r?r+' dias':'Tudo')+'</button>'}).join('')+'</div>';
  if(!names.length)return h+'<div class="card"><div class="empty"><b>Ainda sem dados para analisar.</b> Registre alguns treinos e aqui aparecem gráficos de carga, volume por músculo, recordes e sugestões.</div></div>';

  /* período atual x anterior */
  var to=addDays(todayIso,1),from=R?addDays(todayIso,-R+1):'0000-00-00',cur=periodStats(from,to),pre=R?periodStats(addDays(from,-R),from):null;
  function dl(a,b){if(!pre)return '';var d=a-b;return '<span class="delta '+(d>=0?'up':'dn2')+'"> '+(d>=0?'+':'−')+nf(Math.abs(d))+'</span>'}
  h+='<div class="card"><div class="pad"><div class="kicker">'+(R?'Últimos '+R+' dias':'Todo o período')+(pre?' · vs. '+R+' dias antes':'')+'</div><div class="stat"><div><b>'+cur.t+dl(cur.t,pre&&pre.t)+'</b><span>treinos</span></div><div><b>'+cur.sets+dl(cur.sets,pre&&pre.sets)+'</b><span>séries de trabalho</span></div></div><div class="stat" style="grid-template-columns:1fr"><div><b>'+nf(cur.vol)+' kg'+dl(Math.round(cur.vol),pre&&Math.round(pre.vol))+'</b><span>volume total (carga × reps)</span></div></div></div></div>';

  /* recomendações */
  var recs=[],agg=weekAgg(monOf(todayIso)),pg=planGroups();
  var miss=pg.filter(function(g){return !agg[g]}).map(function(g){return MGN[g]});
  if(miss.length&&dow>=2)recs.push(['warn','Sem treino nesta semana: <b>'+miss.join(', ')+'</b>.']);
  var push=['peito','ombros','triceps'],pull=['costas','biceps'];
  var ps=push.reduce(function(a,g){return a+(agg[g]?agg[g].sets:0)},0),pl=pull.reduce(function(a,g){return a+(agg[g]?agg[g].sets:0)},0);
  if(Math.max(ps,pl)>=6&&Math.min(ps,pl)*2<Math.max(ps,pl))recs.push(['warn','Desequilíbrio nesta semana: <b>'+ps+'</b> séries de empurrar (peito, ombros, tríceps) contra <b>'+pl+'</b> de puxar (costas, bíceps).']);
  names.forEach(function(n){
    var sg=suggest(n,0,0,null),sl=stalled(n);
    if(sg.t==='up')recs.push(['ok','<b>'+esc(n)+'</b>: pronto para progredir, sugestão de '+nf(sg.kg)+' kg.']);
    else if(sg.t==='review')recs.push(['warn','<b>'+esc(n)+'</b>: reps abaixo da meta nas últimas 2 sessões. Considere manter ou revisar a carga.']);
    if(sl)recs.push(['warn','<b>'+esc(n)+'</b>: mesma carga e volume sem subir nos últimos 4 treinos. Vale variar reps, descanso ou exercício.']);
  });
  h+='<div class="card"><div class="pad"><div class="kicker">Recomendações</div>';
  if(recs.length)recs.slice(0,8).forEach(function(r){h+='<div class="rec"><i class="'+r[0]+'"></i><span>'+r[1]+'</span></div>'});
  else h+='<div class="sub">Nada a destacar agora. Continue registrando.</div>';
  h+='<div class="disc">Sugestões baseadas no seu histórico. Não são diagnóstico nem promessa de resultado, e não substituem a orientação de um profissional de educação física.</div></div></div>';

  /* gráfico por exercício */
  if(!ev.ex||names.indexOf(ev.ex)<0)ev.ex=names[0];
  var series=exSeries(ev.ex).filter(function(p){return !R||p.d>=from}),M=ev.metric,unit=M==='kg'?'kg':M==='reps'?'reps':'kg (volume)';
  h+='<div class="card"><div class="pad"><div class="kicker">Evolução por exercício</div><label class="field">EXERCÍCIO<select id="ev-ex" data-f="evex">'+names.map(function(n){return '<option'+(n===ev.ex?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select></label>';
  h+='<div class="seg" role="group" aria-label="Métrica">'+[['kg','Carga máx.'],['reps','Reps'],['vol','Volume']].map(function(m){return '<button data-act="metric" data-v="'+m[0]+'" aria-pressed="'+(M===m[0])+'">'+m[1]+'</button>'}).join('')+'</div>';
  if(series.length<2)h+='<div class="sub">'+(series.length?'Só 1 treino neste período ('+fmt(series[0].d,{day:'2-digit',month:'2-digit'})+': '+series[0].det+').':'Nenhum treino deste exercício no período.')+' O gráfico aparece com 2 ou mais treinos.</div>';
  else{
    var pts=series.map(function(p){return {d:p.d,v:p[M],det:p.det}});
    if(ev.table){h+='<table class="tbl"><tr><th>Data</th><th>Valor</th><th>Séries</th></tr>'+pts.map(function(p){return '<tr><td>'+fmt(p.d,{day:'2-digit',month:'2-digit'})+'</td><td>'+nf(p.v)+'</td><td>'+esc(p.det)+'</td></tr>'}).join('')+'</table>'}
    else h+=lineChart(pts,unit);
    h+='<button class="btn sm" data-act="table">'+(ev.table?'Ver gráfico':'Ver como tabela')+'</button>';
  }
  h+='</div></div>';

  /* volume por músculo */
  var lastAgg=weekAgg(addDays(monOf(todayIso),-7)),keys=Object.keys(agg).sort(function(a,b){return agg[b].sets-agg[a].sets}),mx=1;
  keys.forEach(function(k){if(agg[k].sets>mx)mx=agg[k].sets});
  h+='<div class="card"><div class="pad"><div class="kicker">Séries por músculo · esta semana</div>';
  if(!keys.length)h+='<div class="sub">Nenhuma série registrada nesta semana.</div>';
  keys.forEach(function(k){var a=agg[k],p=lastAgg[k]?lastAgg[k].sets:0,d=a.sets-p;
    h+='<div class="grow" data-tip="'+esc((MGN[k]||'Outros')+': '+a.sets+' séries, '+nf(a.vol)+' kg de volume. Semana passada: '+p+' séries.')+'"><span>'+esc(MGN[k]||'Outros')+'</span><div class="tr"><span style="width:'+Math.round(a.sets/mx*100)+'%"></span></div><span class="v">'+a.sets+' sér. <span class="'+(d>=0?'up':'dn2')+'">'+(d===0?'=':(d>0?'+':'−')+Math.abs(d))+'</span></span></div>'});
  h+='<div class="sub">Séries de trabalho (sem aquecimento). Variação em relação à semana passada.</div></div></div>';

  /* frequência */
  h+='<div class="card"><div class="pad"><div class="kicker">Treinos por semana · 8 semanas</div>'+freqChart()+'</div></div>';

  /* recordes */
  h+='<div class="card"><div class="pad"><div class="kicker">Recordes pessoais</div>';
  names.slice(0,10).forEach(function(n){var r=records(n);
    h+='<div class="prl"><b>'+esc(n)+'</b><div class="chips">'+(r.kg&&r.kg.kg?'<span class="chip">Carga '+nf(r.kg.kg)+' kg × '+r.kg.reps+'</span>':'')+(r.reps?'<span class="chip">Reps '+r.reps.reps+(r.reps.kg?' a '+nf(r.reps.kg)+' kg':'')+'</span>':'')+(r.vol?'<span class="chip">Volume '+nf(r.vol.vol)+' kg</span>':'')+'</div></div>'});
  h+='</div></div>';
  return h;
}

/* ---------- tooltip ---------- */
function showTip(t,x,y){var e=$('#tip');e.textContent=t;e.hidden=false;var w=e.offsetWidth,l=Math.max(8,Math.min(window.innerWidth-w-8,x-w/2));e.style.left=l+'px';e.style.top=Math.max(8,y-e.offsetHeight-10)+'px'}
function hideTip(){$('#tip').hidden=true}
document.addEventListener('pointerover',function(ev){var t=ev.target.closest&&ev.target.closest('[data-tip]');if(!t)return;var r=t.getBoundingClientRect();showTip(t.getAttribute('data-tip'),r.left+r.width/2,r.top)});
document.addEventListener('pointerout',function(ev){if(ev.target.closest&&ev.target.closest('[data-tip]'))hideTip()});
document.addEventListener('pointermove',function(ev){
  var svg=ev.target.closest&&ev.target.closest('#lc');if(!svg||!CH){return}
  var r=svg.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*CH.W,bi=0,bd=1e9;
  CH.X.forEach(function(px,i){var d=Math.abs(px-x);if(d<bd){bd=d;bi=i}});
  var xh=$('#xh'),xp=$('#xp');xh.setAttribute('x1',CH.X[bi]);xh.setAttribute('x2',CH.X[bi]);xh.setAttribute('visibility','visible');xp.setAttribute('cx',CH.X[bi]);xp.setAttribute('cy',CH.Y[bi]);xp.setAttribute('visibility','visible');
  var p=CH.pts[bi];showTip(fmt(p.d,{day:'2-digit',month:'short'})+' · '+nf(p.v)+' '+CH.unit+(p.det?' ('+p.det+')':''),r.left+CH.X[bi]/CH.W*r.width,r.top+CH.Y[bi]/210*r.height);
});
document.addEventListener('pointerleave',function(ev){if(ev.target&&ev.target.id==='lc'){hideTip();var a=$('#xh'),b=$('#xp');a&&a.setAttribute('visibility','hidden');b&&b.setAttribute('visibility','hidden')}},true);

/* ---------- cronômetro ---------- */
var T=null,tick=null;
function fmtT(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function startTimer(sec,label){T={end:Date.now()+sec*1000};$('#timerbar').hidden=false;$('#tlab').textContent='Descanso'+(label?' · '+label:'');clearInterval(tick);tick=setInterval(upT,250);upT()}
function upT(){if(!T)return;var left=(T.end-Date.now())/1000;$('#tval').textContent=fmtT(left);
  if(left<=0){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}$('#tlab').textContent='Descanso terminou';clearInterval(tick);setTimeout(stopT,4000)}}
function stopT(){clearInterval(tick);T=null;$('#timerbar').hidden=true}

/* ---------- eventos ---------- */
function actEx(){var s=S.ses[S.active.sid],f=sesFicha(s);return {s:s,f:f,x:f.ex[S.active.i]}}
function readInputs(k){var kg=document.querySelector('input[data-f="kg"][data-k="'+k+'"]'),rp=document.querySelector('input[data-f="reps"][data-k="'+k+'"]');return {kg:kg?kg.value:'',reps:rp?rp.value:''}}

document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,id=b.dataset.id;
  if(libClick(a,b,id,ev)||xpClick(a,b)||mkClick(a,b,id)||tdClick(a,b,id)||pkClick(a,b,id)||skClick(a)||lateClick(a,b)||bkClick(a)||blkClick(a,b)||offClick(a,b)||planClick(a,b)||pastClick(a,b)||balClick(a,b)||bdClick(a,b)||paClick(a)||dyClick(a,b))return;
  if(a==='view'){S.view=b.dataset.v;S.lib.open=null;S.lib.form=null;S.mk.open=false;S.swap=null;S.ficha=null;S.form=null;S.confirm=null;S.summary=null;hideTip();render();window.scrollTo(0,0)}
  else if(a==='week'){S.week=b.dataset.v;weekTouched=true;saveCfg();render()}
  else if(a==='start'){startWorkout(id,b.dataset.date)}
  else if(a==='seesum'){S.summary=id;render();window.scrollTo(0,0)}
  else if(a==='closesum'){S.summary=null;render()}
  else if(a==='openficha'){if(!id)return;S.view='fichas';S.ficha=id;S.form=null;S.confirm=null;render();window.scrollTo(0,0)}
  else if(a==='back'){S.ficha=null;S.form=null;S.confirm=null;render()}
  else if(a==='newficha'){S.form={mode:'newficha'};render();var n=$('#f-fname');n&&n.focus()}
  else if(a==='savenew'){
    var nm=$('#f-fname').value.trim();if(!nm){$('#f-fname').focus();return}
    var nid='u'+Date.now().toString(36);S.over[nid]={id:nid,name:nm,sub:$('#f-fsub').value.trim(),cycle:null,day:null,ex:[]};S.form=null;S.ficha=nid;saveCfg();render();
  }
  else if(a==='cancel'){S.form=null;render()}
  else if(a==='add'){S.form={mode:'add'};render();var n2=$('#f-name');n2&&n2.focus()}
  else if(a==='edit'){S.form={mode:'edit',id:id};render()}
  else if(a==='save'){
    var name=$('#f-name').value.trim();if(!name){$('#f-name').focus();return}
    var rec={name:name,sets:$('#f-sets').value.trim(),load:$('#f-load').value.trim(),rest:$('#f-rest').value.trim(),mg:$('#f-mg').value},mode=S.form.mode,eid=S.form.id;
    editFicha(S.ficha,function(f){if(mode==='add'){rec.id='u'+Date.now().toString(36);f.ex.push(rec)}else{f.ex=f.ex.map(function(x){return x.id===eid?Object.assign({},x,rec):x})}});
    S.form=null;render();
  }
  else if(a==='up'||a==='dn'){editFicha(S.ficha,function(f){var i=f.ex.findIndex(function(x){return x.id===id}),j=a==='up'?i-1:i+1;if(i<0||j<0||j>=f.ex.length)return;var t=f.ex[i];f.ex[i]=f.ex[j];f.ex[j]=t});render()}
  else if(a==='del'){if(S.confirm!==id){S.confirm=id;render();return}editFicha(S.ficha,function(f){f.ex=f.ex.filter(function(x){return x.id!==id})});S.confirm=null;render()}
  else if(a==='reset'){if(S.confirm!=='reset'){S.confirm='reset';render();return}delete S.over[id];S.confirm=null;saveCfg();render()}
  else if(a==='delficha'){if(S.confirm!=='delficha'){S.confirm='delficha';render();return}S.over[id]={id:id,deleted:true};S.ficha=null;S.confirm=null;saveCfg();render()}
  else if(a==='hopen'){S.openHist=S.openHist===id?null:id;S.confirm=null;render()}
  else if(a==='delses'){if(S.confirm!==id){S.confirm=id;render();return}delete S.ses[id];delSes(id);S.confirm=null;S.openHist=null;render()}
  else if(a==='range'){S.ev.range=+b.dataset.v;hideTip();render()}
  else if(a==='metric'){S.ev.metric=b.dataset.v;hideTip();render()}
  else if(a==='table'){S.ev.table=!S.ev.table;hideTip();render()}
  /* modo treino */
  else if(a==='setok'){
    var k=+b.dataset.k,c=actEx(),v=readInputs(k),en0=c.s.entries&&c.s.entries[c.x.id],cur=en0&&en0.sets&&en0.sets[k],was=!!(cur&&cur.d),pl=planWithExtra(c.x,en0).sets[k];
    setField(S.active.sid,c.x,k,{kg:v.kg,reps:v.reps,d:!was,w:!!(pl&&pl.warm)});
    if(!was){var sec=restSec(c.x.rest);if(sec&&!S.active.past)startTimer(sec,c.x.rest)}
    render();
  }
  else if(a==='apply'){
    var c1=actEx(),en1=c1.s.entries&&c1.s.entries[c1.x.id],pl1=planWithExtra(c1.x,en1).sets,kgs=nf(+b.dataset.kg);
    pl1.forEach(function(p,k){var st=en1&&en1.sets&&en1.sets[k];if(p.warm||(st&&st.d))return;setField(S.active.sid,c1.x,k,{kg:kgs})});render();
  }
  else if(a==='cardio'){var c2=actEx(),en=c2.s.entries&&c2.s.entries[c2.x.id],m=document.querySelector('input[data-f="cmin"]');entryPatch(S.active.sid,c2.x,{cd:!(en&&en.cd),min:m?m.value:''});render()}
  else if(a==='addset'){var c3=actEx(),en3=c3.s.entries&&c3.s.entries[c3.x.id];entryPatch(S.active.sid,c3.x,{extra:((en3&&en3.extra)||0)+1});render()}
  else if(a==='next'){S.endc=0;S.active.i++;render();window.scrollTo(0,0)}
  else if(a==='prev'){S.active.i--;render();window.scrollTo(0,0)}
  else if(a==='pause'){S.active=null;S.view='hoje';render()}
  else if(a==='finish'){var sid=S.active.sid;S.ses[sid].fin=true;saveSes(sid);S.active=null;S.summary=sid;stopT();render();window.scrollTo(0,0)}
  else if(a==='tadd'){if(T){T.end+=15000;upT()}}
  else if(a==='tstop'){stopT()}
});
document.addEventListener('change',function(ev){var t=ev.target;if(t.dataset&&t.dataset.f==='evex'){S.ev.ex=t.value;render()}});
document.addEventListener('input',function(ev){
  var t=ev.target,f=t.dataset&&t.dataset.f;if(t.id==='xp-q'){if(S.xp){S.xp.q=t.value;var _r=$('#xp-res');if(_r)_r.innerHTML=xpListHtml()}return}if(t.id==='td-q'){S.td.q=t.value;var r=$('#td-res');if(r)r.innerHTML=tdSearchHtml();return}if(libInput(t,f))return;if(!f)return;
  if(f==='fname'){var fid=S.ficha;if(fid){var nv=t.value;editFicha(fid,function(ff){ff.name=nv})}return}
  if(!S.active)return;var c=actEx();
  if(f==='bkg'||f==='brp'){blkInput(t,f);return}
  if(f==='kg'||f==='reps'){var p={};p[f]=t.value;setField(S.active.sid,c.x,+t.dataset.k,p)}
  else if(f==='note')entryPatch(S.active.sid,c.x,{note:t.value});
  else if(f==='cmin')entryPatch(S.active.sid,c.x,{min:t.value});
});

beginner","pm":["chest"],"sm":[],"mc":"isolation","ins":["Sit on the machine with your back flat on the pad.","Take hold of the handles. Tip: Your upper arms should be positioned parallel to the floor; adjust the machine accordingly. This will be your starting position.","Push the handles together slowly as you squeeze your chest in the middle. Breathe out during this part of the motion and hold the contraction for a second.","Return back to the starting position slowly as you inhale until your chest muscles are fully stretched.","Repeat for the recommended amount of repetitions."],"sh":0,"p":4,"fo":"pull","pt":"Voador (peck deck)"},{"id":"Cable_Chest_Press","n":"Cable Chest Press","eq":"cable","lv":"beginner","pm":["chest"],"sm":["shoulders","triceps"],"mc":"compound","ins":["Adjust the weight to an appropriate amount and be seated, grasping the handles. Your upper arms should be about 45 degrees to the body, with your head and chest up. The elbows should be bent to about 90 degrees. This will be your starting position.","Begin by extending through the elbow, pressing the handles together straight in front of you. Keep your shoulder blades retracted as you execute the movement.","After pausing at full extension, return to th starting position, keeping tension on the cables.","You can also execute this movement with your back off the pad, at an incline or decline, or alternate hands."],"sh":0,"p":5,"fo":"push","pt":"Supino na polia"},{"id":"Cable_Crossover","n":"Cable Crossover","eq":"cable","lv":"beginner","pm":["chest"],"sm":["shoulders"],"mc":"isolation","ins":["To get yourself into the starting position, place the pulleys on a high position (above your head), select the resistance to be used and hold the pulleys in each hand.","Step forward in front of an imaginary straight line between both pulleys while pulling your arms together in front of you. Your torso should have a small forward bend from the waist. This will be your starting position.","With a slight bend on your elbows in order to prevent stress at the biceps tendon, extend your arms to the side (straight out at both sides) in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms and torso should remain stationary; the movement should only occur at the shoulder joint.","Return your arms back to the starting position as you breathe out. Make sure to use the same arc of motion used to lower the weights.","Hold for a second at the starting position and repeat the movement for the prescribed amount of repetitions."],"sh":0,"p":6,"fo":"push","pt":"Crucifixo na polia (crossover)"},{"id":"Cable_Crunch","n":"Cable Crunch","eq":"cable","lv":"beginner","pm":["abdominals"],"sm":[],"mc":"isolation","ins":["Kneel below a high pulley that contains a rope attachment.","Grasp cable rope attachment and lower the rope until your hands are placed next to your face.","Flex your hips slightly and allow the weight to hyperextend the lower back. This will be your starting position.","With the hips stationary, flex the waist as you contract the abs so that the elbows travel towards the middle of the thighs. Exhale as you perform this portion of the movement and hold the contraction for a second.","Slowly return to the starting position as you inhale. Tip: Make sure that you keep constant tension on the abs throughout the movement. Also, do not choose a weight so heavy that the lower back handles the brunt of the work.","Repeat for the recommended amount of repetitions."],"sh":0,"p":7,"fo":"pull","pt":"Abdominal na polia"},{"id":"Cable_Deadlifts","n":"Cable Deadlifts","eq":"cable","lv":"beginner","pm":["quadriceps"],"sm":["forearms","glutes","hamstrings","lower back"],"mc":"compound","ins":["Move the cables to the bottom of the towers and select an appropriate weight. Stand directly in between the uprights.","To begin, squat down be flexing your hips and knees until you can reach the handles.","After grasping them, begin your ascent. Driving through your heels extend your hips and knees keeping your hands hanging at your side. Keep your head and chest up throughout the movement.","After reaching a full standing position, Return to the starting position and repeat."],"sh":0,"p":8,"fo":"pull","pt":"Levantamento terra na polia"},{"id":"Cable_Hammer_Curls_-_Rope_Attachment","n":"Cable Hammer Curls - Rope Attachment","eq":"cable","lv":"beginner","pm":["biceps"],"sm":[],"mc":"isolation","ins":["Attach a rope attachment to a low pulley and stand facing the machine about 12 inches away from it.","Grasp the rope with a neutral (palms-in) grip and stand straight up keeping the natural arch of the back and your torso stationary.","Put your elbows in by your side and keep them there stationary during the entire movement. Tip: Only the forearms should move; not your upper arms. This will be your starting position.","Using your biceps, pull your arms up as you exhale until your biceps touch your forearms. Tip: Remember to keep the elbows in and your upper arms stationary.","After a 1 second contraction where you squeeze your biceps, slowly start to bring the weight back to the original position.","Repeat for the recommended amount of repetitions."],"sh":0,"p":9,"fo":"pull","pt":"Rosca martelo na polia com corda"},{"id":"Cable_Hip_Adduction","n":"Cable Hip Adduction","eq":"cable","lv":"beginner","pm":["quadriceps"],"sm":[],"mc":"isolation","ins":["Stand in front of a low pulley facing forward with one leg next to the pulley and the other one away.","Attach the ankle cuff to the cable and also to the ankle of the leg that is next to the pulley.","Now step out and away from the stack with a wide stance and grasp the bar of the pulley system.","Stand on the foot that does not have the ankle cuff (the far foot) and allow the leg with the cuff to be pulled towards the low pulley. This will be your starting position.","Now perform the movement by moving the leg with the ankle cuff in front of the far leg by using the inner thighs to abduct the hip. Breathe out during this portion of the movement.","Slowly return to the starting position as you breathe in.","Repeat for the recommended amount of repetitions and then repeat the same movement with the opposite leg."],"sh":0,"p":10,"fo":"pull","pt":"Adução de quadril na polia"},{"id":"Cable_Incline_Pushdown","n":"Cable Incline Pushdown","eq":"cable","lv":"beginner","pm":["lats"],"sm":[],"mc":"isolation","ins":["Lie on incline an bench facing away from a high pulley machine that has a straight bar attachment on it.","Grasp the straight bar attachment overhead with a pronated (overhand; palms down) shoulder width grip and extend your arms in front of you. The bar should be around 2 inches away from your upper thighs. This will be your starting position.","Keeping the upper arms stationary, lift your arms back in a semi circle until the bar is straight over your head. Breathe in during this portion of the movement.","Slowly go back to the starting position using your lats and hold the contraction once you reach the starting position. Breathe out during the execution of this movement.","Repeat for the recommended amount of repetitions."],"sh":0,"p":11,"fo":"pull","pt":"Tríceps na polia inclinado"},{"id":"Cable_Incline_Triceps_Extension","n":"Cable Incline Triceps Extension","eq":"cable","lv":"beginner","pm":["triceps"],"sm":[],"mc":"isolation","ins":["Lie on incline an bench facing away from a high pulley machine that has a straight bar attachment on it.","Grasp the straight bar attachment overhead with a pronated (overhand; palms down) narrow grip (less than shoulder width) and keep your elbows tucked in to your sides. Your upper arms should create around a 25 degree angle when measured from the floor.","Keeping the upper arms stationary, extend the arms as you flex the triceps. Breathe out during this portion of the movement and hold the contraction for a second.","Slowly go back to the starting position.","Repeat for the recommended amount of repetitions."],"sh":0,"p":12,"fo":"push","pt":"Extensão de tríceps na polia no banco inclinado"},{"id":"Cable_Internal_Rotation","n":"Cable Internal Rotation","eq":"cable","lv":"beginner","pm":["shoulders"],"sm":[],"mc":"compound","ins":["Sit next to a low pulley sideways (with legs stretched in front of you or crossed) and grasp the single hand cable attachment with the arm nearest to the cable. Tip: If you can adjust the pulley's height, you can use a flat bench to sit on instead.","Position the elbow against your side with the elbow bent at 90° and the arm pointing towards the pulley. This will be your starting position.","Pull the single hand cable attachment toward your body by internally rotating your shoulder until your forearm is across your abs. You will be creating an imaginary semi-circle. Tip: The forearm should be perpendicular to your torso at all times.","Slowly go back to the initial position.","Repeat for the recommended amount of repetitions and then repeat the movement with the next arm."],"sh":0,"p":13,"fo":"pull","pt":"Rotação interna na polia"},{"id":"Cable_Iron_Cross","n":"Cable Iron Cross","eq":"cable","lv":"beginner","pm":["chest"],"sm":[],"mc":"isolation","ins":["Begin by moving the pulleys to the high position, select the resistance to be used, and take a handle in each hand.","Stand directly between both pulleys with your arms extended out to your sides. Your head and chest should be up while your arms form a \"T\". This will be your starting position.","Keeping the elbows extended, pull your arms straight to your sides.","Return your arms back to the starting position after a pause at the peak contraction.","Continue the movement for the prescribed number of repetitions."],"sh":0,"p":14,"fo":"push","pt":"Cruz de ferro na polia"},{"id":"Cable_Judo_Flip","n":"Cable Judo Flip","eq":"cable","lv":"beginner","pm":["abdominals"],"sm":[],"mc":"compound","ins":["Connect a rope attachment to a tower, and move the cable to the lowest pulley position. Stand with your side to the cable with a wide stance, and grab the rope with both hands.","Twist your body away from the pulley as you bring the rope over your shoulder like you're performing a judo flip.","Shift your weight between your feet as you twist and crunch forward, pulling the cable downward.","Return to the starting position and repeat until failure.","Then, reposition and repeat the same series of movements on the opposite side."],"sh":0,"p":15,"fo":"pull","pt":"Giro de judô na polia"},{"id":"Cable_Lying_Triceps_Extension","n":"Cable Lying Triceps Extension","eq":"cable","lv":"beginner","pm":["triceps"],"sm":[],"mc":"isolation","ins":["Lie on a flat bench and grasp the straight bar attachment of a low pulley with a narrow overhand grip. Tip: The easiest way to do this is to have someone hand you the bar as you lay down.","With your arms extended, position the bar over your torso. Your arms and your torso should create a 90-degree angle. This will be your starting position.","Lower the bar by bending at the elbow while keeping the upper arms stationary and elbows in. Go down until the bar lightly touches your forehead. Breathe in as you perform this portion of the movement.","Flex the triceps as you lift the bar back to its starting position. Exhale as you perform this portion of the movement.","Hold for a second at the contracted position and repeat for the recommended amount of repetitions."],"sh":0,"p":16,"fo":"push","pt":"Tríceps testa na polia deitado"},{"id":"Cable_One_Arm_Tricep_Extension","n":"Cable One Arm Tricep Extension","eq":"cable","lv":"beginner","pm":["triceps"],"sm":[],"mc":"isolation","ins":["With your right hand, grasp a single handle attached to the high-cable pulley using a supinated (underhand; palms facing up) grip. You should be standing directly in front of the weight stack.","Now pull the handle down so that your upper arm and elbow are locked in to the side of your body. Your upper arm and forearm should form an acute angle (less than 90-degrees). You can keep the other arm by the waist and you can have one leg in front of you and the other one back for better balance. This will be your starting position.","As you contract the triceps, move the single handle attachment down to your side until your arm is straight. Breathe out as you perform this movement. Tip: Only the forearms should move. Your upper arms should remain stationary at all times.","Squeeze the triceps and hold for a second in this contracted position.","Slowly return the handle to the starting position.","Repeat for the recommended amount of repetitions and then perform the same movement with the other arm."],"sh":0,"p":17,"fo":"push","pt":"Extensão de tríceps unilateral na polia"},{"id":"Cable_Preacher_Curl","n":"Cable Preacher Curl","eq":"cable","lv":"beginner","pm":["biceps"],"sm":["forearms"],"mc":"isolation","ins":["Place a preacher bench about 2 feet in front of a pulley machine.","Attach a straight bar to the low pulley.","Sit at the preacher bench with your elbow and upper arms firmly on top of the bench pad and have someone hand you the bar from the low pulley.","Grab the bar and fully extend your arms on top of the preacher bench pad. This will be your starting position.","Now start pilling the weight up towards your shoulders and squeeze the biceps hard at the top of the movement. Exhale as you perform this motion. Also, hold for a second at the top.","Now slowly lower the weight to the starting position.","Repeat for the recommended amount of repetitions."],"sh":0,"p":18,"fo":"pull","pt":"Rosca Scott na polia"},{"id":"Cable_Rear_Delt_Fly","n":"Cable Rear Delt Fly","eq":"cable","lv":"beginner","pm":["shoulders"],"sm":[],"mc":"isolation","ins":["Adjust the pulleys to the appropriate height and adjust the weight. The pulleys should be above your head.","Grab the left pulley with your right hand and the right pulley with your left hand, crossing them in front of you. This will be your starting position.","Initiate the movement by moving your arms back and outward, keeping your arms straight as you execute the movement.","Pause at the end of the motion before returning the handles to the start position."],"sh":0,"p":19,"fo":"pull","pt":"Crucifixo inverso na polia"},{"id":"Cable_Reverse_Crunch","n":"Cable Reverse Crunch","eq":"cable","lv":"beginner","pm":["abdominals"],"sm":[],"mc":"isolation","ins":["Connect an ankle strap attachment to a low pulley cable and position a mat on the floor in front of it.","Sit down with your feet toward the pulley and attach the cable to your ankles.","Lie down, elevate your legs and bend your knees at a 90-degree angle. Your legs and the cable should be aligned. If not, adjust the pulley up or down until they are.","With your hands behind your head, bring your knees inward to your torso and elevate your hips off the floor.","Pause for a moment and in a slow and controlled manner drop your hips and bring your legs back to the starting 90-degree angle. You should still have tension on your abs in the resting position.","Repeat the same movement to failure."],"sh":0,"p":20,"fo":"pull","pt":"Abdominal infra na polia"},{"id":"Cable_Rope_Overhead_Triceps_Extension","n":"Cable Rope Overhead Triceps Extension","eq":"cable","lv":"beginner","pm":["triceps"],"sm":[],"mc":"isolation","ins":["Attach a rope to the bottom pulley of the pulley machine.","Grasping the rope with both hands, extend your arms with your hands directly above your head using a neutral grip (palms facing each other). Your elbows should be in close to your head and the arms should be perpendicular to the floor with the knuckles aimed at the ceiling. This will be your starting position.","Slowly lower the rope behind your head as you hold the upper arms stationary. Inhale as you perform this movement and pause when your triceps are fully stretched.","Return to the starting position by flexing your triceps as you breathe out.","Repeat for the recommended amount of repetitions."],"sh":0,"p":21,"fo":"push","pt":"Tríceps francês na polia com corda"},{"id":"Cable_Rope_Rear-Delt_Rows","n":"Cable Rope Rear-Delt Rows","eq":"cable","lv":"beginner","pm":["shoulders"],"sm":["biceps","middle back"],"mc":"compound","ins":["Sit in the same position on a low pulley row station as you would if you were doing seated cable rows for the back.","Attach a rope to the pulley and grasp it with an overhand grip. Your arms should be extended and parallel to the floor with the elbows flared out.","Keep your lower back upright and slide your hips back so that your knees are slightly bent. This will be your starting position.","Pull the cable attachment towards your upper chest, just below the neck, as you keep your elbows up and out to the sides. Continue this motion as you exhale until the elbows travel slightly behind the back. Tip: Keep your upper arms horizontal, perpendicular to the torso and parallel to the floor throughout the motion.","Go back to the initial position where the arms are extended and the shoulders are stretched forward. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."],"sh":0,"p":22,"fo":"pull","pt":"Remada alta para deltoide posterior na polia com corda"},{"id":"Cable_Russian_Twists","n":"Cable Russian Twists","eq":"cable","lv":"beginner","pm":["abdominals"],"sm":[],"mc":"compound","ins":["Connect a standard handle attachment, and position the cable to a middle pulley position.","Lie on a stability ball perpendicular to the cable and grab the handle with one hand. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable.","Grab the handle with both hands and fully extend your arms above your chest. You hands should be directly in-line with the pulley. If not, adjust the pulley up or down until they are.","Keep your hips elevated and abs engaged. Rotate your torso away from the pulley for a full-quarter rotation. Your body should be flat from head to knees.","Pause for a moment and in a slow and controlled manner reset to the starting position. You should still have side tension on the cable in the resting position.","Repeat the same movement to failure.","Then, reposition and repeat the same series of movements on the opposite side."],"sh":0,"p":23,"fo":"pull","pt":"Rotação russa na polia"},{"id":"Cable_Seated_Crunch","n":"Cable Seated Crunch","eq":"cable","lv":"beginner","pm":["abdominals"],"sm":[],"mc":"isolation","ins":["Seat on a flat bench with your back facing a high pulley.","Grasp the cable rope attachment with both hands (with the palms of the hands facing each other) and place your hands securely over both shoulders. Tip: Allow the weight to hyperextend the lower back slightly. This will be your starting position.","With the hips stationary, flex the waist so the elbows travel toward the hips. Breathe out as you perform this step.","As you inhale, go back to the initial position slowly.","Repeat for the recommended amount of repetitions."],"sh":1,"p":0,"fo":"pull","pt":"Abdominal sentado na polia"},{"id":"Cable_Seated_Lateral_Raise","n":"Cable Seated Lateral Raise","eq":"cable","lv":"beginner","pm":["shoulders"],"sm":["middle back","traps"],"mc":"isolation","ins":["Stand in the middle of two low pulleys that are opposite to each other and place a flat bench right behind you (in perpendicular fashion to you; the narrow edge of the bench should be the one behind you). Select the weight to be used on each pulley.","Now sit at the edge of the flat bench behind you with your feet placed in front of your knees.","Bend forward while keeping your back flat and rest your torso on the thighs.","Have someone give you the single handles attached to the pulleys. Grasp the left pulley with the right hand and the right pulley with the left after you select your weight. The pulleys should run under your knees and your arms will be extended with palms facing each other and a slight bend at the elbows. This will be the starting position.","While keeping the arms stationary, raise the upper arms to the sides until they are parallel to the floor and at shoulder height. Exhale during the execution of this movement and hold the contraction for a second.","Slowly lower your arms to the starting position as you inhale.","Repeat for the recommended amount of repetitions. Tip: Maintain upper arms perpendicular to torso and a fixed elbow position (10 degree to 30 degree angle) throughout exercise."],"sh":1,"p":1,"fo":"pull","pt":"Elevação lateral sentado na polia"},{"id":"Cable_Shoulder_Press","n":"Cable Shoulder Press","eq":"cable","lv":"beginner","pm":["shoulders"],"sm":["triceps"],"mc":"compound","ins":["Move the cables to the bottom of the towers and select an appropriate weight.","Stand directly in between the uprights. Grasp the cables and hold them at shoulder height, palms facing forward. This will be your starting position.","Keeping your head and chest up, extend through the elbow to press the handles directly over head.","After pausing at the top, return to the starting position and repeat."],"sh":1,"p":2,"fo":"push","pt":"Desenvolvimento na polia"},{"id":"Cable_Shrugs","n":"Cable Shrugs","eq":"cable","lv":"beginner","pm":["traps"],"sm":[],"mc":"isolation","ins":["Grasp a cable bar attachment that is attached to a low pulley with a shoulder width or slightly wider overhand (palms facing down) grip.","Stand erect close to the pulley with your arms extended in front of you holding the bar. This will be your starting position.","Lift the bar by elevating the shoulders as high as possible as you exhale. Hold the contraction at the top for a second. Tip: The arms should remain extended at all times. Refrain from using the biceps to help lift the bar. Only the shoulders should be moving up and down.","Lower the bar back to the original position.","Repeat for the recommended amount of repetitions."],"sh":1,"p":3,"fo":"pull","pt":"Encolhimento na polia"},{"id":"Cable_Wrist_Curl","n":"Cable Wrist Curl","eq":"cable","lv":"beginner","pm":["forearms"],"sm":[],"mc":"isolation","ins":["Start out by placing a flat bench in front of a low pulley cable that has a straight bar attachment.","Use your arms to grab the cable bar with a narrow to shoulder width supinated grip (palms up) and bring them up so that your forearms are resting against the top of your thighs. Your wrists should be hanging just beyond your knees.","Start out by curling your wrist upwards and exhaling. Keep the contraction for a second.","Slowly lower your wrists back down to the starting position while inhaling.","Your forearms should be stationary as your wrist is the only movement needed to perform this exercise.","Repeat for the recommended amount of repetitions."],"sh":1,"p":4,"fo":"pull","pt":"Rosca de punho na polia"},{"id":"Calf-Machine_Shoulder_Shrug","n":"Calf-Machine Shoulder Shrug","eq":"machine","lv":"beginner","pm":["traps"],"sm":[],"mc":"isolation","ins":["Position yourself on the calf machine so that the shoulder pads are above your shoulders. Your torso should be straight with the arms extended normally by your side. This will be your starting position.","Raise your shoulders up towards your ears as you exhale and hold the contraction for a full second.","Slowly return to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"sh":1,"p":5,"fo":"pull","pt":"Encolhimento na máquina de panturrilha"},{"id":"Calf_Press","n":"Calf Press","eq":"machine","lv":"beginner","pm":["calves"],"sm":[],"mc":"isolation","ins":["Adjust the seat so that your legs are only slightly bent in the start position. The balls of your feet should be firmly on the platform.","Select an appropriate weight, and grasp the handles. This will be your starting position.","Straighten the legs by extending the knees, just barely lifting the weight from the stack. Your ankle should be fully flexed, toes pointing up. Execute the movement by pressing downward through the balls of your feet as far as possible.","After a brief pause, reverse the motion and repeat."],"sh":1,"p":6,"fo":"push","pt":"Panturrilha no leg press"},{"id":"Calf_Press_On_The_Leg_Press_Machine","n":"Calf Press On The Leg Press Machine","eq":"machine","lv":"beginner","pm":["calves"],"sm":[],"mc":"isolation","ins":["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a medium (shoulder width) foot stance.","Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you without locking your knees. (Note: In some leg press units you can leave the safety bars on for increased safety. If your leg press unit allows for this, then this is the preferred method of performing the exercise.) Your torso and the legs should make perfect 90-degree angle. Now carefully place your toes and balls of your feet on the lower portion of the platform with the heels extending off. Toes should be facing forward, outwards or inwards as described at the beginning of the chapter. This will be your starting position.","Press on the platform by raising your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.","Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.","Repeat for the recommended amount of repetitions."],"sh":1,"p":7,"fo":"push","pt":"Panturrilha na máquina de leg press"},{"id":"Chair_Squat","n":"Chair Squat","eq":"machine","lv":"beginner","pm":["quadriceps"],"sm":["calves","glutes","hamstrings"],"mc":"compound","ins":["To begin, first set the bar to a position that best matches your height. Once the bar is loaded, step under it and position it across the back of your shoulders.","Take the bar with your hands facing forward, unlock it and lift it off the rack by extending your legs.","Move your feet forward about 18 inches in front of the bar. Position your legs using a shoulder width stance with the toes slightly pointed out. Look forward at all times and maintain a neutral or slightly arched spine. This will be your starting position.","Slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper and lower leg breaks 90 degrees.","Begin to raise the bar as you exhale by pushing the floor with the heels of your feet, extending the knees and returning to the starting position.","Repeat for the recommended amount of repetitions."],"sh":1,"p":8,"fo":"push","pt":"Agachamento na cadeira"},{"id":"Close-Grip_Front_Lat_Pulldown","n":"Close-Grip Front Lat Pulldown","eq":"cable","lv":"beginner","pm":["lats"],"sm":["biceps","middle back","shoulders"],"mc":"compound","ins":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you - while holding the bar at the chosen grip width - bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, bring the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary (only the arms should move). The forearms should do no other work except for holding the bar; therefore do not try to pull the bar down using the forearms.","After a second in the contracted position, while squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.","6. Repeat this motion for the prescribed amount of repetitions."],"sh":1,"p":9,"fo":"pull","pt":"Puxada frontal com pegada fechada"},{"id":"Decline_Smith_Press","n":"Decline Smith Press","eq":"machine","lv":"beginner","pm":["chest"],"sm":["shoulders","triceps"],"mc":"compound","ins":["Place a decline bench underneath the Smith machine. Now place the barbell at a height that you can reach when lying down and your arms are almost fully extended. Using a pronated grip that is wider than shoulder width, unlock the bar from the rack and hold it straight over you with your arms extended. This will be your starting position.","As you inhale, lower the bar under control by allowing the elbows to flex, lightly contacting the torso.","After a brief pause, bring the bar back to the starting position by extending the elbows, exhaling as you do so.","Repeat the movement for the prescribed amount of repetitions.","When the set is complete, lock the bar back in the rack."],"sh":1,"p":10,"fo":"push","pt":"Supino declinado na barra guiada (Smith)"},{"id":"Dip_Machine","n":"Dip Machine","eq":"machine","lv":"beginner","pm":["triceps"],"sm":["chest","shoulders"],"mc":"compound","ins":["Sit securely in a dip machine, select the weight and firmly grasp the handles.","Now keep your elbows in at your sides in order to place emphasis on the triceps. The elbows should be bent at a 90 degree angle.","As you contract the triceps, extend your arms downwards as you exhale. Tip: At the bottom of the movement, focus on keeping a little bend in your arms to keep tension on the triceps muscle.","Now slowly let your arms come back up to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"sh":1,"p":11,"fo":"push","pt":"Paralelas na máquina"},{"id":"Elevated_Cable_Rows","n":"Elevated Cable Rows","eq":"cable","lv":"intermediate","pm":["lats"],"sm":["middle back","traps"],"mc":"compound","ins":["Get a platform of some sort (it can be an aerobics or calf raise platform) that is around 4-6 inches in height.","Place it on the seat of the cable row machine.","Sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.","Lean over as you keep the natural alignment of your back and grab the V-bar handles.","With your arms extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lats as you hold the bar in front of you. This is the starting position of the exercise.","Keeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it until you touch the abdominals. Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard. Hold that contraction for a second and slowly go back to the original position while breathing in.","Repeat for the recommended amount of repetitions."],"sh":1,"p":12,"fo":"pull","pt":"Remada na polia elevada"},{"id":"External_Rotation_with_Cable","n":"External Rotation with Cable","eq":"cable","lv":"beginner","pm":["shoulders"],"sm":[],"mc":"isolation","ins":["Adjust the cable to the same height as your elbow. Stand with your left side to the band a couple of feet away.","Grasp the handle with your right hand, and
